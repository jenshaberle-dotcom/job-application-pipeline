name: Private origin LLM model campaign

on:
  repository_dispatch:
    types: [origin-provider-benchmark-requested]

permissions:
  contents: read
  id-token: write

concurrency:
  group: private-origin-llm-model-campaign
  cancel-in-progress: false

jobs:
  validate-event:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate metadata-only dispatch contract
        env:
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          python - <<'PY'
          import json
          import os
          import re

          payload = json.loads(os.environ["CLIENT_PAYLOAD"])
          required = {
              "schema_version",
              "pipeline_repository",
              "pipeline_ref",
              "projection_fingerprint",
              "max_candidates",
              "search_query_limit",
              "search_max_results",
              "max_provider_requests",
              "target_location",
              "requested_at",
          }
          if set(payload) != required:
              raise SystemExit("invalid repository_dispatch field set")
          if payload["schema_version"] != "origin_provider_dispatch.v1":
              raise SystemExit("invalid dispatch schema")
          if payload["pipeline_repository"] != "jenshaberle-dotcom/job-application-pipeline":
              raise SystemExit("invalid pipeline repository")
          if not re.fullmatch(r"[0-9a-f]{40,64}", str(payload["pipeline_ref"])):
              raise SystemExit("pipeline_ref must be an exact commit SHA")
          if not re.fullmatch(r"[0-9a-f]{64}", str(payload["projection_fingerprint"])):
              raise SystemExit("invalid projection fingerprint")
          limits = {
              "max_candidates": (1, 6),
              "search_query_limit": (1, 2),
              "search_max_results": (1, 5),
              "max_provider_requests": (1, 12),
          }
          for key, (minimum, maximum) in limits.items():
              value = int(payload[key])
              if not minimum <= value <= maximum:
                  raise SystemExit(f"{key} outside fixed campaign envelope")
          PY

  run-model-campaign:
    needs: validate-event
    # Replace @main with the accepted public merge SHA before activation.
    uses: jenshaberle-dotcom/job-application-pipeline/.github/workflows/reusable-origin-llm-model-campaign.yml@main
    with:
      pipeline_ref: ${{ github.event.client_payload.pipeline_ref }}
      expected_fingerprint: ${{ github.event.client_payload.projection_fingerprint }}
      max_candidates: ${{ github.event.client_payload.max_candidates }}
      search_query_limit: ${{ github.event.client_payload.search_query_limit }}
      search_max_results: ${{ github.event.client_payload.search_max_results }}
      max_provider_requests: ${{ github.event.client_payload.max_provider_requests }}
      target_location: ${{ github.event.client_payload.target_location }}
      market_evidence_limit: 10
      max_url_candidates: 20
      no_probe: false
      tailscale_tags: tag:github-origin-benchmark
      origin_evidence_max_candidates_per_company: 3
      origin_evidence_max_http_requests: 30

      # One-time fixed benchmark. All models receive the identical evidence task.
      campaign_mode: benchmark
      benchmark_models: gpt-5.4-mini,gpt-5.6-terra,gpt-5.5
      benchmark_max_cases: 6
      benchmark_max_requests: 18
      benchmark_max_estimated_cost_usd: 0.50
      reasoning_effort: low
      max_output_tokens: 600

      # Used only after the benchmark has proved a route and campaign_mode changes
      # to adjudicate. Keep explicit so the later production boundary is visible.
      primary_model: gpt-5.4-mini
      escalation_model: gpt-5.5
      max_primary_requests: 2
      max_escalation_requests: 2
      escalation_max_estimated_cost_usd: 0.15
    secrets:
      ts_oauth_client_id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      ts_audience: ${{ secrets.TS_AUDIENCE }}
      tavily_api_key: ${{ secrets.TAVILY_API_KEY }}
      postgres_host: ${{ secrets.POSTGRES_HOST }}
      postgres_port: ${{ secrets.POSTGRES_PORT }}
      postgres_db: ${{ secrets.POSTGRES_DB }}
      postgres_user: ${{ secrets.ORIGIN_BENCHMARK_DB_USER }}
      postgres_password: ${{ secrets.ORIGIN_BENCHMARK_DB_PASSWORD }}
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}
