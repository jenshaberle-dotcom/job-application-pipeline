name: Freeze-II job-first Census comparison flight

on:
  workflow_dispatch:
    inputs:
      search_backend:
        description: "External-index transport; none is zero-provider-request default"
        required: true
        default: none
        type: choice
        options:
          - none
          - tavily
      allow_paid_external_provider:
        description: "Explicit operator consent required when search_backend=tavily"
        required: true
        default: false
        type: boolean
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: freeze2-job-first-census-comparison
  cancel-in-progress: false

jobs:
  comparison:
    name: Read-only job-first Census comparison
    if: >-
      ${{ vars.RCC_JAP_BLUE_ASSIGNMENT_FROZEN != 'true' &&
          (
            (github.event_name == 'workflow_dispatch' &&
             github.ref == 'refs/heads/main') ||
            (github.event_name == 'issue_comment' &&
             github.event.issue.number == 1066 &&
             github.event.comment.user.login == 'jenshaberle-dotcom' &&
             github.event.comment.author_association == 'OWNER' &&
             startsWith(github.event.comment.body, '<!-- jap-freeze2-census-comparison:run:v1 -->'))
          ) }}
    runs-on: [self-hosted, Linux, X64, job-pipeline-runtime-linux]
    timeout-minutes: 30
    env:
      RCC_REPOSITORY_ID: "1230805345"
      RCC_REPOSITORY: jenshaberle-dotcom/job-application-pipeline
      RCC_RUNNER_NAME: job-pipeline-runtime-linux
      CENSUS_OUTPUT: /tmp/job-first-employer-discovery-census-comparison.json
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      WORKFLOW_SEARCH_BACKEND: ${{ inputs.search_backend }}
      WORKFLOW_ALLOW_PAID_EXTERNAL_PROVIDER: ${{ inputs.allow_paid_external_provider }}
      COMMENT_BODY: ${{ github.event.comment.body }}

    steps:
      - name: Check out exact main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve verified RCC runtime context
        shell: bash
        run: |
          set -euo pipefail
          context_file="${RCC_RUNTIME_CONTEXT_FILE:-$HOME/.config/DeepOceanInfrastructure/RCC/runtime-contexts/${RCC_REPOSITORY_ID}-${RCC_RUNNER_NAME}.json}"
          test -f "$context_file"
          context_output="$(python3 - "$context_file" "$RCC_REPOSITORY_ID" "$RCC_REPOSITORY" "$RCC_RUNNER_NAME" <<'PY'
          import json
          import sys
          from pathlib import PurePosixPath

          path, repo_id, repository, runner = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              context = json.load(handle)
          if context.get("RepositoryId") != int(repo_id):
              raise SystemExit("RUNTIME_REPOSITORY_ID_MISMATCH")
          if context.get("Repository") != repository:
              raise SystemExit("RUNTIME_REPOSITORY_MISMATCH")
          if context.get("RunnerName") != runner:
              raise SystemExit("RUNTIME_RUNNER_MISMATCH")
          if context.get("Platform") != "linux-wsl":
              raise SystemExit("RUNTIME_PLATFORM_MISMATCH")
          if context.get("Status") != "PASS" or context.get("PrimaryFailure") not in (None, ""):
              raise SystemExit("RUNTIME_CONTEXT_NOT_PASS")
          checks = {
              item.get("Id"): item.get("Status")
              for item in context.get("Checks", [])
              if isinstance(item, dict)
          }
          required = {
              "repository_identity",
              "checkout",
              "checkout_repository",
              "env_file",
              "env_keys",
              "interpreter",
              "interpreter_probe",
              "capability:postgresql",
          }
          failed = sorted(key for key in required if checks.get(key) != "PASS")
          if failed:
              raise SystemExit("RUNTIME_CHECKS_NOT_PASS:" + ",".join(failed))
          checkout = context.get("CheckoutRoot")
          interpreter = context.get("Interpreter")
          env_file = context.get("EnvFile")
          root = PurePosixPath(checkout)
          if root not in PurePosixPath(interpreter).parents:
              raise SystemExit("INTERPRETER_OUTSIDE_CHECKOUT")
          if root not in PurePosixPath(env_file).parents:
              raise SystemExit("ENV_OUTSIDE_CHECKOUT")
          print(interpreter)
          print(env_file)
          PY
          )"
          mapfile -t values <<< "$context_output"
          test "${#values[@]}" -eq 2
          printf 'RUNTIME_PYTHON=%s\n' "${values[0]}" >> "$GITHUB_ENV"
          printf 'RUNTIME_ENV_FILE=%s\n' "${values[1]}" >> "$GITHUB_ENV"

      - name: Resolve explicit flight request
        shell: bash
        run: |
          set -euo pipefail
          backend="${WORKFLOW_SEARCH_BACKEND:-}"
          allow_paid="${WORKFLOW_ALLOW_PAID_EXTERNAL_PROVIDER:-}"

          if [[ "${GITHUB_EVENT_NAME:-}" == "issue_comment" ]]; then
            if [[ "${COMMENT_BODY:-}" =~ provider=(tavily|none) ]]; then
              backend="${BASH_REMATCH[1]}"
            else
              echo "Issue-comment trigger requires provider=tavily|none." >&2
              exit 2
            fi
            if [[ "${COMMENT_BODY:-}" =~ allow_paid=(true|false) ]]; then
              allow_paid="${BASH_REMATCH[1]}"
            else
              allow_paid="false"
            fi
          fi

          if [[ -z "$backend" ]]; then
            backend="none"
          fi
          if [[ -z "$allow_paid" ]]; then
            allow_paid="false"
          fi

          echo "SEARCH_BACKEND=$backend" >> "$GITHUB_ENV"
          echo "ALLOW_PAID_EXTERNAL_PROVIDER=$allow_paid" >> "$GITHUB_ENV"

      - name: Enforce paid-provider double gate
        shell: bash
        run: |
          set -euo pipefail
          case "$SEARCH_BACKEND" in
            none)
              ;;
            tavily)
              if [[ "$ALLOW_PAID_EXTERNAL_PROVIDER" != "true" ]]; then
                echo "Tavily selected without explicit paid-provider authorization." >&2
                exit 2
              fi
              ;;
            *)
              echo "Unsupported backend: $SEARCH_BACKEND" >&2
              exit 2
              ;;
          esac

      - name: Qualify Census comparison contracts
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" -m pytest -q \
            tests/test_employer_discovery_census.py \
            tests/test_employer_discovery_census_adapter.py \
            tests/test_external_index_job_sensors.py \
            tests/test_market_source_access.py \
            tests/test_census_comparison_flight.py
          "$RUNTIME_PYTHON" -m ruff check \
            src/search_intelligence/census_flight_authority.py \
            src/search_intelligence/external_index_job_sensors.py \
            scripts/run_job_first_employer_discovery_census_comparison.py \
            tests/test_census_comparison_flight.py

      - name: Run read-only Census comparison
        shell: bash
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1090
          source "$RUNTIME_ENV_FILE"
          set +a
          export PGOPTIONS="-c default_transaction_read_only=on"

          args=(
            --provider "$SEARCH_BACKEND"
            --max-terms 2
            --max-locations 1
            --max-results 5
            --radius-km 50
            --page-size 10
            --output "$CENSUS_OUTPUT"
          )
          if [[ "$ALLOW_PAID_EXTERNAL_PROVIDER" == "true" ]]; then
            args+=(--allow-paid-external-provider)
          fi

          "$RUNTIME_PYTHON" -m scripts.run_job_first_employer_discovery_census_comparison "${args[@]}"

      - name: Upload minimised Census evidence
        uses: actions/upload-artifact@v4
        with:
          name: freeze2-job-first-census-comparison-${{ github.run_id }}
          path: ${{ env.CENSUS_OUTPUT }}
          if-no-files-found: error
          retention-days: 3

      - name: Publish aggregate comparison summary
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" - "$CENSUS_OUTPUT" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          comparison = report["comparison"]
          metrics = comparison["metrics"]
          lines = [
              "## Job-first Employer Discovery Census comparison",
              "",
              f"- source SHA: `{os.environ.get('GITHUB_SHA', '')}`",
              f"- provider: `{comparison['authority']['provider']}`",
              f"- authority: **{comparison['authority']['status']}**",
              f"- provider available: **{comparison['authority']['provider_available']}**",
              f"- candidate baseline: **{comparison['baseline_candidate_count']}**",
              f"- observed jobs: **{report['observed_job_count']}**",
              f"- qualifying jobs: **{report['qualifying_job_count']}**",
              f"- qualifying employers: **{report['employer_count']}**",
              f"- novel employers vs candidate baseline: **{report['novel_employer_count']}**",
              f"- primary incremental novel employers vs BA/StepStone + baseline: **{metrics['primary_incremental_novel_employer_count']}**",
              "",
              "### Incremental novel employers by external-index source",
          ]
          for source, count in metrics[
              "novel_incremental_employers_vs_ba_stepstone_and_candidate_baseline"
          ].items():
              lines.append(f"- {source}: **{count}**")
          lines.extend(
              [
                  "",
                  "Boundary: read-only DB; direct board requests 0; DB/Bronze/Silver/Product writes 0; candidate creation 0; connector activation 0.",
              ]
          )
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY
