name: Connector Factory Multi-Region Corpus

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact JAP Classic source SHA admitted by RCC
        required: true
        type: string
      rcc_facade_label:
        description: RCC-assigned repository facade
        required: true
        type: string
      rcc_assignment_label:
        description: Ephemeral exact assignment from RCC
        required: true
        type: string

permissions:
  contents: read

jobs:
  discover-tech:
    runs-on:
      - self-hosted
      - ${{ inputs.rcc_facade_label }}
      - ${{ inputs.rcc_assignment_label }}
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      RCC_EXPECTED_FACADE: ${{ inputs.rcc_facade_label }}
      RCC_ASSIGNMENT_LABEL: ${{ inputs.rcc_assignment_label }}
    steps:
      - name: Prove RCC assignment
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "$RCC_EXPECTED_FACADE"
          [[ "$RCC_ASSIGNMENT_LABEL" =~ ^rcc-assignment-proof-[0-9a-f]{32}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Discover complete multi-region company corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run_multi_region_company_discovery.py --output-dir artifacts/connector-corpus

      - uses: actions/upload-artifact@v4
        with:
          name: connector-factory-multi-region-corpus
          path: artifacts/
          if-no-files-found: error
