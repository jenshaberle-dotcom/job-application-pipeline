name: Connector Factory Multi-Region Corpus

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact JAP Classic source SHA admitted by RCC
        required: true
        type: string
      rcc_facade_label:
        description: RCC-assigned repository facade
        required: true
        type: string
      rcc_assignment_label:
        description: Ephemeral exact assignment from RCC
        required: true
        type: string

permissions:
  contents: read

jobs:
  discover-tech:
    runs-on:
      - self-hosted
      - ${{ inputs.rcc_facade_label }}
      - ${{ inputs.rcc_assignment_label }}
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      RCC_EXPECTED_FACADE: ${{ inputs.rcc_facade_label }}
      RCC_ASSIGNMENT_LABEL: ${{ inputs.rcc_assignment_label }}
    steps:
      - name: Prove RCC assignment
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "$RCC_EXPECTED_FACADE"
          [[ "$RCC_ASSIGNMENT_LABEL" =~ ^rcc-assignment-proof-[0-9a-f]{32}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Discover initial corpus sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/discover_hannover_tech_hsh.py --output artifacts/hannover-hsh.json
          python3 scripts/discover_munich_startups.py --output artifacts/munich-startups.json
          python3 scripts/discover_stuttgart_tech.py --output artifacts/stuttgart-tech.json
          python3 scripts/run_connector_mass_census.py             --seed artifacts/hannover-tech-hsh.json             --source hochschule_hannover_career_center             --output artifacts/hannover-tech-census.json

      - uses: actions/upload-artifact@v4
        with:
          name: hannover-tech-connector-census
          path: artifacts/
          if-no-files-found: error
