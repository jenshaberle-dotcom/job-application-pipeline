name: Bottom-up connector Cluster 0

on:
  pull_request:
    paths:
      - .github/workflows/connector-artifact-batch.yml
      - scripts/run_approved_connector_artifact_batch.py
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: bottom-up-connector-cluster0
  cancel-in-progress: false

jobs:
  contract-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Cluster 0 contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/run_approved_connector_artifact_batch.py
          f=.github/workflows/connector-artifact-batch.yml
          t=scripts/run_approved_connector_artifact_batch.py
          grep -Fq "github.event.issue.number == 522" "$f"
          grep -Fq "PIPELINE-CLUSTER0 CONNECTORS" "$f"
          grep -Fq 'SET TRANSACTION READ ONLY' "$t"
          grep -Fq 'bottom_up_cluster0_connector_creation' "$t"
          grep -Fq 'already_exists' "$t"
          grep -Fq 'shared_missing_connector_family' "$t"
          grep -Fq 'cluster0_result=' "$t"
          grep -Fq 'database_mutation=0' "$t"
          grep -Fq 'network_requests=0' "$t"
          grep -Fq 'connector_execution=0' "$t"
          grep -Fq 'source_activation=0' "$t"
          grep -Fq 'provider_requests=0' "$t"

  cluster0:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 522 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, 'PIPELINE-CLUSTER0 CONNECTORS ')
    runs-on: job-pipeline-runtime-linux
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write

    steps:
      - name: Parse strict request
        id: request
        env:
          REQUEST_TEXT: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          if int(os.environ.get('GITHUB_REPOSITORY_ID') or 0) != 1230805345:
              raise SystemExit('Pipeline repository ID mismatch')
          match = re.fullmatch(
              r'PIPELINE-CLUSTER0 CONNECTORS ([0-9a-f]{40})',
              os.environ['REQUEST_TEXT'].strip(),
          )
          if not match:
              raise SystemExit('invalid Cluster 0 request')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f'pipeline_sha={match.group(1)}\n')
          PY

      - name: Authenticate exact current Pipeline main
        env:
          REQUESTED_SHA: ${{ steps.request.outputs.pipeline_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          def get(url):
              with urlopen(Request(url, headers=headers), timeout=20) as response:
                  return json.loads(response.read().decode('utf-8'))

          repo = get('https://api.github.com/repos/jenshaberle-dotcom/job-application-pipeline')
          if int(repo.get('id') or 0) != 1230805345:
              raise SystemExit('Pipeline repository ID mismatch')
          main = get('https://api.github.com/repos/jenshaberle-dotcom/job-application-pipeline/branches/main')
          observed = str((main.get('commit') or {}).get('sha') or '')
          requested = os.environ['REQUESTED_SHA']
          if observed != requested:
              raise SystemExit(f'Pipeline main drift requested={requested} observed={observed}')
          print(f'pipeline_main={observed}')
          PY

      - name: Check out exact Pipeline main
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.pipeline_sha }}
          persist-credentials: true
          fetch-depth: 1

      - name: Create isolated Cluster 0 branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          branch="agent/522-cluster0-connectors-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Create missing connector artifacts bottom-up
        id: build
        env:
          LOCAL_RUNTIME_ROOT: ${{ vars.JOB_PIPELINE_LOCAL_RUNTIME_ROOT }}
          MANIFEST_PATH: ${{ runner.temp }}/connector-cluster0.json
        shell: bash
        run: |
          set -euo pipefail
          root="${LOCAL_RUNTIME_ROOT:-$HOME/projects/job-application-pipeline}"
          py="$root/.venv/bin/python"
          test -x "$py" || { echo 'host-local Pipeline virtualenv Python is missing'; exit 1; }
          test -f "$root/.env" || { echo 'host-local Pipeline .env is missing'; exit 1; }

          "$py" scripts/run_approved_connector_artifact_batch.py \
            --pipeline-root "$GITHUB_WORKSPACE" \
            --local-runtime-root "$root" \
            --requested-pipeline-sha "${{ steps.request.outputs.pipeline_sha }}" \
            --manifest "$MANIFEST_PATH"

          test -f "$MANIFEST_PATH"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path
          payload=json.loads(Path(os.environ['MANIFEST_PATH']).read_text(encoding='utf-8'))
          print(f"manifest={os.environ['MANIFEST_PATH']}")
          print(f"generated_count={len(payload['generated_paths']) // 3}")
          print(f"blocked_count={payload['counts'].get('blocked', 0)}")
          print(f"created_count={payload['counts'].get('created', 0)}")
          print(f"already_exists_count={payload['counts'].get('already_exists', 0)}")
          print(f"cluster0_closed={str(bool(payload['cluster0_closed'])).lower()}")
          PY

      - name: Verify generated scope and publish Cluster 0 branch
        id: publish
        if: steps.build.outputs.generated_count != '0'
        env:
          MANIFEST_PATH: ${{ steps.build.outputs.manifest }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t paths < <(python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          payload=json.loads(Path(os.environ['MANIFEST_PATH']).read_text(encoding='utf-8'))
          for path in payload['generated_paths']:
              print(path)
          PY
          )
          test "${#paths[@]}" -gt 0

          export EXPECTED_PATHS_JSON="$(python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          payload=json.loads(Path(os.environ['MANIFEST_PATH']).read_text(encoding='utf-8'))
          print(json.dumps(sorted(payload['generated_paths'])))
          PY
          )"
          python3 - <<'PY'
          import json
          import os
          import subprocess

          expected=set(json.loads(os.environ['EXPECTED_PATHS_JSON']))
          raw=subprocess.check_output(['git','status','--porcelain=v1','-z'])
          entries=[item.decode('utf-8') for item in raw.split(b'\0') if item]
          observed=set()
          for entry in entries:
              if len(entry) < 4:
                  raise SystemExit(f'unexpected git status entry: {entry!r}')
              observed.add(entry[3:])
          if observed != expected:
              raise SystemExit(f'generated scope mismatch expected={sorted(expected)} observed={sorted(observed)}')
          print(f'generated_scope_count={len(observed)}')
          PY

          git add -- "${paths[@]}"
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name 'jenshaberle-dotcom'
          git config user.email 'jens.haberle@gmail.com'
          git commit -m 'Generate bottom-up Cluster 0 connector artifacts'
          commit_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Report Cluster 0 result
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PIPELINE_SHA: ${{ steps.request.outputs.pipeline_sha }}
          MANIFEST_PATH: ${{ steps.build.outputs.manifest }}
          GENERATED_COUNT: ${{ steps.build.outputs.generated_count }}
          CREATED_COUNT: ${{ steps.build.outputs.created_count }}
          ALREADY_EXISTS_COUNT: ${{ steps.build.outputs.already_exists_count }}
          BLOCKED_COUNT: ${{ steps.build.outputs.blocked_count }}
          CLUSTER0_CLOSED: ${{ steps.build.outputs.cluster0_closed }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          COMMIT_SHA: ${{ steps.publish.outputs.commit_sha }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let blocked = {};
            if (process.env.MANIFEST_PATH && fs.existsSync(process.env.MANIFEST_PATH)) {
              const payload = JSON.parse(fs.readFileSync(process.env.MANIFEST_PATH, 'utf8'));
              blocked = payload.blocked_causes || {};
            }
            const body = [
              '## Bottom-up Connector Cluster 0',
              '',
              `- Base Pipeline main: \`${process.env.PIPELINE_SHA || 'unknown'}\``,
              `- Created / already existed / blocked: \`${process.env.CREATED_COUNT || '0'} / ${process.env.ALREADY_EXISTS_COUNT || '0'} / ${process.env.BLOCKED_COUNT || '0'}\``,
              `- Blocked causes: \`${JSON.stringify(blocked)}\``,
              `- Cluster 0 closed: \`${process.env.CLUSTER0_CLOSED || 'false'}\``,
              `- Build / publish: \`${process.env.BUILD_OUTCOME || 'not_run'} / ${process.env.PUBLISH_OUTCOME || 'not_run'}\``,
              `- Branch: \`${process.env.BRANCH || 'none'}\``,
              `- Commit: \`${process.env.COMMIT_SHA || 'none'}\``,
              `- Run: \`${context.runId}\``,
              '- Semantics: every DB candidate is classified as `already_exists`, `created`, or `blocked:<cause>`; candidate-level failures do not hide progress for the rest of the cohort.',
              '- Boundary: DB read-only; zero network connector execution; no registration, source activation, Bronze persistence, recurring ingestion, scheduler change, provider/LLM/Tavily calls, or auto-PR.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Enforce infrastructure success
        if: always()
        shell: bash
        run: |
          test "${{ steps.build.outcome }}" = "success"
          if test "${{ steps.build.outputs.generated_count }}" != "0"; then
            test "${{ steps.publish.outcome }}" = "success"
          fi
