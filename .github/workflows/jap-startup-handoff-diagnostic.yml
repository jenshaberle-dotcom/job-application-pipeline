name: JAP startup handoff diagnostic

on:
  push:
    branches: [diag/986-startup-handoff]
    paths:
      - ".github/workflows/jap-startup-handoff-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, job-pipeline-runtime-linux]
    timeout-minutes: 5
    steps:
      - name: Read bounded installed startup state
        shell: bash
        run: |
          set -uo pipefail
          current="$(find /mnt/c/Users -maxdepth 5 -type f -path '*/AppData/Local/JAP-Control-Center/current.json' -print -quit 2>/dev/null || true)"
          if [[ -z "$current" ]]; then
            echo "JAP_DIAG=UNAVAILABLE current_json"
            exit 1
          fi
          install_root="$(dirname "$current")"
          echo "=== current identity ==="
          python3 - "$current" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          d=json.loads(p.read_text(encoding="utf-8-sig"))
          for k in ("repository_id","repository","pinned_sha","desktop_host_version","wsl_distro","wsl_project_root","managed_worktree","wsl_state_root","wsl_installed_runner_path"):
              print(f"{k}={d.get(k,'')}")
          PY
          state_root="$(python3 -c 'import json,sys; from pathlib import Path; print(json.loads(Path(sys.argv[1]).read_text(encoding="utf-8-sig")).get("wsl_state_root",""))' "$current")"
          runner="$(python3 -c 'import json,sys; from pathlib import Path; print(json.loads(Path(sys.argv[1]).read_text(encoding="utf-8-sig")).get("wsl_installed_runner_path",""))' "$current")"
          echo "=== runtime stderr ==="
          tail -n 80 "$state_root/runtime.stderr.log" 2>/dev/null || echo MISSING
          echo "=== runtime stdout ==="
          tail -n 80 "$state_root/runtime.stdout.log" 2>/dev/null || echo MISSING
          echo "=== update state ==="
          for rel in state/pending-update.json state/accepted-update.json state/update-result.json state/update-snooze.json state/runtime.json; do
            echo "--- $rel"
            sed -n '1,160p' "$install_root/$rel" 2>/dev/null || echo MISSING
          done
          echo "=== update logs ==="
          for rel in logs/product-update-agent.log logs/desktop-host-update.log logs/desktop-host-startup.log logs/desktop-host-lifecycle.log logs/update-apply.log; do
            echo "--- $rel"
            tail -n 120 "$install_root/$rel" 2>/dev/null || echo MISSING
          done
          echo "=== installed desktop ==="
          find "$install_root/desktop-host" -maxdepth 2 -type f -printf '%P %s\n' 2>/dev/null | sort | head -n 120
          echo "=== staged updates ==="
          find "$install_root/updates" -maxdepth 4 -type f -printf '%P %s\n' 2>/dev/null | sort | tail -n 160
          echo "=== installed runner identity ==="
          sha256sum "$runner" 2>/dev/null || true
          grep -nE 'ACTION.*launch|nohup setsid|detached_runtime_handoff|LOCAL_OSS_SITE|frontend_not_prepared' "$runner" 2>/dev/null || true
          echo "=== runtime process / port ==="
          ps -ef | grep -E 'run_product_v1_live_demo|run_jap_windows_control_center|python.*8780' | grep -v grep || true
          ss -ltnp 2>/dev/null | grep ':8780' || echo NO_LISTENER
