name: Product V1 assessment cohort

on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
      rcc_facade_label:
        required: true
        type: string
      rcc_assignment_label:
        required: true
        type: string
      evaluated_target:
        required: true
        default: "10"
        type: string
      top5_target:
        required: true
        default: "5"
        type: string
      candidate_cap:
        required: true
        default: "10"
        type: string

permissions:
  contents: read

concurrency:
  group: product-v1-assessment-cohort
  cancel-in-progress: false

jobs:
  assess:
    name: Reusable Product assessment cohort and Top 5
    runs-on:
      - self-hosted
      - ${{ inputs.rcc_facade_label }}
      - ${{ inputs.rcc_assignment_label }}
    timeout-minutes: 45
    env:
      RCC_REPOSITORY_ID: "1230805345"
      RCC_REPOSITORY: jenshaberle-dotcom/job-application-pipeline
      RCC_EXPECTED_FACADE: ${{ inputs.rcc_facade_label }}
      RCC_ASSIGNMENT_LABEL: ${{ inputs.rcc_assignment_label }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      EVALUATED_TARGET: ${{ inputs.evaluated_target }}
      TOP5_TARGET: ${{ inputs.top5_target }}
      CANDIDATE_CAP: ${{ inputs.candidate_cap }}
      PLAN_OUTPUT: /tmp/jap-product-assessment-cohort-plan.json
      APPLY_OUTPUT: /tmp/jap-product-assessment-cohort-apply.json
      COHORT_APPROVAL_TOKEN: PRODUCT-V1-ASSESSMENT-COHORT-001

    steps:
      - name: Prove exact RCC assignment handoff
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNNER_NAME"
          test -n "$RCC_EXPECTED_FACADE"
          test "$RUNNER_NAME" = "$RCC_EXPECTED_FACADE"
          [[ "$RCC_ASSIGNMENT_LABEL" =~ ^rcc-assignment-proof-[0-9a-f]{32}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVALUATED_TARGET" =~ ^[0-9]+$ ]]
          [[ "$TOP5_TARGET" =~ ^[0-9]+$ ]]
          [[ "$CANDIDATE_CAP" =~ ^[0-9]+$ ]]
          test "$EVALUATED_TARGET" -ge 1
          test "$EVALUATED_TARGET" -le 25
          test "$TOP5_TARGET" -eq 5
          test "$CANDIDATE_CAP" -eq "$EVALUATED_TARGET"
          printf 'RCC_ASSIGNED_RUNNER=%s\n' "$RUNNER_NAME" >> "$GITHUB_ENV"
          echo "ASSESSMENT_COHORT_RCC_HANDOFF=PASS facade=$RCC_EXPECTED_FACADE assignment=$RCC_ASSIGNMENT_LABEL runner=$RUNNER_NAME"

      - name: Check out exact approved main
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact source identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$SOURCE_SHA"
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$SOURCE_SHA"
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          echo "ASSESSMENT_COHORT_EXACT_SOURCE=PASS source=$actual"

      - name: Resolve verified RCC runtime context
        shell: bash
        run: |
          set -euo pipefail
          context_file="${RCC_RUNTIME_CONTEXT_FILE:-$HOME/.config/DeepOceanInfrastructure/RCC/runtime-contexts/${RCC_REPOSITORY_ID}-${RCC_ASSIGNED_RUNNER}.json}"
          test -f "$context_file"
          context_output="$(python3 - "$context_file" "$RCC_REPOSITORY_ID" "$RCC_REPOSITORY" "$RCC_ASSIGNED_RUNNER" <<'PY'
          import json
          import sys
          from pathlib import PurePosixPath

          path, repo_id, repository, runner = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              context = json.load(handle)
          if context.get("RepositoryId") != int(repo_id):
              raise SystemExit("RUNTIME_REPOSITORY_ID_MISMATCH")
          if context.get("Repository") != repository:
              raise SystemExit("RUNTIME_REPOSITORY_MISMATCH")
          if context.get("RunnerName") != runner:
              raise SystemExit("RUNTIME_CONTEXT_STALE: runner mismatch")
          if context.get("Platform") != "linux-wsl":
              raise SystemExit("RUNTIME_CONTEXT_STALE: platform mismatch")
          if context.get("Status") != "PASS" or context.get("PrimaryFailure") not in (None, ""):
              raise SystemExit("RUNTIME_CONTEXT_NOT_PASS")
          checks = {
              item.get("Id"): item.get("Status")
              for item in context.get("Checks", [])
              if isinstance(item, dict)
          }
          required = {
              "repository_identity",
              "checkout",
              "checkout_repository",
              "env_file",
              "env_keys",
              "interpreter",
              "interpreter_probe",
              "capability:postgresql",
          }
          failed = sorted(key for key in required if checks.get(key) != "PASS")
          if failed:
              raise SystemExit("RUNTIME_CHECKS_NOT_PASS:" + ",".join(failed))
          checkout = context.get("CheckoutRoot")
          interpreter = context.get("Interpreter")
          env_file = context.get("EnvFile")
          root = PurePosixPath(checkout)
          if root not in PurePosixPath(interpreter).parents:
              raise SystemExit("INTERPRETER_OUTSIDE_QUALIFIED_CHECKOUT")
          if root not in PurePosixPath(env_file).parents:
              raise SystemExit("ENV_OUTSIDE_QUALIFIED_CHECKOUT")
          print(interpreter)
          print(env_file)
          PY
          )"
          mapfile -t values <<< "$context_output"
          test "${#values[@]}" -eq 2
          test -x "${values[0]}"
          test -s "${values[1]}"
          printf 'COHORT_PYTHON=%s\n' "${values[0]}" >> "$GITHUB_ENV"
          printf 'RUNTIME_ENV_FILE=%s\n' "${values[1]}" >> "$GITHUB_ENV"
          echo "ASSESSMENT_COHORT_RCC_RUNTIME=PASS runner=${RUNNER_NAME:-unknown}"

      - name: Prove reusable cohort imports
        shell: bash
        run: |
          set -euo pipefail
          "$COHORT_PYTHON" -m pip check
          "$COHORT_PYTHON" - <<'PY'
          import scripts.run_product_v1_assessment_cohort
          import src.search_intelligence.product_v1_assessment_evidence
          import src.search_intelligence.product_v1_profile_fit_coverage
          print("ASSESSMENT_COHORT_IMPORTS=PASS")
          PY

      - name: Read-only plan Product assessment cohort
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$RUNTIME_ENV_FILE"
          set +a
          export PGOPTIONS="-c default_transaction_read_only=on"
          "$COHORT_PYTHON" -m scripts.run_product_v1_assessment_cohort             --evaluated-target "$EVALUATED_TARGET"             --top5-target "$TOP5_TARGET"             --candidate-cap "$CANDIDATE_CAP"             --reviewed-by "product-cohort-plan:rcc"             --output "$PLAN_OUTPUT"
          echo "ASSESSMENT_COHORT_PLAN=PASS"

      - name: Apply existing Product authorities
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$RUNTIME_ENV_FILE"
          set +a
          unset PGOPTIONS || true
          "$COHORT_PYTHON" -m scripts.run_product_v1_assessment_cohort             --evaluated-target "$EVALUATED_TARGET"             --top5-target "$TOP5_TARGET"             --candidate-cap "$CANDIDATE_CAP"             --reviewed-by "product-cohort:rcc"             --apply             --approval-token "$COHORT_APPROVAL_TOKEN"             --output "$APPLY_OUTPUT"
          echo "ASSESSMENT_COHORT_APPLY=PASS"

      - name: Prove final Product truth
        shell: bash
        run: |
          set -euo pipefail
          "$COHORT_PYTHON" - "$APPLY_OUTPUT" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          if payload.get("schema") != "job_application_pipeline.product_v1_assessment_cohort.v1":
              raise SystemExit("ASSESSMENT_COHORT_SCHEMA_MISMATCH")
          if payload.get("target_met") is not True:
              raise SystemExit("ASSESSMENT_COHORT_TARGET_NOT_MET")
          final = payload.get("final") or {}
          targets = payload.get("targets") or {}
          evaluated_target = int(targets.get("evaluated_jobs") or 0)
          top5_target = int(targets.get("top5_jobs") or 0)
          if evaluated_target < 1 or top5_target != 5:
              raise SystemExit("ASSESSMENT_COHORT_TARGET_CONTRACT_INVALID")
          if int(final.get("profile_fit_complete_count") or 0) < evaluated_target:
              raise SystemExit("ASSESSMENT_COHORT_COMPLETE_FIT_BELOW_TARGET")
          if int(final.get("candidate_fit_authoritative_count") or 0) < evaluated_target:
              raise SystemExit("ASSESSMENT_COHORT_CANDIDATE_FIT_BELOW_TARGET")
          if int(final.get("affinity_authoritative_count") or 0) < evaluated_target:
              raise SystemExit("ASSESSMENT_COHORT_AFFINITY_BELOW_TARGET")
          if int(final.get("profile_fit_passed_count") or 0) < top5_target:
              raise SystemExit("ASSESSMENT_COHORT_PASSED_FIT_BELOW_TOP5_TARGET")
          if int(final.get("rankable_job_count") or 0) < top5_target:
              raise SystemExit("ASSESSMENT_COHORT_RANKABLE_BELOW_TOP5_TARGET")
          if int(final.get("top_job_count") or 0) != top5_target:
              raise SystemExit("ASSESSMENT_COHORT_TOP5_COUNT_MISMATCH")
          if final.get("top5_authority_violations"):
              raise SystemExit("ASSESSMENT_COHORT_TOP5_AUTHORITY_VIOLATION")
          print("ASSESSMENT_COHORT_PRODUCT_TRUTH=PASS")
          for row in final.get("top_jobs") or []:
              print(
                  "TOP5_JOB="
                  f"{row.get('product_rank')}|{row.get('silver_job_id')}|"
                  f"{row.get('affinity_score')}|{row.get('company_name')}|{row.get('title')}"
              )
          PY

      - name: Upload immutable cohort evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-v1-assessment-cohort-${{ github.run_id }}
          path: |
            /tmp/jap-product-assessment-cohort-plan.json
            /tmp/jap-product-assessment-cohort-apply.json
            .runtime/product/product_v1_assessment_cohort.json
            .runtime/product/product_v1_rankable_refill_materialization.json
            .runtime/product/product_v1_rankable_refill_apply.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
