name: F4A-R8 operator acceptance preflight

on:
  push:
    branches: [agent/f4a-r8-operator-acceptance]
    paths:
      - "src/connectors/generic_job_detail_evidence.py"
      - "src/search_intelligence/detail_semantics_deterministic.py"
      - "src/search_intelligence/requirement_section_evidence.py"
      - "src/silver/requirement_evidence_projection.py"
      - "src/silver/operator_requirement_semantics.py"
      - "scripts/run_f4a_r3_silver_requirement_backfill.py"
      - "scripts/run_f4a_r3_bronze2e_requirement_audit.py"
      - "scripts/product_v1_silver_requirement_projection.py"
      - "scripts/product_v1_job_presentation_runtime.py"
      - "scripts/run_f4a_requirement_evidence_refresh.py"
      - ".github/workflows/f4a-r8-operator-preflight.yml"
      - ".github/workflows/f4a-r8-operator-apply.yml"
      - "docs/planning/active/F4A-R8-OPERATOR-ACCEPTANCE.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f4a-r8-operator-preflight
  cancel-in-progress: true

jobs:
  preflight:
    name: Requalify Origin to Silver to Product to Control Center
    runs-on: [self-hosted, Linux, X64, job-pipeline-runtime-linux]
    timeout-minutes: 40
    env:
      RCC_REPOSITORY_ID: "1230805345"
      RCC_REPOSITORY: jenshaberle-dotcom/job-application-pipeline
      RCC_RUNNER_NAME: job-pipeline-runtime-linux

    steps:
      - name: Check out exact R8 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind verified RCC runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          context_file="${RCC_RUNTIME_CONTEXT_FILE:-$HOME/.config/DeepOceanInfrastructure/RCC/runtime-contexts/${RCC_REPOSITORY_ID}-${RCC_RUNNER_NAME}.json}"
          test -f "$context_file"
          context_output="$(python3 - "$context_file" "$RCC_REPOSITORY_ID" "$RCC_REPOSITORY" "$RCC_RUNNER_NAME" <<'PY'
          import json, sys
          from pathlib import PurePosixPath
          path, repo_id, repository, runner = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              context = json.load(handle)
          if context.get("RepositoryId") != int(repo_id) or context.get("Repository") != repository or context.get("RunnerName") != runner:
              raise SystemExit("RUNTIME_CONTEXT_IDENTITY_MISMATCH")
          if context.get("Status") != "PASS" or context.get("PrimaryFailure") not in (None, ""):
              raise SystemExit("RUNTIME_CONTEXT_NOT_PASS")
          root = PurePosixPath(context["CheckoutRoot"])
          if root not in PurePosixPath(context["Interpreter"]).parents or root not in PurePosixPath(context["EnvFile"]).parents:
              raise SystemExit("RUNTIME_CONTEXT_PATH_MISMATCH")
          print(context["Interpreter"])
          print(context["EnvFile"])
          PY
          )"
          mapfile -t values <<< "$context_output"
          test "${#values[@]}" -eq 2
          echo "RUNTIME_PYTHON=${values[0]}" >> "$GITHUB_ENV"
          echo "RUNTIME_ENV_FILE=${values[1]}" >> "$GITHUB_ENV"

      - name: Load masked Product DB environment
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" - "$RUNTIME_ENV_FILE" "$GITHUB_ENV" <<'PY'
          import secrets, sys
          from pathlib import Path
          from dotenv import dotenv_values
          values = dotenv_values(Path(sys.argv[1]))
          required = ("POSTGRES_HOST", "POSTGRES_PORT", "POSTGRES_DB", "POSTGRES_USER", "POSTGRES_PASSWORD")
          missing = [key for key in required if values.get(key) in (None, "")]
          if missing:
              raise SystemExit("RUNTIME_ENV_POSTGRES_KEYS_MISSING:" + ",".join(missing))
          print(f"::add-mask::{values['POSTGRES_PASSWORD']}")
          with Path(sys.argv[2]).open("a", encoding="utf-8") as handle:
              for key in required:
                  value = str(values[key])
                  marker = f"JAP_ENV_{secrets.token_hex(12)}"
                  handle.write(f"{key}<<{marker}\n{value}\n{marker}\n")
          PY

      - name: Resolve pinned local OSS runtime
        shell: bash
        run: |
          set -euo pipefail
          site="$(bash scripts/ensure_pinned_local_oss_runtime.sh "$RUNTIME_PYTHON" requirements.txt "$RUNNER_TEMP/jap-f4a-r8-local-oss-sites")"
          test -d "$site"
          echo "PYTHONPATH=$site:${PYTHONPATH:-}" >> "$GITHUB_ENV"

      - name: Requalify focused operator contracts
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" -m pytest -q \
            tests/test_generic_job_detail_evidence.py \
            tests/test_detail_semantics_deterministic.py \
            tests/test_requirement_section_evidence.py \
            tests/test_silver_requirement_evidence_projection.py \
            tests/test_operator_requirement_semantics.py \
            tests/test_f4a_r3_silver_requirement_backfill.py \
            tests/test_f4a_r3_bronze2e_requirement_audit.py \
            tests/test_f4a_r3_operator_metadata_projection.py \
            tests/test_f4a_r6_requirement_fit_clarity.py
          "$RUNTIME_PYTHON" -m ruff check \
            src/connectors/generic_job_detail_evidence.py \
            src/search_intelligence/detail_semantics_deterministic.py \
            src/search_intelligence/requirement_section_evidence.py \
            src/silver/requirement_evidence_projection.py \
            src/silver/operator_requirement_semantics.py \
            scripts/run_f4a_r3_silver_requirement_backfill.py \
            scripts/run_f4a_r3_bronze2e_requirement_audit.py \
            scripts/product_v1_silver_requirement_projection.py \
            scripts/product_v1_job_presentation_runtime.py

      - name: Prove migration state converged
        run: '"$RUNTIME_PYTHON" scripts/apply_db_migrations.py --status'

      - name: Plan exact-Origin Silver refresh
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/f4a_r8_silver_plan.json"
          "$RUNTIME_PYTHON" -m scripts.run_f4a_r3_silver_requirement_backfill --output "$output"
          "$RUNTIME_PYTHON" - "$output" <<'PY'
          import json, sys
          from collections import Counter, defaultdict
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          allowed = {"observed_structured", "observed_bounded_text", "source_absent", "extractor_gap", "conflict", "origin_unavailable"}
          reachable, covered, bad = [], [], []
          gaps = defaultdict(Counter)
          for proposal in report.get("proposals", []):
              statuses = {k: str((v or {}).get("status") or "missing") for k, v in ((proposal.get("payload") or {}).get("fields") or {}).items()}
              if any(status not in allowed for status in statuses.values()):
                  bad.append(proposal.get("silver_job_id"))
              if proposal.get("origin_unavailable"):
                  continue
              reachable.append(proposal)
              gap_fields = [field for field, status in statuses.items() if status == "extractor_gap"]
              if gap_fields:
                  family = str(proposal.get("source_name") or "").split(":", 1)[0] or "unknown"
                  for field in gap_fields:
                      gaps[family][field] += 1
              else:
                  covered.append(proposal)
          ratio = len(covered) / len(reachable) if reachable else 0.0
          print(f"F4A_R8_PLAN_CANDIDATES={report['candidate_count']}")
          print(f"F4A_R8_PLAN_PROPOSALS={report['proposal_count']}")
          print(f"F4A_R8_PLAN_UNAVAILABLE={report['origin_unavailable_count']}")
          print(f"F4A_R8_PLAN_REACHABLE={len(reachable)}")
          print(f"F4A_R8_PLAN_COVERED={len(covered)}")
          print(f"F4A_R8_PLAN_COVERAGE_RATIO={ratio:.4f}")
          print(f"F4A_R8_PLAN_WOULD_CHANGE={report['would_change_count']}")
          print("F4A_R8_PLAN_GAPS=" + json.dumps({k: dict(v) for k, v in gaps.items()}, sort_keys=True))
          if report["candidate_count"] <= 0 or report["proposal_count"] != report["candidate_count"] or report["blocked_count"] != 0:
              raise SystemExit("F4A_R8_PLAN_INCOMPLETE")
          if bad or not reachable or ratio < 0.80 or any(report["boundaries"].values()):
              raise SystemExit("F4A_R8_SILVER_PREFLIGHT_FAIL")
          print("F4A_R8_SILVER_PREFLIGHT=PASS")
          PY

      - name: Audit persisted Silver to Product to Control Center pre-state
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/f4a_r8_operator_prestate.json"
          "$RUNTIME_PYTHON" -m scripts.run_f4a_r3_bronze2e_requirement_audit --output "$output"
          "$RUNTIME_PYTHON" - "$output" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          print(f"F4A_R8_PRESTATE_CANDIDATES={report['candidate_count']}")
          print(f"F4A_R8_PRESTATE_OPERATOR_COUNT={report['operator_candidate_count']}")
          print(f"F4A_R8_PRESTATE_COVERAGE_RATIO={report['reachable_without_extractor_gap_ratio']:.4f}")
          print(f"F4A_R8_PRESTATE_PROJECTION_LOSS={report['rows_with_silver_to_operator_projection_loss']}")
          print(f"F4A_R8_PRESTATE_VIOLATIONS={report['violating_row_count']}")
          if report["candidate_count"] != report["operator_candidate_count"] or any(report["boundaries"].values()):
              raise SystemExit("F4A_R8_PRESTATE_STRUCTURAL_FAIL")
          print("F4A_R8_OPERATOR_PRESTATE_AUDIT=PASS")
          PY

      - name: Preflight Product requirement refresh without mutation
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/f4a_r8_product_refresh_preflight.json"
          "$RUNTIME_PYTHON" -m scripts.run_f4a_requirement_evidence_refresh --output "$output"
          "$RUNTIME_PYTHON" - "$output" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          print(f"F4A_R8_PRODUCT_CANDIDATES={report['candidate_count']}")
          print(f"F4A_R8_PRODUCT_PROPOSALS={report['proposal_count']}")
          print(f"F4A_R8_PRODUCT_BLOCKED={report['blocked_count']}")
          print(f"F4A_R8_PRODUCT_WOULD_CHANGE={report['would_change_count']}")
          print(f"F4A_R8_PRODUCT_JOBS_WITH_SKILLS={report['jobs_with_skills']}")
          if report["blocked_count"] or report["proposal_count"] != report["candidate_count"]:
              raise SystemExit("F4A_R8_PRODUCT_PREFLIGHT_FAIL")
          print("F4A_R8_PRODUCT_PREFLIGHT=PASS")
          PY

      - name: Preserve short-lived R8 preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: f4a-r8-operator-preflight-${{ github.sha }}
          path: |
            ${{ runner.temp }}/f4a_r8_silver_plan.json
            ${{ runner.temp }}/f4a_r8_operator_prestate.json
            ${{ runner.temp }}/f4a_r8_product_refresh_preflight.json
          if-no-files-found: error
          retention-days: 1
