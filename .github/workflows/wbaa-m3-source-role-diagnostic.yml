name: WBAA M3 authorized source-role diagnostic

on:
  push:
    branches: [wbaa/m3-source-role-diagnostic-20260917]
    paths:
      - .wbaa/run_m3_source_role_diagnostic.py
      - .wbaa/m3-target/contracts/m3-job-migration-manifest.json
      - .github/workflows/wbaa-m3-source-role-diagnostic.yml

permissions:
  contents: read

concurrency:
  group: wbaa-m3-source-role-diagnostic-20260917
  cancel-in-progress: false

jobs:
  diagnose:
    name: Classify M3 population at JAP architecture boundary
    runs-on: [self-hosted, Linux, X64, job-pipeline-runtime-linux]
    timeout-minutes: 30
    env:
      RCC_REPOSITORY_ID: "1230805345"
      RCC_REPOSITORY: jenshaberle-dotcom/job-application-pipeline
      RCC_RUNNER_NAME: job-pipeline-runtime-linux
      SOURCE_SHA: 27a5e78fb3041eee1b1f3964676f62d1db82a067
      TARGET_CANDIDATE: e03df393f7de9354b4c37cd33711bd3e04a0879f
      TARGET_MANIFEST_BLOB_SHA: cf303e5e63c337da1a25fcb896183f1191c5ca23
      CLASSIFIER_BLOB_SHA: d84d47d7175a16d116a44b1f561b3d7293a06c2a
      AUTHORITY_REFERENCE: WBAA#134-comment-5712090935
    steps:
      - name: Check out isolated diagnostic carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact carrier and architecture bindings
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" "$GITHUB_SHA"
          test "$(git hash-object .wbaa/m3-target/contracts/m3-job-migration-manifest.json)" = "$TARGET_MANIFEST_BLOB_SHA"
          test "$(git hash-object scripts/product_v1_job_presentation_runtime.py)" = "$CLASSIFIER_BLOB_SHA"
          git diff --exit-code "$SOURCE_SHA" -- src scripts db
          mapfile -t changed < <(git diff --name-only "$SOURCE_SHA" "$GITHUB_SHA" | sort)
          expected=(
            ".github/workflows/wbaa-m3-source-role-diagnostic.yml"
            ".wbaa/m3-target/contracts/m3-job-migration-manifest.json"
            ".wbaa/run_m3_source_role_diagnostic.py"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!expected_sorted[@]}"; do
            test "${changed[$i]}" = "${expected_sorted[$i]}"
          done
          python3 -m py_compile .wbaa/run_m3_source_role_diagnostic.py
          echo "CARRIER_BINDING=PASS source_sha=$SOURCE_SHA target_candidate=$TARGET_CANDIDATE authority=$AUTHORITY_REFERENCE"

      - name: Bind verified runtime and masked DB environment
        shell: bash
        run: |
          set -euo pipefail
          context_file="${RCC_RUNTIME_CONTEXT_FILE:-$HOME/.config/DeepOceanInfrastructure/RCC/runtime-contexts/${RCC_REPOSITORY_ID}-${RCC_RUNNER_NAME}.json}"
          mapfile -t ctx < <(python3 - "$context_file" "$RCC_REPOSITORY_ID" "$RCC_REPOSITORY" "$RCC_RUNNER_NAME" <<'PY'
          import json, sys
          from pathlib import PurePosixPath
          path, repo_id, repository, runner = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              context = json.load(handle)
          if context.get("RepositoryId") != int(repo_id) or context.get("Repository") != repository or context.get("RunnerName") != runner:
              raise SystemExit("RUNTIME_CONTEXT_IDENTITY_MISMATCH")
          if context.get("Status") != "PASS" or context.get("PrimaryFailure") not in (None, ""):
              raise SystemExit("RUNTIME_CONTEXT_NOT_PASS")
          root = PurePosixPath(context["CheckoutRoot"])
          if root not in PurePosixPath(context["Interpreter"]).parents or root not in PurePosixPath(context["EnvFile"]).parents:
              raise SystemExit("RUNTIME_CONTEXT_PATH_MISMATCH")
          print(context["Interpreter"])
          print(context["EnvFile"])
          PY
          )
          test "${#ctx[@]}" -eq 2
          runtime_python="${ctx[0]}"
          runtime_env_file="${ctx[1]}"
          "$runtime_python" - "$runtime_env_file" "$GITHUB_ENV" <<'PY'
          import secrets, sys
          from pathlib import Path
          from dotenv import dotenv_values
          values = dotenv_values(Path(sys.argv[1]))
          required = ("POSTGRES_HOST", "POSTGRES_PORT", "POSTGRES_DB", "POSTGRES_USER", "POSTGRES_PASSWORD")
          if any(values.get(key) in (None, "") for key in required):
              raise SystemExit("RUNTIME_ENV_POSTGRES_KEYS_MISSING")
          print(f"::add-mask::{values['POSTGRES_PASSWORD']}")
          with Path(sys.argv[2]).open("a", encoding="utf-8") as handle:
              for key in required:
                  marker = f"JAP_ENV_{secrets.token_hex(12)}"
                  handle.write(f"{key}<<{marker}\n{values[key]}\n{marker}\n")
          PY
          echo "RUNTIME_PYTHON=$runtime_python" >> "$GITHUB_ENV"

      - name: Prepare pinned local OSS runtime
        shell: bash
        run: |
          set -euo pipefail
          site="$(bash scripts/ensure_pinned_local_oss_runtime.sh "$RUNTIME_PYTHON" requirements.txt "$RUNNER_TEMP/wbaa-m3-source-role-sites")"
          test -d "$site"
          echo "PYTHONPATH=$site:${PYTHONPATH:-}" >> "$GITHUB_ENV"
          "$RUNTIME_PYTHON" -m py_compile .wbaa/run_m3_source_role_diagnostic.py

      - name: Execute single-use authorized read-only diagnostic
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/wbaa-m3-source-role"
          mkdir -p "$out"
          env \
            -u OPENAI_API_KEY \
            -u ANTHROPIC_API_KEY \
            -u AZURE_CLIENT_SECRET \
            -u AZURE_CREDENTIALS \
            PGAPPNAME=wbaa-m3-source-role-diagnostic \
            "$RUNTIME_PYTHON" .wbaa/run_m3_source_role_diagnostic.py \
              --repo-root "$GITHUB_WORKSPACE" \
              --manifest .wbaa/m3-target/contracts/m3-job-migration-manifest.json \
              --evidence-output "$out/evidence.json"

      - name: Verify aggregate-only evidence and no tracked mutation
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/wbaa-m3-source-role"
          "$RUNTIME_PYTHON" - "$out/evidence.json" <<'PY'
          import json, sys
          from pathlib import Path
          evidence = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if evidence["authority"]["reference"] != "WBAA#134-comment-5712090935":
              raise SystemExit("AUTHORITY_REFERENCE_MISMATCH")
          if evidence["read"]["transaction_read_only"] != "on":
              raise SystemExit("READ_ONLY_PROOF_MISSING")
          classes = evidence["aggregates"]["architecture_classes"]
          if set(classes) != {"market_sensor", "employer_origin", "other_or_unknown"}:
              raise SystemExit("ARCHITECTURE_CLASS_SCOPE_DRIFT")
          total = sum(int(group["rows"]) for group in classes.values())
          if total != int(evidence["read"]["m3_current_predicate_row_count"]):
              raise SystemExit("AGGREGATE_COUNT_MISMATCH")
          if any(bool(value) for value in evidence["effects"].values()):
              raise SystemExit("UNAUTHORIZED_EFFECT_RECORDED")
          forbidden_keys = {"title", "company_name", "external_job_id", "raw_job_id", "silver_job_id"}
          def walk(value):
              if isinstance(value, dict):
                  for key, item in value.items():
                      if key in forbidden_keys:
                          raise SystemExit(f"ROW_LEVEL_KEY_LEAK:{key}")
                      walk(item)
              elif isinstance(value, list):
                  for item in value:
                      walk(item)
              elif isinstance(value, str) and "://" in value:
                  raise SystemExit("URL_VALUE_LEAK")
          walk(evidence)
          boundary = evidence["aggregates"]["employer_origin_product_boundary"]
          print(
              "AGGREGATE_EVIDENCE_VERIFIED=PASS "
              f"rows={total} origin_current={boundary['current_product_rows']} "
              f"origin_current_invalid_url={boundary['current_product_absolute_http_invalid']}"
          )
          PY
          git diff --exit-code "$GITHUB_SHA" -- . ':(exclude).wbaa' ':(exclude).github/workflows/wbaa-m3-source-role-diagnostic.yml'
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Preserve aggregate-only diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: jap-cloud-m3-source-role-diagnostic-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/wbaa-m3-source-role/evidence.json
          if-no-files-found: error
          retention-days: 30
