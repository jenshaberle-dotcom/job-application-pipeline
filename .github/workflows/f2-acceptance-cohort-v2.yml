name: F2 acceptance cohort v2

on:
  push:
    branches: [agent/f2-acceptance-cohort]
    paths:
      - ".github/workflows/f2-acceptance-cohort-v2.yml"

permissions:
  contents: read

concurrency:
  group: f2-bounded-acceptance-cohort-v2
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: [self-hosted, Linux, X64, job-pipeline-runtime-linux]
    timeout-minutes: 180
    env:
      PRODUCT_SHA: bb12e62a4fb638fdf782a0401ed54d5fe9922221
      RCC_REPOSITORY_ID: "1230805345"
      RCC_REPOSITORY: jenshaberle-dotcom/job-application-pipeline
      RCC_RUNNER_NAME: job-pipeline-runtime-linux
      BASELINE_JSON: /tmp/jap-f2-v2-baseline.json
      PRODUCT_JSON: /tmp/jap-f2-v2-product.json
      FINAL_JSON: /tmp/jap-f2-v2-final.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact release and runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf 'F2_STARTED_AT=%s\n' "$started" >> "$GITHUB_ENV"
          context_file="${RCC_RUNTIME_CONTEXT_FILE:-$HOME/.config/DeepOceanInfrastructure/RCC/runtime-contexts/${RCC_REPOSITORY_ID}-${RCC_RUNNER_NAME}.json}"
          test -f "$context_file"
          context_output="$(python3 - "$context_file" "$RCC_REPOSITORY_ID" "$RCC_REPOSITORY" "$RCC_RUNNER_NAME" <<'PY'
          import json, sys
          from pathlib import PurePosixPath
          path, repo_id, repository, runner = sys.argv[1:]
          context=json.load(open(path,encoding='utf-8'))
          assert context.get('RepositoryId') == int(repo_id)
          assert context.get('Repository') == repository
          assert context.get('RunnerName') == runner
          assert context.get('Platform') == 'linux-wsl'
          assert context.get('Status') == 'PASS'
          checks={x.get('Id'):x.get('Status') for x in context.get('Checks',[]) if isinstance(x,dict)}
          required={'repository_identity','checkout','checkout_repository','env_file','env_keys','interpreter','interpreter_probe','capability:postgresql'}
          missing=sorted(x for x in required if checks.get(x)!='PASS')
          if missing: raise SystemExit('RUNTIME_CHECKS_NOT_PASS:'+','.join(missing))
          root=PurePosixPath(context['CheckoutRoot'])
          assert root in PurePosixPath(context['Interpreter']).parents
          assert root in PurePosixPath(context['EnvFile']).parents
          print(context['Interpreter']); print(context['EnvFile'])
          PY
          )"
          mapfile -t vals <<< "$context_output"
          test "${#vals[@]}" -eq 2
          printf 'RUNTIME_PYTHON=%s\nRUNTIME_ENV_FILE=%s\n' "${vals[0]}" "${vals[1]}" >> "$GITHUB_ENV"
          echo "F2_EXACT_RELEASE=$PRODUCT_SHA"

      - name: Load masked DB environment and OSS runtime
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" - "$RUNTIME_ENV_FILE" "$GITHUB_ENV" <<'PY'
          import secrets,sys
          from pathlib import Path
          from dotenv import dotenv_values
          values=dotenv_values(Path(sys.argv[1]))
          required=('POSTGRES_HOST','POSTGRES_PORT','POSTGRES_DB','POSTGRES_USER','POSTGRES_PASSWORD')
          missing=[k for k in required if not values.get(k)]
          if missing: raise SystemExit('MISSING_DB_ENV:'+','.join(missing))
          print('::add-mask::'+str(values['POSTGRES_PASSWORD']))
          with Path(sys.argv[2]).open('a',encoding='utf-8') as h:
              for k in required:
                  v=str(values[k]); marker='JAP_'+secrets.token_hex(10)
                  h.write(f'{k}<<{marker}\n{v}\n{marker}\n')
          PY
          local_oss_site="$(bash scripts/ensure_pinned_local_oss_runtime.sh "$RUNTIME_PYTHON" requirements.txt "$RUNNER_TEMP/jap-f2-v2-oss")"
          test -d "$local_oss_site"
          printf 'PYTHONPATH=%s:%s\n' "$local_oss_site" "${PYTHONPATH:-}" >> "$GITHUB_ENV"

      - name: Snapshot five-company acceptance baseline
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" - "$BASELINE_JSON" <<'PY'
          import json,os,sys,psycopg
          from psycopg.rows import dict_row
          labels={
            'valuny':['valuny'], 'hdi':['hdi'], 'triology':['triology'],
            'gridx':['gridx'], 'teccle':['teccle','teccle_group']}
          conn=psycopg.connect(host=os.environ['POSTGRES_HOST'],port=int(os.environ['POSTGRES_PORT']),dbname=os.environ['POSTGRES_DB'],user=os.environ['POSTGRES_USER'],password=os.environ['POSTGRES_PASSWORD'],row_factory=dict_row)
          out={}
          with conn,conn.cursor() as cur:
            for label,aliases in labels.items():
              cur.execute('''SELECT id,company_key,company_name,candidate_url,status FROM employer_origin_source_candidates WHERE lower(company_key)=ANY(%s) ORDER BY updated_at DESC NULLS LAST,id DESC LIMIT 1''',(aliases,))
              c=cur.fetchone(); key=str(c['company_key']) if c else ('teccle' if label=='teccle' else label); source='generic_origin:'+key
              cur.execute("SELECT count(*) n FROM ingestion_runs WHERE source_name=%s AND status='success' AND coalesce(total_loaded,0)>0",(source,)); positive=int(cur.fetchone()['n'])
              cur.execute('SELECT count(*) n FROM raw_jobs WHERE source_name=%s',(source,)); bronze=int(cur.fetchone()['n'])
              cur.execute('SELECT count(*) n FROM silver_jobs WHERE source_name=%s',(source,)); silver=int(cur.fetchone()['n'])
              cur.execute('SELECT count(*) n FROM search_profiles WHERE source_name=%s AND is_active AND recurring_ingestion_enabled',(source,)); active=int(cur.fetchone()['n'])>0
              out[label]={'candidate':dict(c) if c else None,'key':key,'source':source,'active':active,'positive_runs':positive,'bronze':bronze,'silver':silver,'lifecycle_cold':positive==0 and bronze==0 and silver==0}
          json.dump(out,open(sys.argv[1],'w',encoding='utf-8'),indent=2,default=str,ensure_ascii=False)
          for label,x in out.items():
            c=x['candidate'] or {}
            print(f"F2_BASELINE={label}|candidate={bool(x['candidate'])}|key={x['key']}|status={c.get('status','-')}|url={c.get('candidate_url') or '-'}|active={x['active']}|positive={x['positive_runs']}|bronze={x['bronze']}|silver={x['silver']}|cold={x['lifecycle_cold']}")
          PY

      - name: Add discovery-cold observations for gridX and teccle
        shell: bash
        run: |
          set -u
          for spec in \
            'gridX|Senior Data Engineer - Flexibility (all genders)' \
            'teccle group|Senior Data Engineer & Consultant (all genders) - Microsoft Fabric'
          do
            company="${spec%%|*}"; title="${spec#*|}"
            set +e
            "$RUNTIME_PYTHON" -m scripts.run_market003_external_market_observation \
              --company-name "$company" --title "$title" \
              --observation-channel linkedin --location 'Deutschland (Remote)' \
              --remote-signal remote_possible --relevance-signal strong \
              --note 'Operator-provided LinkedIn screenshot 2026-09-11; discovery evidence only.' \
              --recorded-by "f2-acceptance-${GITHUB_RUN_ID}" --write
            rc=$?
            set -e
            echo "F2_DISCOVERY_OBSERVATION=$company|exit=$rc"
          done
          exit 0

      - name: Best-effort canonical candidate ingress for discovery-cold companies
        shell: bash
        run: |
          set -u
          for key in gridx teccle
          do
            exists="$($RUNTIME_PYTHON - "$key" <<'PY'
          import os,sys,psycopg
          from psycopg.rows import dict_row
          aliases=[sys.argv[1]] + (['teccle_group'] if sys.argv[1]=='teccle' else [])
          with psycopg.connect(host=os.environ['POSTGRES_HOST'],port=int(os.environ['POSTGRES_PORT']),dbname=os.environ['POSTGRES_DB'],user=os.environ['POSTGRES_USER'],password=os.environ['POSTGRES_PASSWORD'],row_factory=dict_row) as c:
            with c.cursor() as cur:
              cur.execute('SELECT count(*) n FROM employer_origin_source_candidates WHERE lower(company_key)=ANY(%s)',(aliases,)); print('1' if int(cur.fetchone()['n']) else '0')
          PY
          )"
            if [[ "$exists" == 1 ]]; then echo "F2_DISCOVERY_INGRESS=$key|already_exists"; continue; fi
            set +e
            "$RUNTIME_PYTHON" -m scripts.run_product_e2e_candidate_ingress \
              --limit 5 --limit-per-seed-source 1 --manual-limit 1 \
              --company-key "$key" --include-manual-observations --apply \
              --approval-token approve_product_e2e_discovery_candidate_creation \
              --reviewed-by "f2-acceptance-${GITHUB_RUN_ID}" \
              --output-dir "/tmp/jap-f2-v2-${key}-ingress"
            rc=$?
            set -e
            echo "F2_DISCOVERY_INGRESS=$key|exit=$rc"
          done
          exit 0

      - name: Resolve current cohort and best-effort F1 persistence for unresolved origins
        shell: bash
        run: |
          set -euo pipefail
          keys="$($RUNTIME_PYTHON - <<'PY'
          import os,psycopg
          from psycopg.rows import dict_row
          wanted=[['valuny'],['hdi'],['triology'],['gridx'],['teccle','teccle_group']]
          found=[]
          with psycopg.connect(host=os.environ['POSTGRES_HOST'],port=int(os.environ['POSTGRES_PORT']),dbname=os.environ['POSTGRES_DB'],user=os.environ['POSTGRES_USER'],password=os.environ['POSTGRES_PASSWORD'],row_factory=dict_row) as c:
            with c.cursor() as cur:
              for aliases in wanted:
                cur.execute('SELECT company_key FROM employer_origin_source_candidates WHERE lower(company_key)=ANY(%s) ORDER BY updated_at DESC NULLS LAST,id DESC LIMIT 1',(aliases,)); r=cur.fetchone()
                if r: found.append(str(r['company_key']))
          print(','.join(dict.fromkeys(found)))
          PY
          )"
          test -n "$keys"
          printf 'F2_KEYS=%s\n' "$keys" >> "$GITHUB_ENV"
          echo "F2_COHORT_KEYS=$keys"
          IFS=',' read -r -a key_array <<< "$keys"
          unresolved=()
          for key in "${key_array[@]}"; do
            has_url="$($RUNTIME_PYTHON - "$key" <<'PY'
          import os,sys,psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(host=os.environ['POSTGRES_HOST'],port=int(os.environ['POSTGRES_PORT']),dbname=os.environ['POSTGRES_DB'],user=os.environ['POSTGRES_USER'],password=os.environ['POSTGRES_PASSWORD'],row_factory=dict_row) as c:
            with c.cursor() as cur:
              cur.execute("SELECT coalesce(btrim(candidate_url),'')<>'' ok FROM employer_origin_source_candidates WHERE company_key=%s ORDER BY updated_at DESC NULLS LAST,id DESC LIMIT 1",(sys.argv[1],)); r=cur.fetchone(); print('1' if r and r['ok'] else '0')
          PY
          )"
            [[ "$has_url" == 1 ]] || unresolved+=(--company-key "$key")
          done
          if [[ "${#unresolved[@]}" -eq 0 ]]; then echo 'F2_F1_UNRESOLVED=0'; exit 0; fi
          mkdir -p /tmp/jap-f2-v2-f1
          set +e
          "$RUNTIME_PYTHON" -m scripts.run_f1_origin_persistence_bridge \
            "${unresolved[@]}" --apply \
            --approval-token approve_product_e2e_origin_url_persistence \
            --reviewed-by "f2-acceptance-${GITHUB_RUN_ID}" \
            --official-domain-provider wikidata --search-provider none \
            --http-request-cap 48 --max-candidates 30 --timeout-seconds 8 \
            --output-dir /tmp/jap-f2-v2-f1
          rc=$?
          set -e
          echo "F2_F1_BRIDGE_EXIT=$rc"
          exit 0

      - name: Recompute strict proof and qualify generic connector plane
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" -m scripts.run_generic_employer_origin_product --output "$PRODUCT_JSON"
          "$RUNTIME_PYTHON" -m scripts.qualify_generic_employer_origin_connectors --proof-json "$PRODUCT_JSON"
          "$RUNTIME_PYTHON" -m scripts.apply_generic_employer_origin_activation --proof-json "$PRODUCT_JSON"

      - name: Apply complete proof-pass projection
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" -m scripts.apply_generic_employer_origin_activation --proof-json "$PRODUCT_JSON" --apply

      - name: Run normal generic-origin ingestion and Silver
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" -m src.ingest_jobs --source generic_origin --log-level INFO
          "$RUNTIME_PYTHON" -m src.run_silver_jobs

      - name: Evaluate lifecycle-cold acceptance
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" - "$BASELINE_JSON" "$FINAL_JSON" "$F2_STARTED_AT" "$F2_KEYS" <<'PY'
          import json,os,sys,psycopg
          from psycopg.rows import dict_row
          baseline=json.load(open(sys.argv[1],encoding='utf-8')); final_path=sys.argv[2]; started=sys.argv[3]; keys=sys.argv[4].split(',')
          before_by_key={x['key']:x for x in baseline.values()}
          results=[]
          conn=psycopg.connect(host=os.environ['POSTGRES_HOST'],port=int(os.environ['POSTGRES_PORT']),dbname=os.environ['POSTGRES_DB'],user=os.environ['POSTGRES_USER'],password=os.environ['POSTGRES_PASSWORD'],row_factory=dict_row)
          with conn,conn.cursor() as cur:
            for key in keys:
              source='generic_origin:'+key; before=before_by_key.get(key,{'active':False,'positive_runs':0,'bronze':0,'silver':0,'lifecycle_cold':True})
              cur.execute('SELECT company_name,candidate_url,status FROM employer_origin_source_candidates WHERE company_key=%s ORDER BY updated_at DESC NULLS LAST,id DESC LIMIT 1',(key,)); cand=cur.fetchone()
              cur.execute('SELECT count(*) n FROM search_profiles WHERE source_name=%s AND is_active AND recurring_ingestion_enabled',(source,)); active=int(cur.fetchone()['n'])>0
              cur.execute("SELECT id,status,total_loaded,inserted_count,started_at FROM ingestion_runs WHERE source_name=%s AND started_at >= %s::timestamptz ORDER BY started_at DESC,id DESC LIMIT 1",(source,started)); run=cur.fetchone()
              cur.execute('SELECT count(*) n FROM raw_jobs WHERE source_name=%s',(source,)); bronze=int(cur.fetchone()['n'])
              cur.execute('SELECT count(*) n FROM silver_jobs WHERE source_name=%s',(source,)); silver=int(cur.fetchone()['n'])
              cur.execute('SELECT title,company_name,location,source_url FROM silver_jobs WHERE source_name=%s ORDER BY id DESC LIMIT 3',(source,)); samples=[dict(r) for r in cur.fetchall()]
              loaded=int(run['total_loaded'] or 0) if run else 0
              passed=bool(before['lifecycle_cold'] and active and run and run['status']=='success' and loaded>0 and bronze>int(before['bronze']) and silver>int(before['silver']))
              row={'key':key,'candidate':dict(cand) if cand else None,'before':before,'active_after':active,'run':dict(run) if run else None,'bronze_after':bronze,'silver_after':silver,'silver_samples':samples,'pass':passed}; results.append(row)
              print(f"F2_RESULT={key}|cold={before['lifecycle_cold']}|active={active}|run={run['status'] if run else 'not_run'}|loaded={loaded}|inserted={int(run['inserted_count'] or 0) if run else 0}|bronze={bronze}|silver={silver}|pass={passed}")
              for s in samples: print(f"F2_SILVER={key}|{s['title']}|{s['company_name']}|{s['location']}|{s['source_url']}")
          accepted=[x['key'] for x in results if x['pass']]
          json.dump({'schema':'jap.f2.acceptance.v2','product_sha':os.environ['PRODUCT_SHA'],'accepted':accepted,'results':results},open(final_path,'w',encoding='utf-8'),indent=2,default=str,ensure_ascii=False)
          print('F2_ACCEPTED='+','.join(accepted))
          if not accepted: raise SystemExit('F2_NO_LIFECYCLE_COLD_SOURCE_REACHED_SILVER_WITH_POSITIVE_CURRENT_DELIVERY')
          print('F2_ACCEPTANCE_V2=PASS')
          PY

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f2-acceptance-cohort-v2
          path: |
            /tmp/jap-f2-v2-baseline.json
            /tmp/jap-f2-v2-product.json
            /tmp/jap-f2-v2-final.json
            /tmp/jap-f2-v2-f1/**
            /tmp/jap-f2-v2-gridx-ingress/**
            /tmp/jap-f2-v2-teccle-ingress/**
          if-no-files-found: warn
          retention-days: 14
