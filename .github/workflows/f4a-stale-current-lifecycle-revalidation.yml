name: F4A stale current lifecycle revalidation

on:
  push:
    branches: [agent/f4a-operator-feedback-freeze-extension]
    paths:
      - ".github/workflows/f4a-stale-current-lifecycle-revalidation.yml"

permissions:
  contents: read

concurrency:
  group: f4a-stale-current-lifecycle-revalidation
  cancel-in-progress: false

jobs:
  revalidate:
    name: Revalidate exact blocked current vacancy
    runs-on: [self-hosted, Linux, X64, job-pipeline-runtime-linux]
    timeout-minutes: 10
    env:
      RCC_REPOSITORY_ID: "1230805345"
      RCC_REPOSITORY: jenshaberle-dotcom/job-application-pipeline
      RCC_RUNNER_NAME: job-pipeline-runtime-linux
      SILVER_JOB_ID: "440"
      EXPECTED_SOURCE_NAME: "personio:eraneos"

    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve verified RCC runtime context
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          context_file="${RCC_RUNTIME_CONTEXT_FILE:-$HOME/.config/DeepOceanInfrastructure/RCC/runtime-contexts/${RCC_REPOSITORY_ID}-${RCC_RUNNER_NAME}.json}"
          test -f "$context_file"
          context_output="$(python3 - "$context_file" "$RCC_REPOSITORY_ID" "$RCC_REPOSITORY" "$RCC_RUNNER_NAME" <<'PY'
          import json
          import sys
          from pathlib import PurePosixPath

          path, repo_id, repository, runner = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              context = json.load(handle)
          if context.get("RepositoryId") != int(repo_id):
              raise SystemExit("RUNTIME_REPOSITORY_ID_MISMATCH")
          if context.get("Repository") != repository:
              raise SystemExit("RUNTIME_REPOSITORY_MISMATCH")
          if context.get("RunnerName") != runner:
              raise SystemExit("RUNTIME_RUNNER_MISMATCH")
          if context.get("Status") != "PASS" or context.get("PrimaryFailure") not in (None, ""):
              raise SystemExit("RUNTIME_CONTEXT_NOT_PASS")
          checkout = context.get("CheckoutRoot")
          interpreter = context.get("Interpreter")
          env_file = context.get("EnvFile")
          root = PurePosixPath(checkout)
          if root not in PurePosixPath(interpreter).parents or root not in PurePosixPath(env_file).parents:
              raise SystemExit("RUNTIME_CONTEXT_PATH_MISMATCH")
          print(interpreter)
          print(env_file)
          PY
          )"
          mapfile -t values <<< "$context_output"
          test "${#values[@]}" -eq 2
          printf 'RUNTIME_PYTHON=%s\n' "${values[0]}" >> "$GITHUB_ENV"
          printf 'RUNTIME_ENV_FILE=%s\n' "${values[1]}" >> "$GITHUB_ENV"

      - name: Load masked Product database environment
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" - "$RUNTIME_ENV_FILE" "$GITHUB_ENV" <<'PY'
          import secrets
          import sys
          from pathlib import Path
          from dotenv import dotenv_values

          values = dotenv_values(Path(sys.argv[1]))
          required = (
              "POSTGRES_HOST", "POSTGRES_PORT", "POSTGRES_DB",
              "POSTGRES_USER", "POSTGRES_PASSWORD",
          )
          missing = [key for key in required if values.get(key) in (None, "")]
          if missing:
              raise SystemExit("RUNTIME_ENV_POSTGRES_KEYS_MISSING:" + ",".join(missing))
          print(f"::add-mask::{values['POSTGRES_PASSWORD']}")
          with Path(sys.argv[2]).open("a", encoding="utf-8") as handle:
              for key in required:
                  value = str(values[key])
                  marker = f"JAP_ENV_{secrets.token_hex(12)}"
                  while marker in value:
                      marker = f"JAP_ENV_{secrets.token_hex(12)}"
                  handle.write(f"{key}<<{marker}\n{value}\n{marker}\n")
          PY

      - name: Dry-run exact lifecycle revalidation
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" - <<'PY'
          import json
          import os
          import psycopg
          from psycopg.rows import dict_row

          from src.config import get_database_config
          from src.job_lifecycle_health import JobLifecycleHealthRepository, build_health_probe_manifest

          job_id = int(os.environ["SILVER_JOB_ID"])
          expected_source = os.environ["EXPECTED_SOURCE_NAME"]
          with psycopg.connect(**get_database_config(), row_factory=dict_row) as conn:
              with conn.cursor() as cur:
                  cur.execute(
                      "SELECT id, source_name, source_url, lifecycle_status "
                      "FROM gold_current_job_opportunities WHERE id = %s",
                      (job_id,),
                  )
                  row = cur.fetchone()
              conn.rollback()
          if row is None:
              raise SystemExit("TARGET_NOT_CURRENT_PRODUCT_MEMBER")
          if row["source_name"] != expected_source:
              raise SystemExit("TARGET_SOURCE_NAME_DRIFT")
          if row["lifecycle_status"] != "active_confirmed":
              raise SystemExit("TARGET_NOT_ACTIVE_CONFIRMED")

          repository = JobLifecycleHealthRepository()
          target = repository.load_target(job_id)
          manifest = build_health_probe_manifest(
              silver_job_id=job_id,
              expected_source_name=expected_source,
              expected_source_url=target.source_url,
              apply=False,
              approval_token=None,
              observed_by=None,
              repository=repository,
          )
          classification = manifest["classification"]
          print("F4A_STALE_DRY_RUN=" + json.dumps(manifest, default=str, sort_keys=True))
          if classification["outcome"] != "unverifiable":
              raise SystemExit("UNEXPECTED_LIFECYCLE_OUTCOME")
          if classification["coverage"] != "exact_detail":
              raise SystemExit("UNEXPECTED_LIFECYCLE_COVERAGE")
          if classification["evidence_reason"] != "http_404_requires_source_specific_closure_validation":
              raise SystemExit("UNEXPECTED_LIFECYCLE_EVIDENCE_REASON")
          if manifest["write"]["applied"]:
              raise SystemExit("DRY_RUN_WROTE_DATABASE")
          print("F4A_STALE_CURRENT_DRY_RUN=PASS")
          PY

      - name: Append guarded lifecycle observation
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" - <<'PY'
          import json
          import os

          from src.job_lifecycle_health import (
              APPROVAL_TOKEN,
              JobLifecycleHealthRepository,
              build_health_probe_manifest,
          )

          job_id = int(os.environ["SILVER_JOB_ID"])
          expected_source = os.environ["EXPECTED_SOURCE_NAME"]
          repository = JobLifecycleHealthRepository()
          target = repository.load_target(job_id)
          manifest = build_health_probe_manifest(
              silver_job_id=job_id,
              expected_source_name=expected_source,
              expected_source_url=target.source_url,
              apply=True,
              approval_token=APPROVAL_TOKEN,
              observed_by="f4a-q-stale-current-revalidation",
              repository=repository,
          )
          classification = manifest["classification"]
          print("F4A_STALE_APPLY=" + json.dumps(manifest, default=str, sort_keys=True))
          if not manifest["write"]["applied"]:
              raise SystemExit("HEALTH_OBSERVATION_NOT_APPLIED")
          if classification["outcome"] != "unverifiable":
              raise SystemExit("APPLY_OUTCOME_CHANGED")
          if classification["coverage"] != "exact_detail":
              raise SystemExit("APPLY_COVERAGE_CHANGED")
          if classification["evidence_reason"] != "http_404_requires_source_specific_closure_validation":
              raise SystemExit("APPLY_EVIDENCE_CHANGED")
          print("F4A_STALE_CURRENT_APPLY=PASS")
          PY

      - name: Verify Product membership changed fail-closed
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" - <<'PY'
          import os
          import psycopg
          from psycopg.rows import dict_row
          from src.config import get_database_config

          job_id = int(os.environ["SILVER_JOB_ID"])
          with psycopg.connect(**get_database_config(), row_factory=dict_row) as conn:
              with conn.cursor() as cur:
                  cur.execute(
                      "SELECT lifecycle_status FROM gold_job_lifecycle_health WHERE silver_job_id = %s",
                      (job_id,),
                  )
                  health = cur.fetchone()
                  cur.execute(
                      "SELECT 1 FROM gold_current_job_opportunities WHERE id = %s",
                      (job_id,),
                  )
                  current = cur.fetchone()
              conn.rollback()
          if health is None or health["lifecycle_status"] != "unverifiable":
              raise SystemExit("POST_APPLY_LIFECYCLE_NOT_UNVERIFIABLE")
          if current is not None:
              raise SystemExit("UNVERIFIABLE_JOB_REMAINS_CURRENT_PRODUCT_MEMBER")
          print("F4A_STALE_CURRENT_POST_APPLY=PASS")
          PY
