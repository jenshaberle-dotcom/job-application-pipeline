name: F6 live vacancy revalidation diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/f6-live-vacancy-revalidation-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    name: Read-only current vacancy exact-detail cohort
    runs-on: [self-hosted, Linux, X64, job-pipeline-runtime-linux]
    timeout-minutes: 20
    env:
      RCC_REPOSITORY_ID: "1230805345"
      RCC_REPOSITORY: jenshaberle-dotcom/job-application-pipeline
      RCC_RUNNER_NAME: job-pipeline-runtime-linux

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve qualified database environment
        shell: bash
        run: |
          set -euo pipefail
          context_file="${RCC_RUNTIME_CONTEXT_FILE:-$HOME/.config/DeepOceanInfrastructure/RCC/runtime-contexts/${RCC_REPOSITORY_ID}-${RCC_RUNNER_NAME}.json}"
          test -f "$context_file"
          env_file="$(python3 - "$context_file" "$RCC_REPOSITORY_ID" "$RCC_REPOSITORY" "$RCC_RUNNER_NAME" <<'PY'
          import json
          import sys
          path, repo_id, repository, runner = sys.argv[1:]
          context = json.load(open(path, encoding="utf-8"))
          if context.get("RepositoryId") != int(repo_id):
              raise SystemExit("RUNTIME_REPOSITORY_ID_MISMATCH")
          if context.get("Repository") != repository:
              raise SystemExit("RUNTIME_REPOSITORY_MISMATCH")
          if context.get("RunnerName") != runner:
              raise SystemExit("RUNTIME_RUNNER_MISMATCH")
          if context.get("Status") != "PASS":
              raise SystemExit("RUNTIME_CONTEXT_NOT_PASS")
          print(context["EnvFile"])
          PY
          )"
          test -s "$env_file"
          printf 'RUNTIME_ENV_FILE=%s\n' "$env_file" >> "$GITHUB_ENV"

      - name: Build isolated exact-source runtime
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/jap-f6-live-revalidation"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check -r requirements.txt
          printf 'DIAG_PYTHON=%s\n' "$venv/bin/python" >> "$GITHUB_ENV"

      - name: Probe dead control case and replacement candidates read-only
        shell: bash
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1090
          source "$RUNTIME_ENV_FILE"
          set +a
          export PGOPTIONS="-c default_transaction_read_only=on"

          "$DIAG_PYTHON" - <<'PY'
          import json

          import psycopg
          from psycopg.rows import dict_row

          from src.config import get_database_config
          from src.job_lifecycle_health import (
              JobLifecycleHealthRepository,
              classify_exact_detail,
              fetch_exact_detail,
          )

          with psycopg.connect(**get_database_config(), row_factory=dict_row) as conn:
              with conn.cursor() as cur:
                  cur.execute("SET TRANSACTION READ ONLY")
                  cur.execute(
                      """
                      SELECT silver_job_id, title, company_name, lifecycle_status, source_name
                      FROM gold_product_v1_job_readiness
                      WHERE silver_job_id = 626
                         OR (
                              lifecycle_status = 'active_confirmed'
                              AND (
                                  lower(coalesce(company_name, '')) LIKE '%eraneos%'
                                  OR lower(coalesce(title, '')) LIKE '%data engineer%'
                              )
                         )
                      ORDER BY
                          CASE WHEN silver_job_id = 626 THEN 0 ELSE 1 END,
                          overall_quality_score DESC NULLS LAST,
                          silver_job_id
                      LIMIT 12
                      """
                  )
                  rows = [dict(row) for row in cur.fetchall()]
              conn.rollback()

          repo = JobLifecycleHealthRepository()
          results = []
          for row in rows:
              target = repo.load_target(int(row["silver_job_id"]))
              probe = fetch_exact_detail(target.source_url)
              classification = classify_exact_detail(target, probe)
              results.append(
                  {
                      "silver_job_id": target.silver_job_id,
                      "title": target.title,
                      "company_name": row.get("company_name"),
                      "source_name": target.source_name,
                      "persisted_lifecycle_status": row.get("lifecycle_status"),
                      "http_status": probe.status_code,
                      "final_url_changed": probe.final_url != target.source_url,
                      "outcome": classification.outcome,
                      "reason": classification.evidence_reason,
                      "closure_marker": classification.evidence.get("explicit_closure_marker"),
                      "title_match": classification.evidence.get("title_match"),
                  }
              )

          print("F6_LIVE_REVALIDATION_DIAGNOSTIC=" + json.dumps(results, ensure_ascii=False, sort_keys=True))
          print("DATABASE_WRITES=0")
          print("F6_LIVE_REVALIDATION_DIAGNOSTIC=PASS")
          PY
