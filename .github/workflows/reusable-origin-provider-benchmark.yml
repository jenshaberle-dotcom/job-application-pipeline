name: Reusable origin provider benchmark

on:
  workflow_call:
    inputs:
      pipeline_ref:
        description: Exact committed pipeline SHA selected by the local dispatcher.
        required: true
        type: string
      expected_fingerprint:
        description: SHA-256 of the bounded DB projection at dispatch time.
        required: true
        type: string
      max_candidates:
        required: false
        type: number
        default: 6
      search_query_limit:
        required: false
        type: number
        default: 2
      search_max_results:
        required: false
        type: number
        default: 5
      max_provider_requests:
        required: false
        type: number
        default: 12
      target_location:
        required: false
        type: string
        default: Hannover
      tailscale_tags:
        required: false
        type: string
        default: tag:github-origin-benchmark
      max_url_candidates:
        required: false
        type: number
        default: 20
      market_evidence_limit:
        required: false
        type: number
        default: 10
      no_probe:
        required: false
        type: boolean
        default: false
      origin_evidence_max_candidates_per_company:
        required: false
        type: number
        default: 3
      origin_evidence_max_http_requests:
        required: false
        type: number
        default: 30
      enable_llm_adjudication:
        description: Explicitly enable bounded LLM review for unresolved origin evidence.
        required: false
        type: boolean
        default: false
      max_llm_adjudication_requests:
        required: false
        type: number
        default: 2
      llm_adjudication_model:
        description: Explicit OpenAI model ID; required only when LLM adjudication is enabled.
        required: false
        type: string
        default: ""
    secrets:
      ts_oauth_client_id:
        required: true
      ts_audience:
        required: true
      tavily_api_key:
        required: true
      postgres_host:
        required: true
      postgres_port:
        required: true
      postgres_db:
        required: true
      postgres_user:
        required: true
      postgres_password:
        required: true
      openai_api_key:
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: origin-provider-benchmark-${{ github.repository }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Fingerprint-bound Tavily origin benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact pipeline revision
        uses: actions/checkout@v4
        with:
          repository: jenshaberle-dotcom/job-application-pipeline
          ref: ${{ inputs.pipeline_ref }}
          persist-credentials: false

      - name: Derive runtime contract cache key
        id: runtime-contract
        env:
          RUNTIME_INPUTS_JSON: ${{ toJSON(inputs) }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os

          payload = json.loads(os.environ["RUNTIME_INPUTS_JSON"])
          canonical = json.dumps(payload, sort_keys=True, separators=(",", ":"))
          digest = hashlib.sha256(canonical.encode("utf-8")).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"sha256={digest}\n")
          print(f"origin_runtime_contract_sha256={digest}")
          PY

      - name: Restore successful fingerprint marker
        id: success-cache
        uses: actions/cache/restore@v4
        with:
          path: .origin-runtime-cache
          key: origin-provider-success-${{ inputs.pipeline_ref }}-${{ inputs.expected_fingerprint }}-${{ steps.runtime-contract.outputs.sha256 }}

      - name: Report already completed fingerprint
        if: steps.success-cache.outputs.cache-hit == 'true'
        run: echo "origin_provider_event_benchmark=already_completed"

      - name: Restore candidate checkpoint
        if: steps.success-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .origin-runtime-checkpoint
          key: origin-provider-checkpoint-${{ inputs.pipeline_ref }}-${{ inputs.expected_fingerprint }}-${{ steps.runtime-contract.outputs.sha256 }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            origin-provider-checkpoint-${{ inputs.pipeline_ref }}-${{ inputs.expected_fingerprint }}-${{ steps.runtime-contract.outputs.sha256 }}-

      - name: Set up Python
        if: steps.success-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        if: steps.success-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Join private tailnet as an ephemeral runner
        if: steps.success-cache.outputs.cache-hit != 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.ts_oauth_client_id }}
          audience: ${{ secrets.ts_audience }}
          tags: ${{ inputs.tailscale_tags }}
          ping: ${{ secrets.postgres_host }}

      - name: Verify PostgreSQL port is reachable
        if: steps.success-cache.outputs.cache-hit != 'true'
        env:
          POSTGRES_HOST: ${{ secrets.postgres_host }}
          POSTGRES_PORT: ${{ secrets.postgres_port }}
        run: |
          python - <<'PY'
          import os
          import socket

          with socket.create_connection(
              (os.environ["POSTGRES_HOST"], int(os.environ["POSTGRES_PORT"])),
              timeout=10,
          ):
              print("postgres_tailnet_connectivity=ok")
          PY

      - name: Acquire fail-safe local runtime lease
        if: steps.success-cache.outputs.cache-hit != 'true'
        env:
          POSTGRES_HOST: ${{ secrets.postgres_host }}
          POSTGRES_PORT: ${{ secrets.postgres_port }}
          POSTGRES_DB: ${{ secrets.postgres_db }}
          POSTGRES_USER: ${{ secrets.postgres_user }}
          POSTGRES_PASSWORD: ${{ secrets.postgres_password }}
          LEASE_READY: ${{ runner.temp }}/origin-runtime-lease.ready
          LEASE_PID: ${{ runner.temp }}/origin-runtime-lease.pid
          LEASE_LOG: ${{ runner.temp }}/origin-runtime-lease.log
        run: |
          nohup python -m scripts.hold_origin_runtime_lease \
            --ready-file "$LEASE_READY" \
            --heartbeat-seconds 20 \
            --max-seconds 2100 \
            >"$LEASE_LOG" 2>&1 &
          printf '%s\n' "$!" >"$LEASE_PID"

          ready=false
          for attempt in $(seq 1 20); do
            if [ -f "$LEASE_READY" ]; then
              echo "origin_runtime_lease=ready attempt=$attempt"
              ready=true
              break
            fi
            if ! kill -0 "$(cat "$LEASE_PID")" 2>/dev/null; then
              cat "$LEASE_LOG" || true
              echo "origin runtime lease holder exited before readiness"
              exit 1
            fi
            sleep 1
          done
          test "$ready" = "true"

      - name: Run bounded provider benchmark from immutable snapshot
        if: steps.success-cache.outputs.cache-hit != 'true'
        env:
          TAVILY_API_KEY: ${{ secrets.tavily_api_key }}
          POSTGRES_HOST: ${{ secrets.postgres_host }}
          POSTGRES_PORT: ${{ secrets.postgres_port }}
          POSTGRES_DB: ${{ secrets.postgres_db }}
          POSTGRES_USER: ${{ secrets.postgres_user }}
          POSTGRES_PASSWORD: ${{ secrets.postgres_password }}
          OUTPUT_PATH: ${{ runner.temp }}/origin-provider-benchmark.json
          CHECKPOINT_PATH: .origin-runtime-checkpoint/origin-provider-event-checkpoint.json
        run: |
          ARGS=(
            --expected-fingerprint "${{ inputs.expected_fingerprint }}"
            --max-candidates "${{ inputs.max_candidates }}"
            --search-query-limit "${{ inputs.search_query_limit }}"
            --search-max-results "${{ inputs.search_max_results }}"
            --max-provider-requests "${{ inputs.max_provider_requests }}"
            --market-evidence-limit "${{ inputs.market_evidence_limit }}"
            --max-url-candidates "${{ inputs.max_url_candidates }}"
            --target-location "${{ inputs.target_location }}"
            --checkpoint "$CHECKPOINT_PATH"
            --output "$OUTPUT_PATH"
          )
          if [ "${{ inputs.no_probe }}" = "true" ]; then
            ARGS+=(--no-probe)
          fi
          python -m scripts.run_origin_provider_event_benchmark "${ARGS[@]}"

      - name: Release local runtime lease
        if: ${{ always() && steps.success-cache.outputs.cache-hit != 'true' }}
        env:
          LEASE_PID: ${{ runner.temp }}/origin-runtime-lease.pid
          LEASE_LOG: ${{ runner.temp }}/origin-runtime-lease.log
        run: |
          if [ -f "$LEASE_PID" ]; then
            pid="$(cat "$LEASE_PID")"
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" || true
              for _attempt in $(seq 1 10); do
                kill -0 "$pid" 2>/dev/null || break
                sleep 1
              done
            fi
          fi
          cat "$LEASE_LOG" 2>/dev/null || true
          echo "origin_runtime_lease_cleanup=complete"

      - name: Grade source evidence and adjudicate unresolved cases
        if: steps.success-cache.outputs.cache-hit != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.openai_api_key }}
          ORIGIN_ADJUDICATION_MODEL: ${{ inputs.llm_adjudication_model }}
          INPUT_PATH: ${{ runner.temp }}/origin-provider-benchmark.json
          OUTPUT_PATH: ${{ runner.temp }}/origin-evidence-adjudication.json
          CHECKPOINT_PATH: .origin-runtime-checkpoint/origin-evidence-adjudication-checkpoint.json
        run: |
          ARGS=(
            --input "$INPUT_PATH"
            --output "$OUTPUT_PATH"
            --checkpoint "$CHECKPOINT_PATH"
            --target-location "${{ inputs.target_location }}"
            --max-candidates-per-company "${{ inputs.origin_evidence_max_candidates_per_company }}"
            --max-http-requests "${{ inputs.origin_evidence_max_http_requests }}"
            --max-llm-requests "${{ inputs.max_llm_adjudication_requests }}"
            --llm-model "${{ inputs.llm_adjudication_model }}"
          )
          if [ "${{ inputs.enable_llm_adjudication }}" = "true" ]; then
            ARGS+=(--enable-llm-adjudication)
          fi
          python -m scripts.run_origin_evidence_adjudication "${ARGS[@]}"

      - name: Save candidate checkpoint
        if: ${{ always() && steps.success-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .origin-runtime-checkpoint
          key: origin-provider-checkpoint-${{ inputs.pipeline_ref }}-${{ inputs.expected_fingerprint }}-${{ steps.runtime-contract.outputs.sha256 }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Create successful fingerprint marker
        if: steps.success-cache.outputs.cache-hit != 'true' && success()
        run: |
          mkdir -p .origin-runtime-cache
          printf '%s\n' "${{ inputs.pipeline_ref }}:${{ inputs.expected_fingerprint }}:${{ steps.runtime-contract.outputs.sha256 }}" \
            > .origin-runtime-cache/completed.txt

      - name: Save successful fingerprint marker
        if: steps.success-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: .origin-runtime-cache
          key: origin-provider-success-${{ inputs.pipeline_ref }}-${{ inputs.expected_fingerprint }}-${{ steps.runtime-contract.outputs.sha256 }}

      - name: Publish sanitized run summary
        if: always()
        env:
          OUTPUT_PATH: ${{ runner.temp }}/origin-provider-benchmark.json
          EVIDENCE_PATH: ${{ runner.temp }}/origin-evidence-adjudication.json
          CHECKPOINT_PATH: .origin-runtime-checkpoint/origin-provider-event-checkpoint.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["OUTPUT_PATH"])
          evidence_path = Path(os.environ["EVIDENCE_PATH"])
          checkpoint_path = Path(os.environ["CHECKPOINT_PATH"])
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = ["## Origin provider benchmark", ""]
          cache_hit = "${{ steps.success-cache.outputs.cache-hit }}" == "true"
          if cache_hit:
              lines.append(
                  "This exact pipeline-ref/fingerprint/runtime-contract completed earlier; "
                  "no provider call was repeated."
              )
          elif report_path.exists():
              report = json.loads(report_path.read_text(encoding="utf-8"))
              summary = report["summary"]
              provider = report["provider"]
              recovery = report["recovery"]
              lines.extend(
                  [
                      f"- Candidate count: `{summary['result_count']}`",
                      f"- Tavily request attempts: `{provider['provider_request_attempts']}`",
                      f"- Resumed candidate results: `{recovery['resumed_result_count']}`",
                      f"- Legacy selected: `{summary['selected_count']}`",
                      f"- Legacy manual review: `{summary['manual_review_count']}`",
                      f"- Legacy not found: `{summary['not_found_count']}`",
                      "- Database reads after verified snapshot: `0`",
                      "- Runtime lease: `PostgreSQL advisory lock, fail-safe on disconnect`",
                      "- Boundary: `review_output_only_not_pipeline_input`",
                  ]
              )
              if evidence_path.exists():
                  evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
                  evidence_summary = evidence["summary"]
                  lines.extend(
                      [
                          "",
                          "### Source-grade evidence",
                          f"- Deterministic selected: `{evidence_summary['deterministic_selected_count']}`",
                          f"- Manual review: `{evidence_summary['manual_review_count']}`",
                          f"- LLM-eligible: `{evidence_summary['llm_eligible_count']}`",
                          f"- LLM request attempts: `{evidence_summary['llm_request_attempts']}`",
                          f"- LLM completed: `{evidence_summary['llm_completed_count']}`",
                          f"- Bounded HTTP request attempts: `{evidence_summary['http_request_attempts']}`",
                          "- LLM output: `review signal only; never selection truth or mutation authority`",
                      ]
                  )
          elif checkpoint_path.exists():
              checkpoint = json.loads(checkpoint_path.read_text(encoding="utf-8"))
              lines.extend(
                  [
                      "The benchmark stopped before the final review report.",
                      f"- Checkpointed candidates: `{len(checkpoint.get('results', []))}`",
                      f"- Checkpointed provider attempts: `{checkpoint.get('provider_request_attempts', 0)}`",
                      "- Recovery: `rerun the same pipeline-ref/fingerprint pair`",
                  ]
              )
          else:
              lines.append("The benchmark stopped before a checkpoint was created.")
          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload private review and recovery artifact
        if: ${{ always() && steps.success-cache.outputs.cache-hit != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: origin-provider-benchmark-${{ inputs.expected_fingerprint }}
          path: |
            ${{ runner.temp }}/origin-provider-benchmark.json
            ${{ runner.temp }}/origin-evidence-adjudication.json
            .origin-runtime-checkpoint/origin-provider-event-checkpoint.json
            .origin-runtime-checkpoint/origin-evidence-adjudication-checkpoint.json
            ${{ runner.temp }}/origin-runtime-lease.log
          if-no-files-found: warn
          retention-days: 3
