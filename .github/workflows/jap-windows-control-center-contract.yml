name: JAP Windows Control Center contract

on:
  pull_request:
    paths:
      - "install-jap-control-center.ps1"
      - "Stop-JAP-Control-Center.ps1"
      - "scripts/run_jap_windows_control_center.sh"
      - "scripts/install_jap_windows_control_center.sh"
      - "windows/JAP.ControlCenter.Desktop/**"
      - "tests/test_jap_windows_control_center_contract.py"
      - "tests/test_jap_windows_control_center_webview2_startup.py"
      - ".github/workflows/jap-windows-control-center-contract.yml"
      - ".github/workflows/jap-windows-desktop-host-release.yml"
  push:
    branches: [main]
    paths:
      - "install-jap-control-center.ps1"
      - "Stop-JAP-Control-Center.ps1"
      - "scripts/run_jap_windows_control_center.sh"
      - "scripts/install_jap_windows_control_center.sh"
      - "windows/JAP.ControlCenter.Desktop/**"
      - "tests/test_jap_windows_control_center_contract.py"
      - "tests/test_jap_windows_control_center_webview2_startup.py"
      - ".github/workflows/jap-windows-control-center-contract.yml"
      - ".github/workflows/jap-windows-desktop-host-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-parse:
    name: Parse installed Windows entrypoints
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell
        shell: powershell
        run: |
          $Paths = @(
            "install-jap-control-center.ps1",
            "Stop-JAP-Control-Center.ps1"
          )
          foreach ($Path in $Paths) {
            $Tokens = $null
            $Errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $Path,
              [ref]$Tokens,
              [ref]$Errors
            ) | Out-Null
            if ($Errors.Count -gt 0) {
              Write-Host "PowerShell parse failed: $Path"
              $Errors | ForEach-Object {
                Write-Host ("line={0} column={1} error={2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message)
              }
              exit 1
            }
          }

  desktop-host-build:
    name: Build self-contained WebView2 desktop host
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Prove tracked branded application icon
        shell: powershell
        run: |
          $Icon = "windows/JAP.ControlCenter.Desktop/JAP-Control-Center.ico"
          if (-not (Test-Path $Icon)) {
            throw "Tracked JAP application icon is missing."
          }
          $Hash = (Get-FileHash $Icon -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "JAP_DESKTOP_ICON_SHA256=$Hash"
      - name: Prove hidden runtime marker survives Windows packaging
        shell: powershell
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $Source = Join-Path $env:RUNNER_TEMP "jap-marker-source"
          $Target = Join-Path $env:RUNNER_TEMP "jap-marker-target"
          $Zip = Join-Path $env:RUNNER_TEMP "jap-marker-test.zip"
          Remove-Item -Recurse -Force $Source, $Target -ErrorAction SilentlyContinue
          Remove-Item -Force $Zip -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $Source, $Target | Out-Null
          Set-Content -Path (Join-Path $Source "index.html") -Value "ok" -Encoding ASCII -NoNewline
          Set-Content -Path (Join-Path $Source ".jap-source-sha") -Value $env:GITHUB_SHA -Encoding ASCII -NoNewline
          Get-ChildItem -Force $Source | Copy-Item -Destination $Target -Recurse -Force
          if (-not (Test-Path (Join-Path $Target ".jap-source-sha"))) {
            throw "Hidden JAP source marker was lost during runtime staging copy."
          }
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $Target,
            $Zip,
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false
          )
          $Archive = [System.IO.Compression.ZipFile]::OpenRead($Zip)
          try {
            $Names = @($Archive.Entries | ForEach-Object { $_.FullName })
            if ($Names -notcontains ".jap-source-sha") {
              throw "Hidden JAP source marker was lost during runtime ZIP packaging."
            }
          }
          finally {
            $Archive.Dispose()
          }
          Write-Host "JAP_RUNTIME_HIDDEN_MARKER_PACKAGING=PASS"

      - name: Publish Windows x64 host
        shell: powershell
        run: |
          $Out = Join-Path $env:RUNNER_TEMP "jap-desktop-host"
          dotnet publish windows/JAP.ControlCenter.Desktop/JAP.ControlCenter.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o $Out
          $Exe = Join-Path $Out "JAP.ControlCenter.Desktop.exe"
          if (-not (Test-Path $Exe)) {
            throw "Desktop host publish did not produce $Exe"
          }
          Write-Host "JAP_DESKTOP_HOST_BUILD=PASS exe=$Exe"

  wsl-wrapper-contract:
    name: Validate WSL wrapper and static contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test dependency
        run: python -m pip install pytest
      - name: Parse Bash entrypoints
        run: |
          bash -n scripts/run_jap_windows_control_center.sh
          bash -n scripts/install_jap_windows_control_center.sh
      - name: Run Windows app contract tests
        run: |
          python -m pytest -q \
            tests/test_jap_windows_control_center_contract.py \
            tests/test_jap_windows_control_center_webview2_startup.py \
            tests/test_jap_windows_runtime_start_diagnostics.py \
            tests/test_cgkb_product_update_single_path.py
