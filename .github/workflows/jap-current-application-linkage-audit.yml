name: JAP current application-job linkage audit

on:
  push:
    branches:
      - diag/962-workstation-update
    paths:
      - ".github/workflows/jap-current-application-linkage-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    name: Read-only current application/job linkage audit
    runs-on: [self-hosted, Linux, X64, job-pipeline-runtime-linux]
    timeout-minutes: 8
    steps:
      - name: Read mailbox sync runtime status
        shell: bash
        run: |
          set -u
          echo "HOME=$HOME"
          echo "RUNTIME_ROOT=${JAP_PRIVATE_RUNTIME_ROOT:-$HOME/projects/job-pipeline-runtime}"
          for p in "$HOME/.local/state/jap/mailbox-sync/status.json" "$HOME/.config/DeepOceanInfrastructure/JAP/gmail-oauth-client.json" "$HOME/.config/DeepOceanInfrastructure/JAP/gmail-readonly-token.json" "$HOME/projects/job-pipeline-runtime/scripts/f5_gmail_readonly_bridge.py"; do
            if [ -f "$p" ]; then echo "EXISTS=$p"; else echo "MISSING=$p"; fi
          done
          if [ -f "$HOME/.local/state/jap/mailbox-sync/status.json" ]; then
            python3 - "$HOME/.local/state/jap/mailbox-sync/status.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          keep={k:d.get(k) for k in ("schema","status","reason","started_at","finished_at","normalized_rows","error_type","message","gmail_scope")}
          print("MAILBOX_SYNC_STATUS="+json.dumps(keep,ensure_ascii=False,sort_keys=True))
          print("PLAN="+json.dumps(d.get("plan"),ensure_ascii=False,sort_keys=True))
          print("ACTUAL="+json.dumps(d.get("actual"),ensure_ascii=False,sort_keys=True))
          PY
          fi
          echo "RUNTIME_HEAD=$(git -C "$HOME/projects/job-pipeline-runtime" rev-parse HEAD 2>/dev/null || echo unavailable)"
          echo "RUNTIME_MAIN=$(git -C "$HOME/projects/job-pipeline-runtime" rev-parse origin/main 2>/dev/null || echo unavailable)"

      - name: Read current Product truth
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          curl --fail --silent --show-error --max-time 20 http://127.0.0.1:8780/api/v1/product-v1 > "$tmp"
          python3 - "$tmp" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1]))
          print("TOP_KEYS="+",".join(sorted(d.keys())))
          for k,v in d.items():
              n=len(v) if hasattr(v,"__len__") else "na"
              print("FIELD|{}|type={}|count={}".format(k,type(v).__name__,n))
          at=d.get("application_tracking") or {}
          if isinstance(at,dict):
              print("APP_TRACKING_KEYS="+",".join(sorted(at.keys())))
              for k,v in at.items():
                  n=len(v) if hasattr(v,"__len__") else "na"
                  print("APP_FIELD|{}|type={}|count={}".format(k,type(v).__name__,n))
              apps=at.get("applications") or at.get("rows") or at.get("items") or []
              for a in apps:
                  if isinstance(a,dict):
                      print("APP|"+json.dumps({k:a.get(k) for k in ["application_id","application_key","employer_name","job_title","effective_stage","silver_job_id","job_link_status"]},ensure_ascii=False,sort_keys=True))
          for key in ("observed_opportunities","discovery_source_jobs","historical_jobs","top_jobs"):
              rows=d.get(key) or []
              if isinstance(rows,list):
                  for j in rows:
                      if isinstance(j,dict):
                          print("JOB|surface={}|{}".format(key,json.dumps({k:j.get(k) for k in ["silver_job_id","job_id","id","title","job_title","company_name","employer_name","application_stage","application_id","application_key","review_scope"]},ensure_ascii=False,sort_keys=True)))
          PY
          python3 - "$tmp" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1]))
          at=d.get("application_tracking") or {}
          print("JOB_LINKAGE="+json.dumps(at.get("job_linkage"),ensure_ascii=False,sort_keys=True))
          for a in at.get("applications") or []:
              if isinstance(a,dict):
                  print("APP_FULL|"+json.dumps(a,ensure_ascii=False,sort_keys=True))
          for j in d.get("job_readiness") or []:
              if isinstance(j,dict) and (
                  "finanz" in str(j).lower()
                  or "hornet" in str(j).lower()
                  or j.get("application_stage")
                  or j.get("application_id")
                  or j.get("application_key")
              ):
                  print("CURRENT_JOB_FULL|"+json.dumps(j,ensure_ascii=False,sort_keys=True))
          PY
          python3 - "$tmp" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1]))
          at=d.get("application_tracking") or {}
          apps=at.get("applications") or []
          print("LIVE_APPLICATION_COUNT="+str(len(apps)))
          for a in apps:
              if not isinstance(a,dict):
                  continue
              blob=json.dumps(a,ensure_ascii=False).lower()
              if any(term in blob for term in ("finanz informatik","f-i.de","e362","ki-entwickler")):
                  print("FI_APPLICATION|"+json.dumps(a,ensure_ascii=False,sort_keys=True))
          for key,val in d.items():
              if isinstance(val,list):
                  for row in val:
                      if isinstance(row,dict):
                          blob=json.dumps(row,ensure_ascii=False).lower()
                          if any(term in blob for term in ("finanz informatik","e362","ki-entwickler")):
                              print("FI_PRODUCT_ROW|surface="+key+"|"+json.dumps(row,ensure_ascii=False,sort_keys=True))
          PY
          rm -f "$tmp"
