name: JAP current application-job linkage audit

on:
  push:
    branches:
      - diag/962-workstation-update
    paths:
      - ".github/workflows/jap-current-application-linkage-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    name: Read-only current application/job linkage audit
    runs-on: [self-hosted, Linux, X64, job-pipeline-runtime-linux]
    timeout-minutes: 8
    steps:
      - name: Fast-forward private runtime to qualified main
        shell: bash
        run: |
          set -euo pipefail
          repo="$HOME/projects/job-pipeline-runtime"
          test -d "$repo/.git"
          if [ -n "$(git -C "$repo" status --porcelain)" ]; then
            echo "PRIVATE_RUNTIME_UPDATE=STOP_DIRTY"
            git -C "$repo" status --short
            exit 1
          fi
          before="$(git -C "$repo" rev-parse HEAD)"
          git -C "$repo" fetch origin main
          target="$(git -C "$repo" rev-parse FETCH_HEAD)"
          test "$target" = "d283bc05cd63f42ba3eea75a591da1e249a6d86e"
          git -C "$repo" merge-base --is-ancestor "$before" "$target"
          git -C "$repo" merge --ff-only "$target"
          echo "PRIVATE_RUNTIME_UPDATE=PASS before=$before after=$(git -C "$repo" rev-parse HEAD)"

      - name: Read application DB truth directly
        shell: bash
        run: |
          set -euo pipefail
          docker exec job_pipeline_postgres sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -c "select count(*) from gold_product_v1_application_tracking;"' | sed 's/^/APPLICATION_COUNT=/'
          docker exec job_pipeline_postgres sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -F "|" -c "select application_id, coalesce(authoritative_stage::text,chr(45)), coalesce(observed_stage::text,chr(45)), coalesce(effective_stage::text,chr(45)), left(job_identity_snapshot::text,500) from gold_product_v1_application_tracking where lower(job_identity_snapshot::text) like chr(37)||chr(102)||chr(105)||chr(110)||chr(97)||chr(110)||chr(122)||chr(37) or lower(job_identity_snapshot::text) like chr(37)||chr(102)||chr(45)||chr(105)||chr(46)||chr(100)||chr(101)||chr(37) or lower(job_identity_snapshot::text) like chr(37)||chr(101)||chr(51)||chr(54)||chr(50)||chr(37);"' | sed 's/^/FI_ROW|/'

      - name: Audit newly discovered mailbox applications for false positives
        shell: bash
        run: |
          docker exec job_pipeline_postgres sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -F "|" -c "select a.id,a.created_at,coalesce(a.job_identity_snapshot->>chr(106)||chr(111)||chr(98)||chr(95)||chr(116)||chr(105)||chr(116)||chr(108)||chr(101),chr(45)),coalesce(a.job_identity_snapshot->>chr(101)||chr(109)||chr(112)||chr(108)||chr(111)||chr(121)||chr(101)||chr(114)||chr(95)||chr(110)||chr(97)||chr(109)||chr(101),chr(45)),coalesce(a.job_identity_snapshot->>chr(99)||chr(111)||chr(117)||chr(110)||chr(116)||chr(101)||chr(114)||chr(112)||chr(97)||chr(114)||chr(116)||chr(121)||chr(95)||chr(100)||chr(111)||chr(109)||chr(97)||chr(105)||chr(110),chr(45)),coalesce(v.observed_stage::text,chr(45)),(select count(*) from application_event_candidates c where c.matched_application_id=a.id and c.is_active),(select count(*) from application_submissions s where s.application_id=a.id) from applications a join gold_product_v1_application_tracking v on v.application_id=a.id where a.id>=19 order by a.id;"' | sed 's/^/NEW_MAILBOX_APP|/'
      - name: Audit false-positive candidate classes and domains
        shell: bash
        run: |
          docker exec job_pipeline_postgres sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -F "|" -c "select a.id,c.candidate_class,coalesce(c.evidence_payload->>chr(99)||chr(111)||chr(117)||chr(110)||chr(116)||chr(101)||chr(114)||chr(112)||chr(97)||chr(114)||chr(116)||chr(121)||chr(95)||chr(100)||chr(111)||chr(109)||chr(97)||chr(105)||chr(110),chr(45)),coalesce(c.evidence_payload->>chr(114)||chr(101)||chr(97)||chr(115)||chr(111)||chr(95)||chr(99)||chr(111)||chr(100)||chr(101),chr(45)),c.observed_at from applications a join application_event_candidates c on c.matched_application_id=a.id and c.is_active where a.id>=19 order by a.id,c.observed_at;"' | sed 's/^/FP_EVIDENCE|/'
      - name: Apply qualified false-positive cleanup
        shell: bash
        run: |
          set -euo pipefail
          repo="$HOME/projects/job-application-pipeline"
          test -d "$repo/.git"
          git -C "$repo" fetch origin main
          test "$(git -C "$repo" rev-parse FETCH_HEAD)" = "765183ce200407318ff0ec85d01739937e2d0f92"
          git -C "$repo" checkout --detach FETCH_HEAD
          cd "$repo"
          count="$(
            docker exec job_pipeline_postgres sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -c "select count(*) from applications a where a.discovery_kind=chr(109)||chr(97)||chr(105)||chr(108)||chr(98)||chr(111)||chr(120)||chr(95)||chr(111)||chr(98)||chr(115)||chr(101)||chr(114)||chr(118)||chr(101)||chr(100) and a.created_at=TIMESTAMPTZ chr(39)||chr(50)||chr(48)||chr(50)||chr(54)||chr(45)||chr(48)||chr(57)||chr(45)||chr(50)||chr(50)||chr(32)||chr(49)||chr(48)||chr(58)||chr(49)||chr(52)||chr(58)||chr(49)||chr(50)||chr(46)||chr(57)||chr(49)||chr(49)||chr(53)||chr(48)||chr(55)||chr(43)||chr(48)||chr(48)||chr(39) and a.id>=19 and a.silver_job_id is null and coalesce(a.job_identity_snapshot->>chr(106)||chr(111)||chr(98)||chr(95)||chr(116)||chr(105)||chr(116)||chr(108)||chr(101),chr(39)||chr(39))=chr(39)||chr(39) and coalesce(a.job_identity_snapshot->>chr(101)||chr(109)||chr(112)||chr(108)||chr(111)||chr(121)||chr(101)||chr(114)||chr(95)||chr(110)||chr(97)||chr(109)||chr(101),chr(39)||chr(39))=chr(39)||chr(39) and not exists (select 1 from application_submissions s where s.application_id=a.id);"' 
          )"
          echo "UNSAFE_MAILBOX_APPLICATIONS=$count"
          test "$count" = "19"
          .venv/bin/python scripts/run_f5_mailbox_false_positive_cleanup.py --apply --approval-token F5-MAILBOX-FALSE-POSITIVE-CLEANUP-V1
          echo "F5_FALSE_POSITIVE_CLEANUP=PASS"

      - name: Inspect FI identity and evidence split
        shell: bash
        run: |
          set -euo pipefail
          docker exec job_pipeline_postgres sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -F "|" -c "select a.id,a.application_key,a.discovery_kind,a.provenance->>chr(116)||chr(104)||chr(114)||chr(101)||chr(97)||chr(100)||chr(95)||chr(114)||chr(101)||chr(102)||chr(101)||chr(114)||chr(101)||chr(110)||chr(99)||chr(101),left(a.job_identity_snapshot::text,700) from applications a where a.id in (15,18);"' | sed 's/^/FI_APP_DETAIL|/'
          docker exec job_pipeline_postgres sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -F "|" -c "select c.id,c.matched_application_id,c.candidate_class,c.match_status,c.review_status,c.source_thread_reference,c.observed_at,left(c.evidence_payload::text,900) from application_event_candidates c where c.matched_application_id in (15,18) and c.is_active order by c.observed_at;"' | sed 's/^/FI_CANDIDATE|/'
          docker exec job_pipeline_postgres sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -F "|" -c "select a.id,coalesce(a.job_identity_snapshot->>chr(106)||chr(111)||chr(98)||chr(95)||chr(116)||chr(105)||chr(116)||chr(108)||chr(101),chr(45)),coalesce(a.job_identity_snapshot->>chr(101)||chr(109)||chr(112)||chr(108)||chr(111)||chr(121)||chr(101)||chr(114)||chr(95)||chr(110)||chr(97)||chr(109)||chr(101),chr(45)),coalesce(v.observed_stage::text,chr(45)),coalesce(v.effective_stage::text,chr(45)) from applications a join gold_product_v1_application_tracking v on v.application_id=a.id order by a.id;"' | sed 's/^/APP_SUMMARY|/'

      - name: Diagnose v1.0.56 mailbox 503
        shell: bash
        run: |
          set -u
          echo "=== MAILBOX STATUS ==="
          cat "$HOME/.local/state/jap/mailbox-sync/status.json" 2>/dev/null || true
          echo
          echo "=== DIRECT SYNC RESPONSE ==="
          curl -sS -i -X POST -H 'Accept: application/json' http://127.0.0.1:8780/api/v1/product-v1/mailbox-sync || true
          echo
          echo "=== STATUS AFTER DIRECT SYNC ==="
          cat "$HOME/.local/state/jap/mailbox-sync/status.json" 2>/dev/null || true
          echo
          echo "=== PRODUCT TRUTH STILL AVAILABLE ==="
          curl -sS -o /tmp/product-after-mailbox-failure.json -w 'HTTP=%{http_code}\n' http://127.0.0.1:8780/api/v1/product-v1 || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/product-after-mailbox-failure.json')
          if p.exists():
              try:
                  d=json.loads(p.read_text())
                  print("PRODUCT_APPLICATIONS="+str(len((d.get("application_tracking") or {}).get("applications") or [])))
              except Exception as exc:
                  print("PRODUCT_PARSE_ERROR="+type(exc).__name__)
          PY

      - name: Read mailbox sync runtime status
        shell: bash
        run: |
          set -u
          echo "HOME=$HOME"
          echo "RUNTIME_ROOT=${JAP_PRIVATE_RUNTIME_ROOT:-$HOME/projects/job-pipeline-runtime}"
          for p in "$HOME/.local/state/jap/mailbox-sync/status.json" "$HOME/.config/DeepOceanInfrastructure/JAP/gmail-oauth-client.json" "$HOME/.config/DeepOceanInfrastructure/JAP/gmail-readonly-token.json" "$HOME/projects/job-pipeline-runtime/scripts/f5_gmail_readonly_bridge.py"; do
            if [ -f "$p" ]; then echo "EXISTS=$p"; else echo "MISSING=$p"; fi
          done
          if [ -f "$HOME/.local/state/jap/mailbox-sync/status.json" ]; then
            python3 - "$HOME/.local/state/jap/mailbox-sync/status.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          keep={k:d.get(k) for k in ("schema","status","reason","started_at","finished_at","normalized_rows","error_type","message","gmail_scope")}
          print("MAILBOX_SYNC_STATUS="+json.dumps(keep,ensure_ascii=False,sort_keys=True))
          print("PLAN="+json.dumps(d.get("plan"),ensure_ascii=False,sort_keys=True))
          print("ACTUAL="+json.dumps(d.get("actual"),ensure_ascii=False,sort_keys=True))
          PY
          fi
          echo "RUNTIME_HEAD=$(git -C "$HOME/projects/job-pipeline-runtime" rev-parse HEAD 2>/dev/null || echo unavailable)"
          echo "RUNTIME_MAIN=$(git -C "$HOME/projects/job-pipeline-runtime" rev-parse origin/main 2>/dev/null || echo unavailable)"

      - name: Read current Product truth
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          curl --fail --silent --show-error --max-time 20 http://127.0.0.1:8780/api/v1/product-v1 > "$tmp"
          python3 - "$tmp" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1]))
          print("TOP_KEYS="+",".join(sorted(d.keys())))
          for k,v in d.items():
              n=len(v) if hasattr(v,"__len__") else "na"
              print("FIELD|{}|type={}|count={}".format(k,type(v).__name__,n))
          at=d.get("application_tracking") or {}
          if isinstance(at,dict):
              print("APP_TRACKING_KEYS="+",".join(sorted(at.keys())))
              for k,v in at.items():
                  n=len(v) if hasattr(v,"__len__") else "na"
                  print("APP_FIELD|{}|type={}|count={}".format(k,type(v).__name__,n))
              apps=at.get("applications") or at.get("rows") or at.get("items") or []
              for a in apps:
                  if isinstance(a,dict):
                      print("APP|"+json.dumps({k:a.get(k) for k in ["application_id","application_key","employer_name","job_title","effective_stage","silver_job_id","job_link_status"]},ensure_ascii=False,sort_keys=True))
          for key in ("observed_opportunities","discovery_source_jobs","historical_jobs","top_jobs"):
              rows=d.get(key) or []
              if isinstance(rows,list):
                  for j in rows:
                      if isinstance(j,dict):
                          print("JOB|surface={}|{}".format(key,json.dumps({k:j.get(k) for k in ["silver_job_id","job_id","id","title","job_title","company_name","employer_name","application_stage","application_id","application_key","review_scope"]},ensure_ascii=False,sort_keys=True)))
          PY
          python3 - "$tmp" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1]))
          at=d.get("application_tracking") or {}
          print("JOB_LINKAGE="+json.dumps(at.get("job_linkage"),ensure_ascii=False,sort_keys=True))
          for a in at.get("applications") or []:
              if isinstance(a,dict):
                  print("APP_FULL|"+json.dumps(a,ensure_ascii=False,sort_keys=True))
          for j in d.get("job_readiness") or []:
              if isinstance(j,dict) and (
                  "finanz" in str(j).lower()
                  or "hornet" in str(j).lower()
                  or j.get("application_stage")
                  or j.get("application_id")
                  or j.get("application_key")
              ):
                  print("CURRENT_JOB_FULL|"+json.dumps(j,ensure_ascii=False,sort_keys=True))
          PY
          python3 - "$tmp" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1]))
          at=d.get("application_tracking") or {}
          apps=at.get("applications") or []
          print("LIVE_APPLICATION_COUNT="+str(len(apps)))
          for a in apps:
              if not isinstance(a,dict):
                  continue
              blob=json.dumps(a,ensure_ascii=False).lower()
              if any(term in blob for term in ("finanz informatik","f-i.de","e362","ki-entwickler")):
                  print("FI_APPLICATION|"+json.dumps(a,ensure_ascii=False,sort_keys=True))
          for key,val in d.items():
              if isinstance(val,list):
                  for row in val:
                      if isinstance(row,dict):
                          blob=json.dumps(row,ensure_ascii=False).lower()
                          if any(term in blob for term in ("finanz informatik","e362","ki-entwickler")):
                              print("FI_PRODUCT_ROW|surface="+key+"|"+json.dumps(row,ensure_ascii=False,sort_keys=True))
          PY
          rm -f "$tmp"
