name: JAP current application-job linkage audit

on:
  push:
    branches:
      - diag/962-workstation-update
    paths:
      - ".github/workflows/jap-current-application-linkage-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    name: Read-only current application/job linkage audit
    runs-on: [self-hosted, Linux, X64, job-pipeline-runtime-linux]
    timeout-minutes: 8
    steps:
      - name: Read current Product truth
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          curl --fail --silent --show-error --max-time 20 http://127.0.0.1:8780/api/v1/product-v1 > "$tmp"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("TOP_KEYS="+",".join(sorted(d.keys()))); [print(f"{k}_TYPE={type(d.get(k)).__name__}") for k in ["jobs","all_jobs","operator_review_jobs","applications","application_tracking","f5_application_tracking"] if k in d]' "$tmp"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); jobs=d.get("jobs") or d.get("all_jobs") or d.get("operator_review_jobs") or []; apps=((d.get("f5_application_tracking") or {}).get("applications") if isinstance(d.get("f5_application_tracking"),dict) else None) or d.get("applications") or (d.get("application_tracking") if isinstance(d.get("application_tracking"),list) else []) or []; print(f"JOBS_COUNT={len(jobs)}"); print(f"APPLICATIONS_COUNT={len(apps)}"); ids={}; [ids.setdefault((j.get("silver_job_id") or j.get("job_id") or j.get("id")),j) for j in jobs if isinstance(j,dict) and (j.get("silver_job_id") or j.get("job_id") or j.get("id")) is not None]; current=[]; [(print("APP|id={}|employer={}|title={}|stage={}|silver_job_id={}|link_status={}|in_current_all_jobs={}".format(a.get("application_id"),a.get("employer_name"),a.get("job_title"),a.get("effective_stage"),a.get("silver_job_id"),a.get("job_link_status"),a.get("silver_job_id") in ids if a.get("silver_job_id") is not None else False)), current.append(a) if a.get("silver_job_id") in ids else None) for a in apps if isinstance(a,dict)]; print(f"CURRENT_LINKED_APPLICATIONS={len(current)}"); [print("CURRENT_LINK|id={}|employer={}|title={}|stage={}|silver_job_id={}".format(a.get("application_id"),a.get("employer_name"),a.get("job_title"),a.get("effective_stage"),a.get("silver_job_id"))) for a in current]' "$tmp"
          rm -f "$tmp"
