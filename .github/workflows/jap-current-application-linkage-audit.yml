name: JAP current application-job linkage audit

on:
  push:
    branches:
      - diag/962-workstation-update
    paths:
      - ".github/workflows/jap-current-application-linkage-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    name: Read-only current application/job linkage audit
    runs-on: [self-hosted, Linux, X64, job-pipeline-runtime-linux]
    timeout-minutes: 8
    steps:
      - name: Read current Product truth
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          curl --fail --silent --show-error --max-time 20 http://127.0.0.1:8780/api/v1/product-v1 > "$tmp"
          python3 - "$tmp" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1]))
          print("TOP_KEYS="+",".join(sorted(d.keys())))
          for k,v in d.items():
              n=len(v) if hasattr(v,"__len__") else "na"
              print("FIELD|{}|type={}|count={}".format(k,type(v).__name__,n))
          at=d.get("application_tracking") or {}
          if isinstance(at,dict):
              print("APP_TRACKING_KEYS="+",".join(sorted(at.keys())))
              for k,v in at.items():
                  n=len(v) if hasattr(v,"__len__") else "na"
                  print("APP_FIELD|{}|type={}|count={}".format(k,type(v).__name__,n))
              apps=at.get("applications") or at.get("rows") or at.get("items") or []
              for a in apps:
                  if isinstance(a,dict):
                      print("APP|"+json.dumps({k:a.get(k) for k in ["application_id","application_key","employer_name","job_title","effective_stage","silver_job_id","job_link_status"]},ensure_ascii=False,sort_keys=True))
          for key in ("observed_opportunities","discovery_source_jobs","historical_jobs","top_jobs"):
              rows=d.get(key) or []
              if isinstance(rows,list):
                  for j in rows:
                      if isinstance(j,dict):
                          print("JOB|surface={}|{}".format(key,json.dumps({k:j.get(k) for k in ["silver_job_id","job_id","id","title","job_title","company_name","employer_name","application_stage","application_id","application_key","review_scope"]},ensure_ascii=False,sort_keys=True)))
          PY
          rm -f "$tmp"
