name: F2 Silver evidence-basis migration qualification

on:
  push:
    branches: [agent/f2-bite-generic-provider]
    paths:
      - ".github/workflows/f2-valuny-silver-state-diagnostic.yml"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: [self-hosted, Linux, X64, job-pipeline-runtime-linux]
    timeout-minutes: 10
    env:
      RCC_REPOSITORY_ID: "1230805345"
      RCC_REPOSITORY: jenshaberle-dotcom/job-application-pipeline
      RCC_RUNNER_NAME: job-pipeline-runtime-linux
      MIGRATION_KEY: 108_add_silver_processing_evidence_basis.sql

    steps:
      - name: Check out exact migration head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve verified RCC runtime context
        shell: bash
        run: |
          set -euo pipefail
          context_file="${RCC_RUNTIME_CONTEXT_FILE:-$HOME/.config/DeepOceanInfrastructure/RCC/runtime-contexts/${RCC_REPOSITORY_ID}-${RCC_RUNNER_NAME}.json}"
          context_output="$(python3 - "$context_file" "$RCC_REPOSITORY_ID" "$RCC_REPOSITORY" "$RCC_RUNNER_NAME" <<'PY'
          import json
          import sys
          from pathlib import PurePosixPath

          path, repo_id, repository, runner = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              context = json.load(handle)
          if context.get("RepositoryId") != int(repo_id):
              raise SystemExit("RUNTIME_REPOSITORY_ID_MISMATCH")
          if context.get("Repository") != repository:
              raise SystemExit("RUNTIME_REPOSITORY_MISMATCH")
          if context.get("RunnerName") != runner:
              raise SystemExit("RUNTIME_RUNNER_MISMATCH")
          if context.get("Status") != "PASS":
              raise SystemExit("RUNTIME_CONTEXT_NOT_PASS")
          checkout = context.get("CheckoutRoot")
          interpreter = context.get("Interpreter")
          env_file = context.get("EnvFile")
          root = PurePosixPath(checkout)
          if root not in PurePosixPath(interpreter).parents:
              raise SystemExit("INTERPRETER_OUTSIDE_CHECKOUT")
          if root not in PurePosixPath(env_file).parents:
              raise SystemExit("ENV_OUTSIDE_CHECKOUT")
          print(interpreter)
          print(env_file)
          PY
          )"
          mapfile -t values <<< "$context_output"
          test "${#values[@]}" -eq 2
          printf 'RUNTIME_PYTHON=%s\n' "${values[0]}" >> "$GITHUB_ENV"
          printf 'RUNTIME_ENV_FILE=%s\n' "${values[1]}" >> "$GITHUB_ENV"

      - name: Load masked product database environment
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" - "$RUNTIME_ENV_FILE" "$GITHUB_ENV" <<'PY'
          import secrets
          import sys
          from pathlib import Path
          from dotenv import dotenv_values

          values = dotenv_values(Path(sys.argv[1]))
          github_env = Path(sys.argv[2])
          required = (
              "POSTGRES_HOST", "POSTGRES_PORT", "POSTGRES_DB",
              "POSTGRES_USER", "POSTGRES_PASSWORD",
          )
          missing = [key for key in required if values.get(key) in (None, "")]
          if missing:
              raise SystemExit("RUNTIME_ENV_POSTGRES_KEYS_MISSING:" + ",".join(missing))
          print(f"::add-mask::{values['POSTGRES_PASSWORD']}")
          with github_env.open("a", encoding="utf-8") as handle:
              for key in required:
                  value = str(values[key])
                  marker = f"JAP_ENV_{secrets.token_hex(12)}"
                  while marker in value:
                      marker = f"JAP_ENV_{secrets.token_hex(12)}"
                  handle.write(f"{key}<<{marker}\n{value}\n{marker}\n")
          PY

      - name: Require sole pending migration and apply exact 108
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" -m scripts.apply_db_migrations --status
          "$RUNTIME_PYTHON" -m scripts.apply_db_migrations \
            --apply-exact "$MIGRATION_KEY" \
            --require-sole-pending \
            --applied-by f2-bite-silver-evidence-qualification

      - name: Verify migration state and columns read-only
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" - "$MIGRATION_KEY" <<'PY'
          import sys
          import psycopg
          from psycopg.rows import dict_row
          from src.config import get_database_config

          migration_key = sys.argv[1]
          with psycopg.connect(**get_database_config(), row_factory=dict_row) as conn:
              with conn.cursor() as cur:
                  cur.execute("SET TRANSACTION READ ONLY")
                  cur.execute(
                      """
                      SELECT execution_status, execution_mode
                      FROM schema_migrations
                      WHERE migration_key = %s
                      """,
                      (migration_key,),
                  )
                  migration = cur.fetchone()
                  cur.execute(
                      """
                      SELECT column_name
                      FROM information_schema.columns
                      WHERE table_schema = 'public'
                        AND table_name = 'silver_processing_decisions'
                        AND column_name IN (
                            'normalized_evidence_hash',
                            'evidence_contract_version'
                        )
                      ORDER BY column_name
                      """
                  )
                  columns = [row["column_name"] for row in cur.fetchall()]
          if migration is None or migration["execution_status"] != "success":
              raise SystemExit("F2_SILVER_EVIDENCE_MIGRATION_NOT_TRACKED_SUCCESS")
          if columns != ["evidence_contract_version", "normalized_evidence_hash"]:
              raise SystemExit(f"F2_SILVER_EVIDENCE_COLUMNS_MISSING:{columns}")
          print(
              "F2_SILVER_EVIDENCE_MIGRATION=PASS|"
              f"mode={migration['execution_mode']}|columns={','.join(columns)}"
          )
          PY
