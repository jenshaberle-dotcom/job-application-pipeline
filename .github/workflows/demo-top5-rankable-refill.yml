name: Demo Top 5 rankable refill

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: demo-top5-rankable-refill
  cancel-in-progress: false

jobs:
  refill:
    name: Evidence-bound live Top 5 refill
    if: >-
      vars.RCC_JAP_LEGACY_DIRECT_ASSIGNMENT_ALLOWED == 'true' && vars.RCC_JAP_BLUE_ASSIGNMENT_FROZEN != 'true' &&
      github.event.issue.number == 1089 &&
      github.event.comment.user.login == 'jenshaberle-dotcom' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '<!-- jap-demo-top5-refill:apply:v1 -->')
    runs-on: [self-hosted, Linux, X64, job-pipeline-runtime-linux]
    timeout-minutes: 30
    env:
      RCC_REPOSITORY_ID: "1230805345"
      RCC_REPOSITORY: jenshaberle-dotcom/job-application-pipeline
      RCC_RUNNER_NAME: job-pipeline-runtime-linux
      SCOUT_OUTPUT: /tmp/jap-demo-top5-scout.json
      APPLY_OUTPUT: /tmp/jap-demo-top5-apply.json
      DATA_LAYERS_OUTPUT: /tmp/jap-demo-top5-data-layers-after.json
      CAMPAIGN_APPROVAL_TOKEN: DEMO-001-RANKABLE-REFILL-CAMPAIGN-001

    steps:
      - name: Parse exact owner approval envelope
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          EVENT_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          marker = "<!-- jap-demo-top5-refill:apply:v1 -->"
          lines = [line.strip() for line in os.environ["COMMENT_BODY"].splitlines() if line.strip()]
          if not lines or lines[0] != marker:
              raise SystemExit("TOP5_APPROVAL_MARKER_MISMATCH")

          values = {}
          for line in lines[1:]:
              if "=" not in line:
                  raise SystemExit("TOP5_APPROVAL_ENVELOPE_MALFORMED")
              key, value = line.split("=", 1)
              key = key.strip()
              value = value.strip()
              if key in values:
                  raise SystemExit("TOP5_APPROVAL_DUPLICATE_KEY:" + key)
              values[key] = value

          required = {"source_sha", "target_rankable", "candidate_cap"}
          if set(values) != required:
              raise SystemExit("TOP5_APPROVAL_KEYS_MISMATCH")

          source_sha = values["source_sha"]
          if re.fullmatch(r"[0-9a-f]{40}", source_sha) is None:
              raise SystemExit("TOP5_APPROVAL_SOURCE_SHA_INVALID")
          if source_sha != os.environ["EVENT_SOURCE_SHA"]:
              raise SystemExit("TOP5_APPROVAL_SOURCE_NOT_CURRENT_MAIN")

          target_rankable = int(values["target_rankable"])
          candidate_cap = int(values["candidate_cap"])
          if target_rankable != 5:
              raise SystemExit("TOP5_TARGET_MUST_BE_FIVE")
          if not 5 <= candidate_cap <= 10:
              raise SystemExit("TOP5_CANDIDATE_CAP_OUT_OF_BOUNDS")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"SOURCE_SHA={source_sha}\n")
              handle.write(f"TARGET_RANKABLE={target_rankable}\n")
              handle.write(f"CANDIDATE_CAP={candidate_cap}\n")
          print(
              "TOP5_APPROVAL=PASS "
              f"source={source_sha} target={target_rankable} candidate_cap={candidate_cap}"
          )
          PY

      - name: Check out exact approved main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact source identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$SOURCE_SHA"
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$SOURCE_SHA"
          echo "TOP5_EXACT_SOURCE=PASS source=$actual"

      - name: Resolve verified RCC runtime context
        shell: bash
        run: |
          set -euo pipefail
          context_file="${RCC_RUNTIME_CONTEXT_FILE:-$HOME/.config/DeepOceanInfrastructure/RCC/runtime-contexts/${RCC_REPOSITORY_ID}-${RCC_RUNNER_NAME}.json}"
          test -f "$context_file"
          context_output="$(python3 - "$context_file" "$RCC_REPOSITORY_ID" "$RCC_REPOSITORY" "$RCC_RUNNER_NAME" <<'PY'
          import json
          import sys
          from pathlib import PurePosixPath

          path, repo_id, repository, runner = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              context = json.load(handle)
          if context.get("RepositoryId") != int(repo_id):
              raise SystemExit("RUNTIME_REPOSITORY_ID_MISMATCH")
          if context.get("Repository") != repository:
              raise SystemExit("RUNTIME_REPOSITORY_MISMATCH")
          if context.get("RunnerName") != runner:
              raise SystemExit("RUNTIME_CONTEXT_STALE: runner mismatch")
          if context.get("Platform") != "linux-wsl":
              raise SystemExit("RUNTIME_CONTEXT_STALE: platform mismatch")
          if context.get("Status") != "PASS" or context.get("PrimaryFailure") not in (None, ""):
              raise SystemExit("RUNTIME_CONTEXT_NOT_PASS")
          checks = {
              item.get("Id"): item.get("Status")
              for item in context.get("Checks", [])
              if isinstance(item, dict)
          }
          required = {
              "repository_identity",
              "checkout",
              "checkout_repository",
              "env_file",
              "env_keys",
              "interpreter",
              "interpreter_probe",
              "capability:postgresql",
          }
          failed = sorted(key for key in required if checks.get(key) != "PASS")
          if failed:
              raise SystemExit("RUNTIME_CHECKS_NOT_PASS:" + ",".join(failed))
          checkout = context.get("CheckoutRoot")
          interpreter = context.get("Interpreter")
          env_file = context.get("EnvFile")
          root = PurePosixPath(checkout)
          if root not in PurePosixPath(interpreter).parents:
              raise SystemExit("INTERPRETER_OUTSIDE_QUALIFIED_CHECKOUT")
          if root not in PurePosixPath(env_file).parents:
              raise SystemExit("ENV_OUTSIDE_QUALIFIED_CHECKOUT")
          print(interpreter)
          print(env_file)
          PY
          )"
          mapfile -t values <<< "$context_output"
          test "${#values[@]}" -eq 2
          test -x "${values[0]}"
          test -s "${values[1]}"
          printf 'TOP5_PYTHON=%s\n' "${values[0]}" >> "$GITHUB_ENV"
          printf 'RUNTIME_ENV_FILE=%s\n' "${values[1]}" >> "$GITHUB_ENV"
          echo "TOP5_RCC_RUNTIME=PASS runner=${RUNNER_NAME:-unknown}"

      - name: Prove verified RCC Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          "$TOP5_PYTHON" -m pip check
          "$TOP5_PYTHON" - <<'PY'
          import psycopg
          import requests
          import scripts.run_demo_001_rankable_refill_campaign
          import scripts.run_demo_001_rankable_refill_scout
          print("TOP5_RCC_PYTHON_IMPORTS=PASS")
          PY

      - name: Scout real live Candidate-Fact-backed jobs
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$RUNTIME_ENV_FILE"
          set +a
          export PGOPTIONS="-c default_transaction_read_only=on"
          "$TOP5_PYTHON" -m scripts.run_demo_001_rankable_refill_scout             --limit 40             --output "$SCOUT_OUTPUT"
          "$TOP5_PYTHON" - "$SCOUT_OUTPUT" <<'PY'
          import json
          import os
          import sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          if payload.get("boundaries", {}).get("database_writes") is not False:
              raise SystemExit("TOP5_SCOUT_WRITE_BOUNDARY")
          if payload.get("boundaries", {}).get("provider_requests") != 0:
              raise SystemExit("TOP5_SCOUT_PROVIDER_BOUNDARY")
          if int(payload.get("live_role_and_fact_match_count") or 0) < 1:
              raise SystemExit("TOP5_SCOUT_NO_LIVE_FACT_MATCH")
          print(
              "TOP5_SCOUT=PASS "
              f"candidates={payload.get('candidate_count')} "
              f"live={payload.get('live_active_count')} "
              f"fact_match={payload.get('live_role_and_fact_match_count')}"
          )
          PY

      - name: Plan guarded refill campaign without writes
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$RUNTIME_ENV_FILE"
          set +a
          export PGOPTIONS="-c default_transaction_read_only=on"
          "$TOP5_PYTHON" -m scripts.run_demo_001_rankable_refill_campaign \
            --target-rankable "$TARGET_RANKABLE" \
            --candidate-cap "$CANDIDATE_CAP" \
            --reviewed-by "demo-top5-plan:${GITHUB_ACTOR}"
          echo "TOP5_CAMPAIGN_PLAN=PASS"

      - name: Apply through existing revision capability hard-filter and ranking authorities
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$RUNTIME_ENV_FILE"
          set +a
          unset PGOPTIONS || true

          "$TOP5_PYTHON" -m scripts.run_demo_001_rankable_refill_campaign \
            --target-rankable "$TARGET_RANKABLE" \
            --candidate-cap "$CANDIDATE_CAP" \
            --reviewed-by "demo-top5:${GITHUB_ACTOR}" \
            --apply \
            --approval-token "$CAMPAIGN_APPROVAL_TOKEN"

          canonical_output=".runtime/demo/demo_001_rankable_refill_apply.json"
          test -s "$canonical_output"
          cp "$canonical_output" "$APPLY_OUTPUT"

      - name: Prove authoritative Top 5 result
        shell: bash
        run: |
          set -euo pipefail
          "$TOP5_PYTHON" - "$APPLY_OUTPUT" "$TARGET_RANKABLE" <<'PY'
          import json
          import sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          target = int(sys.argv[2])
          if payload.get("mode") != "apply":
              raise SystemExit("TOP5_APPLY_MODE_MISMATCH")
          boundaries = payload.get("boundaries") or {}
          if boundaries.get("hard_filter_operator_review_writes") is not False:
              raise SystemExit("TOP5_APPLY_HARD_FILTER_AUTHORITY_DRIFT")
          if boundaries.get("direct_rank_or_top5_writes") is not False:
              raise SystemExit("TOP5_APPLY_DIRECT_RANK_AUTHORITY_DRIFT")
          if boundaries.get("provider_or_llm_requests") != 0:
              raise SystemExit("TOP5_APPLY_PROVIDER_BOUNDARY")
          final = payload.get("final") or {}
          rankable = int(final.get("total_rankable") or 0)
          top_jobs = int(final.get("top_jobs") or 0)
          if rankable < target:
              raise SystemExit(f"TOP5_TARGET_NOT_MET:rankable={rankable}:target={target}")
          if top_jobs < target:
              raise SystemExit(f"TOP5_VIEW_NOT_POPULATED:top_jobs={top_jobs}:target={target}")
          if payload.get("target_met") is not True:
              raise SystemExit("TOP5_TARGET_FLAG_MISMATCH")
          print(f"TOP5_AUTHORITATIVE_RESULT=PASS rankable={rankable} top_jobs={top_jobs}")
          for row in final.get("cohort") or []:
              print(
                  "TOP5_FINAL_JOB="
                  f"{row.get('silver_job_id')}|{row.get('product_readiness_status')}|"
                  f"{row.get('hard_filter_status')}|{row.get('overall_quality_score')}|"
                  f"{row.get('company_name')}|{row.get('title')}"
              )
          PY

      - name: Prove fit and Data Layers after refill
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$RUNTIME_ENV_FILE"
          set +a
          export PGOPTIONS="-c default_transaction_read_only=on"

          "$TOP5_PYTHON" -m scripts.run_f4a_profile_fit_diagnostic

          "$TOP5_PYTHON" - "$DATA_LAYERS_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          from scripts.product_v1_control_center_base import load_product_v1_payload
          from scripts.product_v1_data_layers_runtime import load_data_layers_payload

          product = load_product_v1_payload(include_source_connector_overview=False)
          layers = load_data_layers_payload(product)
          Path(sys.argv[1]).write_text(
              json.dumps(layers, indent=2, default=str, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          summary = product.get("summary") or {}
          if int(summary.get("rankable_job_count") or 0) < 5:
              raise SystemExit("TOP5_POST_PRODUCT_RANKABLE_LT_5")
          if int(summary.get("top_job_count") or 0) < 5:
              raise SystemExit("TOP5_POST_PRODUCT_TOP_LT_5")

          print(f"POST_CURRENT_JOBS={layers['population']['all_jobs']}")
          print(f"POST_GOLD_ASSESSED={layers['layers']['gold_assessed']}")
          print(f"POST_RANKABLE={layers['layers']['rankable_now']}")
          print(f"POST_TOP5={layers['layers']['top_jobs_now']}")
          print("POST_GOLD_FRESHNESS=" + str(layers["freshness"]["latest_gold_assessed_at"]))
          print("TOP5_POST_DATA_LAYERS=PASS")
          PY

      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-top5-rankable-refill-${{ github.run_id }}
          path: |
            /tmp/jap-demo-top5-scout.json
            .runtime/demo/demo_001_rankable_refill_materialization.json
            /tmp/jap-demo-top5-apply.json
            /tmp/jap-demo-top5-data-layers-after.json
          if-no-files-found: warn
          retention-days: 30
