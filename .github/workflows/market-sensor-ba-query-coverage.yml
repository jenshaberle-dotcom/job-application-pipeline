name: Market sensor BA query coverage diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/market-sensor-ba-query-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-sensor-ba-query-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Read-only BA query coverage
    runs-on: [self-hosted, Linux, X64, job-pipeline-runtime-linux]
    timeout-minutes: 15
    env:
      RCC_REPOSITORY_ID: "1230805345"
      RCC_REPOSITORY: jenshaberle-dotcom/job-application-pipeline
      RCC_RUNNER_NAME: job-pipeline-runtime-linux

    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Resolve verified RCC runtime context
        shell: bash
        run: |
          set -euo pipefail
          context_file="${RCC_RUNTIME_CONTEXT_FILE:-$HOME/.config/DeepOceanInfrastructure/RCC/runtime-contexts/${RCC_REPOSITORY_ID}-${RCC_RUNNER_NAME}.json}"
          context_output="$(python3 - "$context_file" "$RCC_REPOSITORY_ID" "$RCC_REPOSITORY" "$RCC_RUNNER_NAME" <<'PY'
          import json
          import sys
          path, repo_id, repository, runner = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              context = json.load(handle)
          if context.get("RepositoryId") != int(repo_id):
              raise SystemExit("RUNTIME_REPOSITORY_ID_MISMATCH")
          if context.get("Repository") != repository:
              raise SystemExit("RUNTIME_REPOSITORY_MISMATCH")
          if context.get("RunnerName") != runner:
              raise SystemExit("RUNTIME_RUNNER_MISMATCH")
          if context.get("Status") != "PASS":
              raise SystemExit("RUNTIME_CONTEXT_NOT_PASS")
          print(context["Interpreter"])
          print(context["EnvFile"])
          PY
          )"
          mapfile -t values <<< "$context_output"
          test "${#values[@]}" -eq 2
          printf 'RUNTIME_PYTHON=%s\n' "${values[0]}" >> "$GITHUB_ENV"
          printf 'RUNTIME_ENV_FILE=%s\n' "${values[1]}" >> "$GITHUB_ENV"

      - name: Probe normal BA keyword families read-only
        shell: bash
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1090
          source "$RUNTIME_ENV_FILE"
          set +a
          export PGOPTIONS="-c default_transaction_read_only=on"

          terms=(
            "AI Automation Architect"
            "AI Automation"
            "AI Architect"
            "Automation Architect"
            "SDLC"
            "Software Development Lifecycle"
            "AI"
            "Automation"
          )

          found=0
          for term in "${terms[@]}"; do
            echo "=== BA_QUERY_FAMILY=$term ==="
            output="$("$RUNTIME_PYTHON" -m scripts.run_known_public_vacancy_parity               --company-key hornetsecurity               --expected-company "Hornetsecurity"               --expected-title "AI Automation Architect Software Development Lifecycle"               --ba-profile-name ba_data_engineer_30629_50km               --ba-search-term "$term"               --ba-external-job-id "10001-1003339347-S"               --live-ba)"
            printf '%s\n' "$output" | grep -E '^(PIPELINE_STAGE=ba_live|PIPELINE_STAGE_FIRST=ba_live|BA_LIVE_REQUEST=|DATABASE_WRITES=)'
            if grep -q '^PIPELINE_STAGE=ba_live|present=true|' <<< "$output"; then
              found=1
              echo "BA_QUERY_COVERAGE=FOUND|term=$term"
              break
            fi
          done

          if [ "$found" -ne 1 ]; then
            echo "BA_QUERY_COVERAGE=MISSING"
            exit 3
          fi
