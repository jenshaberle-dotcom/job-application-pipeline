name: JAP Windows Control Center local deploy

on:
  push:
    branches: [main]
    paths:
      - "JAP-Control-Center.ps1"
      - "Update-JAP-Control-Center.ps1"
      - "Stop-JAP-Control-Center.ps1"
      - "Apply-JAP-Control-Center-Update.ps1"
      - "install-jap-control-center.ps1"
      - "scripts/install_jap_windows_control_center.sh"
      - "scripts/deploy_jap_windows_control_center_local.sh"
      - "scripts/reap_jap_headless_desktop.ps1"
      - "scripts/prove_jap_headless_desktop_rejection.ps1"
      - "windows/JAP.ControlCenter.Desktop/**"
      - ".github/workflows/jap-windows-control-center-local-deploy.yml"
  workflow_run:
    workflows: ["JAP Windows Desktop Host release"]
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      reservation_id:
        description: Exact RCC warm-slot reservation id
        required: true
        type: string
      expected_runner:
        description: Exact physical runner reserved by RCC
        required: true
        default: rcc-general-linux-01--jap
        type: string
      source_sha:
        description: Exact JAP released source SHA bound to the reserved deploy workload
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jap-windows-control-center-local-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Stage or bootstrap JAP Control Center update on local workstation
    if: >-
      vars.RCC_JAP_BLUE_ASSIGNMENT_FROZEN != 'true' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, Linux, X64, job-pipeline-runtime-linux]
    timeout-minutes: 15

    steps:
      - name: Resolve exact released deploy source
        id: source
        uses: actions/github-script@v7
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SOURCE_SHA: ${{ inputs.source_sha || '' }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        with:
          script: |
            const eventName = process.env.EVENT_NAME;
            let sha = "";
            let authority = "";
            if (eventName === "workflow_dispatch") {
              sha = process.env.DISPATCH_SOURCE_SHA || "";
              authority = "rcc_reserved_dispatch";
            } else if (eventName === "workflow_run") {
              sha = process.env.WORKFLOW_RUN_HEAD_SHA || "";
              authority = "release_workflow_run";
            } else {
              const latest = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              sha = latest.data.target_commitish || "";
              authority = "latest_published_release";
            }
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed(`released_source_sha_invalid:${sha || "missing"}`);
              return;
            }
            core.setOutput("sha", sha);
            core.setOutput("authority", authority);
            core.info(`JAP_LOCAL_DEPLOY_SOURCE_AUTHORITY=${authority} source=${sha}`);

      - name: Prove RCC reservation and exact runner handoff before effects
        id: handoff
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RCC_RESERVATION_ID: ${{ inputs.reservation_id }}
          RCC_EXPECTED_RUNNER: ${{ inputs.expected_runner }}
          RCC_SOURCE_SHA: ${{ inputs.source_sha }}
          RESOLVED_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "$RCC_RESERVATION_ID"
          test -n "$RCC_EXPECTED_RUNNER"
          [[ "$RCC_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$RCC_SOURCE_SHA" = "$RESOLVED_SOURCE_SHA"
          if [[ "$RUNNER_NAME" != "$RCC_EXPECTED_RUNNER" ]]; then
            echo "RCC_EXACT_RUNNER_HANDOFF=FAIL expected=$RCC_EXPECTED_RUNNER actual=$RUNNER_NAME" >&2
            exit 1
          fi
          echo "verified=true" >> "$GITHUB_OUTPUT"
          echo "RCC_EXACT_RUNNER_HANDOFF=PASS runner=$RUNNER_NAME reservation=$RCC_RESERVATION_ID"

      - name: Record transitional local-runner admission
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          echo "JAP_LOCAL_DEPLOY_ADMISSION=BLUE_FACADE event=$GITHUB_EVENT_NAME runner=$RUNNER_NAME"
          echo "JAP_LOCAL_DEPLOY_RCC_CUTOVER_PENDING=FALSE"

      - name: Check out current deploy control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control-plane
          fetch-depth: 1

      - name: Check out exact released product source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: released-source
          fetch-depth: 0

      - name: Prove control-plane and released-source identities before local effects
        shell: bash
        env:
          EXPECTED_CONTROL_SHA: ${{ github.sha }}
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          control_sha="$(git -C control-plane rev-parse HEAD)"
          release_sha="$(git -C released-source rev-parse HEAD)"
          test "$control_sha" = "$EXPECTED_CONTROL_SHA"
          test "$release_sha" = "$EXPECTED_SOURCE_SHA"
          echo "JAP_DEPLOY_CONTROL_PLANE=PASS source=$control_sha"
          echo "JAP_EXACT_RELEASE_SOURCE_HANDOFF=PASS source=$release_sha authority=${{ steps.source.outputs.authority }}"

      - name: Reap exact stale Session-0 JAP desktop host
        shell: bash
        run: |
          set -euo pipefail
          reaper="$(wslpath -w "$PWD/released-source/scripts/reap_jap_headless_desktop.ps1")"
          powershell.exe \
            -NoProfile \
            -ExecutionPolicy Bypass \
            -File "$reaper"

      - name: Prove local Windows interop and stage update fail-closed
        shell: bash
        env:
          JAP_DEPLOY_SOURCE_ROOT: ${{ github.workspace }}/released-source
        run: |
          set -euo pipefail
          echo "JAP_LOCAL_DEPLOY_RUNNER=$RUNNER_NAME"
          echo "JAP_LOCAL_DEPLOY_SOURCE=$(git -C released-source rev-parse HEAD)"
          bash control-plane/scripts/deploy_jap_windows_control_center_local.sh

      - name: Require exact released version to be installed
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          expected_version="$(tr -d '\r\n' < released-source/windows/JAP.ControlCenter.Desktop/VERSION)"
          win_localappdata="$(powershell.exe -NoProfile -Command '[Environment]::GetFolderPath("LocalApplicationData")' | tr -d '\r' | tail -n 1)"
          current_json="$(wslpath -u "$win_localappdata")/JAP-Control-Center/current.json"
          mapfile -t installed < <(python3 -c 'import json,sys; from pathlib import Path; data=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8-sig")); print(data.get("pinned_sha", "")); print(data.get("desktop_host_version", ""))' "$current_json")
          test "${installed[0]}" = "$EXPECTED_SOURCE_SHA"
          test "${installed[1]}" = "$expected_version"
          echo "JAP_LOCAL_DEPLOY_INSTALLED_RELEASE=PASS version=${installed[1]} source=${installed[0]}"

      - name: Prove installed desktop rejects headless runner launch
        shell: bash
        run: |
          set -euo pipefail
          proof="$(wslpath -w "$PWD/released-source/scripts/prove_jap_headless_desktop_rejection.ps1")"
          expected_sha="$(git -C released-source rev-parse HEAD)"
          expected_version="$(tr -d '\r\n' < released-source/windows/JAP.ControlCenter.Desktop/VERSION)"
          powershell.exe \
            -NoProfile \
            -ExecutionPolicy Bypass \
            -File "$proof" \
            -ExpectedSha "$expected_sha" \
            -ExpectedVersion "$expected_version"

      - name: Capture bounded installed startup diagnostics
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          win_localappdata="$(timeout 10s cmd.exe /d /c 'echo %LOCALAPPDATA%' 2>/dev/null | tr -d '\r' | tail -n 1 || true)"
          if [[ -z "$win_localappdata" ]]; then
            echo "JAP_STARTUP_DIAG=UNAVAILABLE reason=localappdata_resolution_failed"
            exit 0
          fi
          install_root="$(wslpath -u "$win_localappdata")/JAP-Control-Center"
          echo "JAP_STARTUP_DIAG_INSTALL_ROOT=$install_root"
          for relative in current.json state/pending-update.json state/update-result.json state/runtime.json; do
            path="$install_root/$relative"
            echo "=== $relative ==="
            if [[ -f "$path" ]]; then sed -n '1,160p' "$path"; else echo "MISSING"; fi
          done
          for relative in logs/desktop-host-startup.log logs/desktop-host-update.log logs/desktop-host-lifecycle.log; do
            path="$install_root/$relative"
            echo "=== tail:$relative ==="
            if [[ -f "$path" ]]; then tail -n 120 "$path"; else echo "MISSING"; fi
          done
          wsl_state_root="$(
            python3 -c 'import json,sys; from pathlib import Path; data=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8-sig")); print(data.get("wsl_state_root", ""))'               "$install_root/current.json" 2>/dev/null || true
          )"
          for relative in runtime.stdout.log runtime.stderr.log; do
            path="$wsl_state_root/$relative"
            echo "=== tail:wsl-state/$relative ==="
            if [[ -n "$wsl_state_root" && -f "$path" ]]; then tail -n 120 "$path"; else echo "MISSING"; fi
          done
          echo "=== runtime-processes ==="
          ps -ef | grep -E 'run_product_v1_live_demo|run_jap_windows_control_center|python.*8780' | grep -v grep || true
          echo "=== port-8780 ==="
          ss -ltnp 2>/dev/null | grep ':8780' || echo "NO_LISTENER"
          echo "=== app-info ==="
          timeout 5s curl -fsS http://127.0.0.1:8780/app-info.json 2>&1 || echo "APP_INFO_UNAVAILABLE"

      - name: Record reservation completion boundary
        if: always() && github.event_name == 'workflow_dispatch' && steps.handoff.outputs.verified == 'true'
        shell: bash
        env:
          RCC_RESERVATION_ID: ${{ inputs.reservation_id }}
          RCC_EXPECTED_RUNNER: ${{ inputs.expected_runner }}
          RCC_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -u
          echo "RCC_RESERVATION_RELEASE_REQUIRED=TRUE reservation=$RCC_RESERVATION_ID runner=$RCC_EXPECTED_RUNNER"
          {
            echo "## RCC-reserved local deploy"
            echo ""
            echo "- reservation: \`$RCC_RESERVATION_ID\`"
            echo "- reserved runner: \`$RCC_EXPECTED_RUNNER\`"
            echo "- source: \`$RCC_SOURCE_SHA\`"
            echo "- compatibility fallback: \`unused\`"
            echo "- reservation release: \`RCC control plane required\`"
          } >> "$GITHUB_STEP_SUMMARY"
