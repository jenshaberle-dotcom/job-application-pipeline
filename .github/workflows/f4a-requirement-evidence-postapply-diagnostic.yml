name: F4A requirement evidence post-apply diagnostic

on:
  push:
    branches: [agent/f4a-operator-feedback-freeze-extension]
    paths:
      - ".github/workflows/f4a-requirement-evidence-postapply-diagnostic.yml"
  workflow_dispatch:

# Updating this workflow is also an intentional read-only diagnostic trigger path.
permissions:
  contents: read

concurrency:
  group: f4a-requirement-evidence-postapply-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    name: Diagnose residual F4A refresh drift
    runs-on: [self-hosted, Linux, X64, job-pipeline-runtime-linux]
    timeout-minutes: 15
    env:
      RCC_REPOSITORY_ID: "1230805345"
      RCC_REPOSITORY: jenshaberle-dotcom/job-application-pipeline
      RCC_RUNNER_NAME: job-pipeline-runtime-linux
      EXPECTED_COHORT_SIZE: "16"

    steps:
      - name: Check out exact diagnostic head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve verified RCC runtime context
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "F4A_Q_DIAGNOSTIC_HEAD=${GITHUB_SHA}"
          context_file="${RCC_RUNTIME_CONTEXT_FILE:-$HOME/.config/DeepOceanInfrastructure/RCC/runtime-contexts/${RCC_REPOSITORY_ID}-${RCC_RUNNER_NAME}.json}"
          test -f "$context_file"
          context_output="$(python3 - "$context_file" "$RCC_REPOSITORY_ID" "$RCC_REPOSITORY" "$RCC_RUNNER_NAME" <<'PY'
          import json
          import sys
          from pathlib import PurePosixPath

          path, repo_id, repository, runner = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              context = json.load(handle)
          if context.get("RepositoryId") != int(repo_id):
              raise SystemExit("RUNTIME_REPOSITORY_ID_MISMATCH")
          if context.get("Repository") != repository:
              raise SystemExit("RUNTIME_REPOSITORY_MISMATCH")
          if context.get("RunnerName") != runner:
              raise SystemExit("RUNTIME_RUNNER_MISMATCH")
          if context.get("Status") != "PASS" or context.get("PrimaryFailure") not in (None, ""):
              raise SystemExit("RUNTIME_CONTEXT_NOT_PASS")
          checkout = context.get("CheckoutRoot")
          interpreter = context.get("Interpreter")
          env_file = context.get("EnvFile")
          root = PurePosixPath(checkout)
          if root not in PurePosixPath(interpreter).parents or root not in PurePosixPath(env_file).parents:
              raise SystemExit("RUNTIME_CONTEXT_PATH_MISMATCH")
          print(interpreter)
          print(env_file)
          PY
          )"
          mapfile -t values <<< "$context_output"
          test "${#values[@]}" -eq 2
          printf 'RUNTIME_PYTHON=%s\n' "${values[0]}" >> "$GITHUB_ENV"
          printf 'RUNTIME_ENV_FILE=%s\n' "${values[1]}" >> "$GITHUB_ENV"

      - name: Load masked Product database environment
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" - "$RUNTIME_ENV_FILE" "$GITHUB_ENV" <<'PY'
          import secrets
          import sys
          from pathlib import Path
          from dotenv import dotenv_values

          values = dotenv_values(Path(sys.argv[1]))
          required = (
              "POSTGRES_HOST", "POSTGRES_PORT", "POSTGRES_DB",
              "POSTGRES_USER", "POSTGRES_PASSWORD",
          )
          missing = [key for key in required if values.get(key) in (None, "")]
          if missing:
              raise SystemExit("RUNTIME_ENV_POSTGRES_KEYS_MISSING:" + ",".join(missing))
          print(f"::add-mask::{values['POSTGRES_PASSWORD']}")
          with Path(sys.argv[2]).open("a", encoding="utf-8") as handle:
              for key in required:
                  value = str(values[key])
                  marker = f"JAP_ENV_{secrets.token_hex(12)}"
                  while marker in value:
                      marker = f"JAP_ENV_{secrets.token_hex(12)}"
                  handle.write(f"{key}<<{marker}\n{value}\n{marker}\n")
          PY

      - name: Build read-only post-apply plan and print exact residual diffs
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/f4a_requirement_evidence_postapply_diagnostic.json"
          "$RUNTIME_PYTHON" -m scripts.run_f4a_requirement_evidence_refresh --output "$output"
          "$RUNTIME_PYTHON" - "$output" "$EXPECTED_COHORT_SIZE" <<'PY'
          import json
          import sys

          path, expected = sys.argv[1], int(sys.argv[2])
          with open(path, encoding="utf-8") as handle:
              report = json.load(handle)
          print(f"F4A_Q_DIAGNOSTIC_CANDIDATES={report['candidate_count']}")
          print(f"F4A_Q_DIAGNOSTIC_PROPOSALS={report['proposal_count']}")
          print(f"F4A_Q_DIAGNOSTIC_BLOCKED={report['blocked_count']}")
          print(f"F4A_Q_DIAGNOSTIC_WOULD_CHANGE={report['would_change_count']}")
          if report["candidate_count"] != expected or report["proposal_count"] != expected:
              raise SystemExit("F4A_Q_DIAGNOSTIC_COHORT_DRIFT")
          if report["blocked_count"] != 0:
              raise SystemExit("F4A_Q_DIAGNOSTIC_BLOCKED")
          for proposal in report["proposals"]:
              if not proposal.get("would_change"):
                  continue
              print("F4A_Q_RESIDUAL=" + json.dumps({
                  "silver_job_id": proposal["silver_job_id"],
                  "source_name": proposal["source_name"],
                  "title": proposal["title"],
                  "revision_key": proposal["revision_key"],
                  "work_model_resolution": proposal["work_model_resolution"],
                  "changed_fields": proposal["changed_fields"],
                  "changes": {
                      field: {
                          "before": proposal["previous_payload"].get(field),
                          "after": proposal["next_payload"].get(field),
                      }
                      for field in proposal["changed_fields"]
                  },
              }, ensure_ascii=False, sort_keys=True))
          boundaries = report["boundaries"]
          if boundaries["database_writes"] is not False:
              raise SystemExit("F4A_Q_DIAGNOSTIC_WRITE_BOUNDARY_DRIFT")
          if boundaries["candidate_fact_reads"] is not False:
              raise SystemExit("F4A_Q_DIAGNOSTIC_CANDIDATE_FACT_BOUNDARY_DRIFT")
          if boundaries["provider_or_llm_requests"] != 0:
              raise SystemExit("F4A_Q_DIAGNOSTIC_PROVIDER_BOUNDARY_DRIFT")
          print("F4A_Q_POSTAPPLY_DIAGNOSTIC=PASS")
          PY
