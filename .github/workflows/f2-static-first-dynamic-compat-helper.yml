name: F2 one-shot static-first Dynamic-Origin compatibility

on:
  push:
    branches: [agent/f2-real-cohort]
    paths:
      - ".github/workflows/f2-static-first-dynamic-compat-helper.yml"

permissions:
  contents: write

jobs:
  qualify-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/f2-real-cohort
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Apply compatibility patch and qualify full suite
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_f2_static_first_dynamic_patch.py
          python -m ruff check src/connectors/employer_origin_acquisition_v4.py --select E4,E7,E9,F --ignore E402
          python -m pytest -q

      - name: Commit qualified product fix
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/_f2_static_first_dynamic_patch.py
          git add src/connectors/employer_origin_acquisition_v4.py
          git config user.name "jenshaberle-dotcom"
          git config user.email "jens.haberle@gmail.com"
          git commit -m "Preserve static acquisition boundaries under Dynamic-Origin"
          git push origin HEAD:agent/f2-real-cohort
