name: Freeze-II LinkedIn Indeed market sensors

on:
  workflow_dispatch:
    inputs:
      sensor_scope:
        description: "Bounded market sensor scope"
        required: true
        default: linkedin
        type: choice
        options:
          - linkedin
          - indeed
          - both
      search_backend:
        description: "Replaceable search backend; paid provider is never automatic"
        required: true
        default: none
        type: choice
        options:
          - none
          - tavily
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: freeze2-linkedin-indeed-market-sensors
  cancel-in-progress: false

jobs:
  probe:
    name: Conservative LinkedIn + Indeed discovery probe
    if: >-
      ${{ vars.RCC_JAP_BLUE_ASSIGNMENT_FROZEN != 'true' &&
          (
            (github.event_name == 'workflow_dispatch' &&
             github.ref == 'refs/heads/main') ||
            (github.event_name == 'issue_comment' &&
             github.event.issue.number == 1038 &&
             github.event.comment.user.login == 'jenshaberle-dotcom' &&
             github.event.comment.author_association == 'OWNER' &&
             startsWith(github.event.comment.body, '<!-- jap-freeze2-market-sensors:run:v1 -->'))
          ) }}
    runs-on: [self-hosted, Linux, X64, job-pipeline-runtime-linux]
    timeout-minutes: 30
    env:
      RCC_REPOSITORY_ID: "1230805345"
      RCC_REPOSITORY: jenshaberle-dotcom/job-application-pipeline
      RCC_RUNNER_NAME: job-pipeline-runtime-linux
      SENSOR_OUTPUT: /tmp/freeze2-linkedin-indeed-market-sensors.json
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      WORKFLOW_SENSOR_SCOPE: ${{ inputs.sensor_scope }}
      WORKFLOW_SEARCH_BACKEND: ${{ inputs.search_backend }}
      COMMENT_BODY: ${{ github.event.comment.body }}

    steps:
      - name: Check out exact main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve verified RCC runtime context
        shell: bash
        run: |
          set -euo pipefail
          context_file="${RCC_RUNTIME_CONTEXT_FILE:-$HOME/.config/DeepOceanInfrastructure/RCC/runtime-contexts/${RCC_REPOSITORY_ID}-${RCC_RUNNER_NAME}.json}"
          test -f "$context_file"
          context_output="$(python3 - "$context_file" "$RCC_REPOSITORY_ID" "$RCC_REPOSITORY" "$RCC_RUNNER_NAME" <<'PY'
          import json
          import sys
          from pathlib import PurePosixPath

          path, repo_id, repository, runner = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              context = json.load(handle)
          if context.get("RepositoryId") != int(repo_id):
              raise SystemExit("RUNTIME_REPOSITORY_ID_MISMATCH")
          if context.get("Repository") != repository:
              raise SystemExit("RUNTIME_REPOSITORY_MISMATCH")
          if context.get("RunnerName") != runner:
              raise SystemExit("RUNTIME_RUNNER_MISMATCH")
          if context.get("Platform") != "linux-wsl":
              raise SystemExit("RUNTIME_PLATFORM_MISMATCH")
          if context.get("Status") != "PASS" or context.get("PrimaryFailure") not in (None, ""):
              raise SystemExit("RUNTIME_CONTEXT_NOT_PASS")
          checks = {
              item.get("Id"): item.get("Status")
              for item in context.get("Checks", [])
              if isinstance(item, dict)
          }
          required = {
              "repository_identity",
              "checkout",
              "checkout_repository",
              "env_file",
              "env_keys",
              "interpreter",
              "interpreter_probe",
              "capability:postgresql",
          }
          failed = sorted(key for key in required if checks.get(key) != "PASS")
          if failed:
              raise SystemExit("RUNTIME_CHECKS_NOT_PASS:" + ",".join(failed))
          checkout = context.get("CheckoutRoot")
          interpreter = context.get("Interpreter")
          env_file = context.get("EnvFile")
          root = PurePosixPath(checkout)
          if root not in PurePosixPath(interpreter).parents:
              raise SystemExit("INTERPRETER_OUTSIDE_CHECKOUT")
          if root not in PurePosixPath(env_file).parents:
              raise SystemExit("ENV_OUTSIDE_CHECKOUT")
          print(interpreter)
          print(env_file)
          PY
          )"
          mapfile -t values <<< "$context_output"
          test "${#values[@]}" -eq 2
          printf 'RUNTIME_PYTHON=%s\n' "${values[0]}" >> "$GITHUB_ENV"
          printf 'RUNTIME_ENV_FILE=%s\n' "${values[1]}" >> "$GITHUB_ENV"

      - name: Resolve minimum requested sensor scope
        shell: bash
        run: |
          set -euo pipefail
          scope="${WORKFLOW_SENSOR_SCOPE:-}"
          if [[ -z "$scope" && "${COMMENT_BODY:-}" =~ sensor=(linkedin|indeed|both) ]]; then
            scope="${BASH_REMATCH[1]}"
          fi
          if [[ -z "$scope" ]]; then
            scope="linkedin"
          fi
          case "$scope" in
            linkedin|indeed|both) ;;
            *)
              echo "Unsupported sensor scope: $scope" >&2
              exit 2
              ;;
          esac
          echo "SENSOR_SCOPE=$scope" >> "$GITHUB_ENV"
          echo "SENSOR_SCOPE=$scope"

      - name: Resolve replaceable search backend
        shell: bash
        run: |
          set -euo pipefail
          backend="${WORKFLOW_SEARCH_BACKEND:-}"
          if [[ -z "$backend" && "${COMMENT_BODY:-}" =~ backend=(tavily|none) ]]; then
            backend="${BASH_REMATCH[1]}"
          fi
          if [[ -z "$backend" ]]; then
            backend="none"
          fi
          case "$backend" in
            tavily|none) ;;
            *)
              echo "Unsupported search backend: $backend" >&2
              exit 2
              ;;
          esac
          echo "SEARCH_BACKEND=$backend" >> "$GITHUB_ENV"
          echo "SEARCH_BACKEND=$backend"

      - name: Qualify sensor contracts
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" -m pytest -q             tests/test_conservative_market_sensors.py             tests/test_public_web_search.py             tests/test_silver_transformer_canonicalization.py
          "$RUNTIME_PYTHON" -m ruff check             src/search_intelligence/conservative_market_sensors.py             src/search_intelligence/public_web_search.py             scripts/run_freeze2_linkedin_indeed_market_sensors.py             tests/test_conservative_market_sensors.py             tests/test_public_web_search.py

      - name: Run conservative sensor proof
        shell: bash
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1090
          source "$RUNTIME_ENV_FILE"
          set +a
          export PGOPTIONS="-c default_transaction_read_only=on"
          sensor_args=()
          case "$SENSOR_SCOPE" in
            linkedin) sensor_args+=(--sensor linkedin) ;;
            indeed) sensor_args+=(--sensor indeed) ;;
            both) sensor_args+=(--sensor linkedin --sensor indeed) ;;
          esac
          "$RUNTIME_PYTHON" -m scripts.run_freeze2_linkedin_indeed_market_sensors             --provider "$SEARCH_BACKEND"             "${sensor_args[@]}"             --max-terms 3             --max-locations 2             --max-results 5             --output "$SENSOR_OUTPUT"

      - name: Upload bounded sensor evidence
        uses: actions/upload-artifact@v4
        with:
          name: freeze2-linkedin-indeed-market-sensors-${{ github.run_id }}
          path: ${{ env.SENSOR_OUTPUT }}
          if-no-files-found: error
          retention-days: 3

      - name: Publish aggregate sensor proof to Freeze-II issue
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" - "$SENSOR_OUTPUT" <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.request

          report = json.loads(Path(os.environ["SENSOR_OUTPUT"]).read_text(encoding="utf-8"))
          lines = [
              "<!-- jap-freeze2-market-sensors:v1 -->",
              "## Freeze-II — conservative market sensor proof",
              "",
              f"- source SHA: `{os.environ['SOURCE_SHA']}`",
              f"- workflow: https://github.com/{os.environ['REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}",
              f"- provider: `{report['provider']}`",
              f"- provider available: **{report['provider_available']}**",
              f"- paid external tool: **{report['provider_policy']['paid_external_tool']}**",
              f"- automatic paid fallback: **{report['provider_policy']['automatic_fallback_allowed']}**",
              f"- intent terms: `{json.dumps(report['intent']['search_terms'], ensure_ascii=False)}`",
              f"- intent locations: `{json.dumps(report['intent']['location_signals'], ensure_ascii=False)}`",
          ]
          for sensor, payload in report["sensors"].items():
              lines.append(
                  f"- {sensor}: status **{payload['status']}**, "
                  f"queries {payload['query_count']}, "
                  f"provider requests {payload['provider_request_count']}, "
                  f"accepted observations {payload['accepted_observation_count']}, "
                  f"rejected results {payload['rejected_provider_result_count']}, "
                  f"result shapes {json.dumps(payload['result_shape_counts'], sort_keys=True)}, "
                  f"transport links {json.dumps(payload['transport_link_kind_counts'], sort_keys=True)}"
              )
          lines.extend(
              [
                  f"- total provider requests: **{report['summary']['provider_request_count']}**",
                  f"- total accepted observations: **{report['summary']['accepted_observation_count']}**",
                  "",
                  "Boundary: discovery-only; replaceable search backend; zero-cost/no-key backend is default; paid backend is explicit only and never automatic; no direct LinkedIn/Indeed HTTP, no login/browser/Voyager/guest-API/CAPTCHA/proxy automation; platform URL/title/snippet persistence 0; DB/Bronze/Silver/Product writes 0.",
              ]
          )
          body = "\n".join(lines)
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(body + "\n", encoding="utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/1038/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "JAP-Freeze-II-Market-Sensors",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 201:
                  raise SystemExit(f"ISSUE_COMMENT_HTTP_{response.status}")
          PY
