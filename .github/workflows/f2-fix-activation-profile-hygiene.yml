name: F2 one-shot activation profile hygiene fix

on:
  push:
    branches: [agent/f2-real-cohort]
    paths:
      - ".github/workflows/f2-fix-activation-profile-hygiene.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/f2-real-cohort
          fetch-depth: 1

      - name: Patch generic execution profile projection hygiene
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply_generic_employer_origin_activation.py")
          text = path.read_text(encoding="utf-8")
          marker = "        # A candidate that previously carried controlled-active state from a legacy\n"
          guard = "        # The generic execution surface is also a complete materialized projection.\n"
          if guard not in text:
              if text.count(marker) != 1:
                  raise SystemExit("ACTIVATION_PROFILE_HYGIENE_MARKER_NOT_UNIQUE")
              lines = [
                  "        # The generic execution surface is also a complete materialized projection.",
                  "        # Retire every prior generic profile before re-enabling exactly one canonical",
                  "        # profile per current proof-PASS source below. This removes stale aliases and",
                  "        # duplicate active profiles without changing proof authority.",
                  "        cur.execute(",
                  "            \"\"\"",
                  "            UPDATE search_profiles",
                  "            SET is_active = FALSE,",
                  "                recurring_ingestion_enabled = FALSE",
                  "            WHERE source_name LIKE %s",
                  "            \"\"\",",
                  "            (f\"{GENERIC_SOURCE_PREFIX}%\",),",
                  "        )",
                  "",
              ]
              path.write_text(text.replace(marker, "\n".join(lines) + "\n" + marker, 1), encoding="utf-8")
              print("ACTIVATION_PROFILE_HYGIENE=PATCHED")
          else:
              print("ACTIVATION_PROFILE_HYGIENE=ALREADY_PATCHED")
          PY
          python3 -m py_compile scripts/apply_generic_employer_origin_activation.py
          grep -Fq 'WHERE source_name LIKE %s' scripts/apply_generic_employer_origin_activation.py

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git add scripts/apply_generic_employer_origin_activation.py
          if git diff --cached --quiet; then
            echo "ACTIVATION_PROFILE_HYGIENE_COMMIT=NOOP"
            exit 0
          fi
          git config user.name "jenshaberle-dotcom"
          git config user.email "jens.haberle@gmail.com"
          git commit -m "Fix generic activation profile projection hygiene"
          git push origin HEAD:agent/f2-real-cohort
