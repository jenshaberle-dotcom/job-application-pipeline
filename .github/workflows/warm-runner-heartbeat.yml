name: Warm runner heartbeat compatibility telemetry

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telemetry-only:
    name: Emit non-authoritative compatibility telemetry
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Emit boundary evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "WARM_HEARTBEAT=COMPAT_TELEMETRY_ONLY"
          echo "HEARTBEAT_CAPACITY_AUTHORITY=NONE"
          echo "PHYSICAL_ACCEPTANCE_AUTHORITY=false"
          echo "SELF_HOSTED_SLOT_CONSUMPTION=NONE"
