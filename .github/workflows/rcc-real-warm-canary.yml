name: RCC real warm canary
run-name: RCC real warm canary ${{ inputs.reservation_id }}

on:
  workflow_dispatch:
    inputs:
      reservation_id:
        description: Exact RCC reservation id returned by the out-of-band admission plane
        required: true
        type: string
      physical_runner:
        description: Neutral RCC physical host identity
        required: true
        default: rcc-general-linux-01
        type: string
      facade_runner:
        description: Exact repository-visible JAP facade runner name
        required: true
        default: rcc-general-linux-01--jap
        type: string
      runs_on_json:
        description: Exact RCC pre-assignment runs-on selector returned by admission
        required: true
        default: '["self-hosted","rcc-general-linux-01--jap"]'
        type: string
      source_sha:
        description: Exact JAP commit SHA to execute
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rcc-real-warm-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Real JAP shared warm workload
    runs-on: ${{ fromJSON(inputs.runs_on_json) }}
    timeout-minutes: 30
    env:
      RCC_EXPECTED_PROFILE_HASH: 62dda18c8360e15ae054cdb4e0420effcca26a04a7f6ac751a9332fd966001e7
      RCC_EXPECTED_PYTHON: 3.12.14
      RCC_RESERVATION_ID: ${{ inputs.reservation_id }}
      RCC_PHYSICAL_RUNNER: ${{ inputs.physical_runner }}
      RCC_FACADE_RUNNER: ${{ inputs.facade_runner }}
      RCC_SOURCE_SHA: ${{ inputs.source_sha }}

    steps:
      - name: Start measured canary and prove exact pre-assignment handoff
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          started="$(date +%s%3N)"
          printf 'RCC_CANARY_STARTED_MS=%s\n' "$started" >> "$GITHUB_ENV"
          test -n "$RCC_RESERVATION_ID"
          [[ "$RCC_PHYSICAL_RUNNER" =~ ^rcc-general-linux-0[1-5]$ ]]
          test "$RUNNER_NAME" = "$RCC_FACADE_RUNNER"
          test "$RCC_FACADE_RUNNER" = "$RCC_PHYSICAL_RUNNER--jap"
          echo "RCC_EXACT_RUNNER_HANDOFF=PASS physical=$RCC_PHYSICAL_RUNNER facade=$RUNNER_NAME reservation=$RCC_RESERVATION_ID"

      - name: Materialize ephemeral exact source
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          [[ "$RCC_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

          # The Actions workspace is not source authority on shared capacity.
          rm -rf -- "$GITHUB_WORKSPACE"
          mkdir -p -- "$GITHUB_WORKSPACE"
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit)"

          source_root="$RUNNER_TEMP/jap-golden-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "$source_root"
          git init -q "$source_root"
          git -C "$source_root" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$source_root" fetch --no-tags --depth=1 origin "$RCC_SOURCE_SHA"
          git -C "$source_root" checkout -q --detach FETCH_HEAD
          actual="$(git -C "$source_root" rev-parse HEAD)"
          test "$actual" = "$RCC_SOURCE_SHA"
          test -z "$(git -C "$source_root" status --porcelain --untracked-files=all)"
          printf 'JAP_SOURCE=%s\n' "$source_root" >> "$GITHUB_ENV"
          echo "JAP_EPHEMERAL_SOURCE=PASS source=$actual path=$source_root"
          echo "JAP_PERSISTENT_PROJECT_WORKSPACE=NONE"

      - name: Bind qualified persistent RCC Python
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          root="$HOME/.cache/DeepOceanInfrastructure/RunnerToolchain/PythonEnvs/job-pipeline-runtime-linux-warm"
          active_python_file="$root/active-python.txt"
          active_hash_file="$root/active-profile-hash.txt"
          test -s "$active_python_file"
          test -s "$active_hash_file"
          python_path="$(tr -d '\r\n' < "$active_python_file")"
          profile_hash="$(tr -d '\r\n' < "$active_hash_file")"
          test "$profile_hash" = "$RCC_EXPECTED_PROFILE_HASH"
          test -x "$python_path"
          actual_version="$($python_path -c 'import platform; print(platform.python_version())')"
          test "$actual_version" = "$RCC_EXPECTED_PYTHON"
          "$python_path" -m pip check
          printf 'RCC_CANARY_PYTHON=%s\n' "$python_path" >> "$GITHUB_ENV"
          echo "RCC_PERSISTENT_ENVIRONMENT=PASS python=$actual_version profile_hash=$profile_hash"
          echo "RCC_SETUP_PYTHON=NONE"
          echo "RCC_PIP_INSTALL=NONE"
          echo "RCC_REMOTE_PIP_CACHE_RESTORE=NONE"

      - name: Bind pre-provisioned persistent JAP local OSS overlay
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          cd "$JAP_SOURCE"
          mapfile -t specs < <(
            "$RCC_CANARY_PYTHON" - requirements.txt <<'PY'
          from pathlib import Path
          import sys

          required = ("extruct", "trafilatura")
          found = {}
          for raw in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              for name in required:
                  if line.lower().startswith(name + "=="):
                      if name in found:
                          raise SystemExit(f"duplicate pinned requirement for {name}")
                      found[name] = line
          missing = [name for name in required if name not in found]
          if missing:
              raise SystemExit("missing exact pinned local OSS requirements: " + ",".join(missing))
          for name in required:
              print(found[name])
          PY
          )
          test "${#specs[@]}" -eq 2
          digest="$(printf '%s\n' "${specs[@]}" | sha256sum | awk '{print $1}')"
          site="$HOME/.cache/DeepOceanInfrastructure/JobApplicationPipeline/LocalOss/$digest"
          test -d "$site"
          PYTHONPATH="$site${PYTHONPATH:+:$PYTHONPATH}" "$RCC_CANARY_PYTHON" - <<'PY'
          import extruct
          import trafilatura
          assert extruct is not None
          assert trafilatura is not None
          PY
          printf 'PYTHONPATH=%s:%s\n' "$site" "${PYTHONPATH:-}" >> "$GITHUB_ENV"
          echo "JAP_PERSISTENT_LOCAL_OSS=PASS digest=$digest site=$site"
          echo "JAP_LOCAL_OSS_INSTALL_DURING_CANARY=NONE"

      - name: Compile active Python paths
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          cd "$JAP_SOURCE"
          "$RCC_CANARY_PYTHON" -m compileall -q src scripts tests

      - name: Validate migration tooling and governance contracts
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          cd "$JAP_SOURCE"
          "$RCC_CANARY_PYTHON" scripts/validate_ci_contract.py

      - name: Run hard Ruff correctness gate
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          cd "$JAP_SOURCE"
          "$RCC_CANARY_PYTHON" -m ruff check . --select E4,E7,E9,F --ignore E402

      - name: Run full test suite
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          cd "$JAP_SOURCE"
          "$RCC_CANARY_PYTHON" -m pytest -q

      - name: Delete ephemeral source before reservation release
        if: always()
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          if [[ -n "${JAP_SOURCE:-}" ]]; then
            rm -rf -- "$JAP_SOURCE"
            test ! -e "$JAP_SOURCE"
          fi
          rm -rf -- "$GITHUB_WORKSPACE"
          mkdir -p -- "$GITHUB_WORKSPACE"
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit)"
          echo "JAP_EPHEMERAL_SOURCE_CLEANUP=PASS"
          echo "JAP_WORKLOAD_RESIDUE=NONE"

      - name: Record measured shared warm-canary outcome
        if: always()
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          ended="$(date +%s%3N)"
          elapsed="$((ended - RCC_CANARY_STARTED_MS))"
          {
            echo "## RCC real JAP shared warm canary"
            echo ""
            echo "- physical runner: \`$RCC_PHYSICAL_RUNNER\`"
            echo "- repository facade: \`$RUNNER_NAME\`"
            echo "- reservation: \`$RCC_RESERVATION_ID\`"
            echo "- exact source: \`$RCC_SOURCE_SHA\`"
            echo "- source workspace: \`EPHEMERAL_EXACT_SOURCE_DELETE_ALWAYS\`"
            echo "- Python: \`$RCC_EXPECTED_PYTHON\`"
            echo "- setup-python: \`NONE\`"
            echo "- pip install: \`NONE\`"
            echo "- local OSS install during canary: \`NONE\`"
            echo "- remote pip cache restore: \`NONE\`"
            echo "- measured job body: \`${elapsed} ms\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "RCC_REAL_SHARED_WARM_CANARY_MEASURED_MS=$elapsed"
