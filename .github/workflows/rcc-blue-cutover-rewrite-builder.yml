name: RCC Blue cutover branch rewrite builder

on:
  push:
    branches:
      - agent/352-jap-blue-bypass-cutover-readiness-v1
    paths:
      - .github/workflows/rcc-blue-cutover-rewrite-builder.yml

permissions:
  contents: write

concurrency:
  group: rcc-blue-cutover-rewrite-builder
  cancel-in-progress: false

jobs:
  rewrite:
    name: Apply bounded repository-only Blue freeze guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/352-jap-blue-bypass-cutover-readiness-v1
          fetch-depth: 0

      - name: Apply exact bounded rewrites
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"RCC_BLUE_REWRITE_EXPECTED_ONCE:{path}:count={count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          blue = "    runs-on: [self-hosted, Linux, X64, job-pipeline-runtime-linux]\n"
          guarded_blue = (
              "    if: ${{ vars.RCC_JAP_BLUE_ASSIGNMENT_FROZEN != 'true' }}\n"
              + blue
          )
          replace_once(
              ".github/workflows/p1-generic-origin-product-activate.yml",
              blue,
              guarded_blue,
          )

          replace_once(
              ".github/workflows/trusted-local-product-campaign.yml",
              "    if: needs.admission.outputs.admitted == 'true'\n",
              "    if: needs.admission.outputs.admitted == 'true' && vars.RCC_JAP_BLUE_ASSIGNMENT_FROZEN != 'true'\n",
          )

          replace_once(
              ".github/workflows/jap-windows-control-center-local-deploy.yml",
              "    if: >-\n      github.event_name != 'workflow_run' ||\n      github.event.workflow_run.conclusion == 'success'\n",
              "    if: >-\n      vars.RCC_JAP_BLUE_ASSIGNMENT_FROZEN != 'true' &&\n      (github.event_name != 'workflow_run' ||\n       github.event.workflow_run.conclusion == 'success')\n",
          )

          replace_once(
              ".github/workflows/ci.yml",
              "      warm_runs_on_json: '[\"self-hosted\",\"Linux\",\"X64\",\"job-pipeline-runtime-linux\"]'\n",
              "      warm_runs_on_json: '[\"self-hosted\",\"rcc-general-linux-01--jap\"]'\n",
          )

          print("RCC_BLUE_CUTOVER_REWRITE=PASS_REPO_ONLY")

      - name: Commit bounded rewrite if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            .github/workflows/p1-generic-origin-product-activate.yml \
            .github/workflows/trusted-local-product-campaign.yml \
            .github/workflows/jap-windows-control-center-local-deploy.yml \
            .github/workflows/ci.yml; then
            echo "RCC_BLUE_CUTOVER_REWRITE_COMMIT=ALREADY_APPLIED"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/p1-generic-origin-product-activate.yml \
            .github/workflows/trusted-local-product-campaign.yml \
            .github/workflows/jap-windows-control-center-local-deploy.yml \
            .github/workflows/ci.yml
          git commit -m 'JAP RCC #352: gate remaining Blue assignments'
          git push origin HEAD:agent/352-jap-blue-bypass-cutover-readiness-v1
          echo "RCC_BLUE_CUTOVER_REWRITE_COMMIT=PASS"
