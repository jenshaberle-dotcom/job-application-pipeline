name: Freeze-II pre-candidate origin resolution

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: freeze2-pre-candidate-origin-resolution
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve reviewed sensor companies to direct origin evidence
    if: >-
      ${{ github.event.issue.number == 1038 &&
          github.event.comment.user.login == 'jenshaberle-dotcom' &&
          github.event.comment.author_association == 'OWNER' &&
          startsWith(github.event.comment.body, '<!-- jap-freeze2-pre-candidate-origin:run:v1 -->') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REVIEW_DIR: /tmp/freeze2-s06-review
      OUTPUT: /tmp/freeze2-pre-candidate-origin-resolution.json
      COMMENT_BODY: ${{ github.event.comment.body }}

    steps:
      - name: Check out exact main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve S0.6 review run id
        id: review
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$COMMENT_BODY" =~ review_run_id=([0-9]+) ]]; then
            run_id="${BASH_REMATCH[1]}"
          else
            echo "Missing review_run_id=<numeric GitHub Actions run id>" >&2
            exit 2
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download S0.6 review artifact
        uses: actions/download-artifact@v4
        with:
          name: freeze2-sensor-candidate-expansion-review-${{ steps.review.outputs.run_id }}
          path: ${{ env.REVIEW_DIR }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.review.outputs.run_id }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Qualify pre-candidate origin contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_freeze2_pre_candidate_origin_resolution.py             tests/test_origin_source_discovery_agent.py             tests/test_eo002d_origin_source_discovery_repair.py
          python -m ruff check             scripts/run_freeze2_pre_candidate_origin_resolution.py             tests/test_freeze2_pre_candidate_origin_resolution.py

      - name: Run provider-free pre-candidate origin resolution
        shell: bash
        run: |
          set -euo pipefail
          review_json="$REVIEW_DIR/freeze2-sensor-candidate-expansion-review.json"
          test -f "$review_json"
          python -m scripts.run_freeze2_pre_candidate_origin_resolution             --review-json "$review_json"             --output "$OUTPUT"             --target-location Hannover             --timeout-seconds 6             --http-request-cap 24             --max-generated-candidates 18             --wikidata-max-entities 3

      - name: Upload direct-origin evidence
        uses: actions/upload-artifact@v4
        with:
          name: freeze2-pre-candidate-origin-resolution-${{ github.run_id }}
          path: ${{ env.OUTPUT }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish result to Freeze-II issue
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          REVIEW_SOURCE_RUN_ID: ${{ steps.review.outputs.run_id }}
        run: |
          set -euo pipefail
          python - "$OUTPUT" <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.request

          report = json.loads(Path(os.environ["OUTPUT"]).read_text(encoding="utf-8"))
          summary = report["summary"]
          lines = [
              "<!-- jap-freeze2-pre-candidate-origin:v1 -->",
              "## Freeze-II — pre-candidate direct-origin resolution",
              "",
              f"- source SHA: `{os.environ['SOURCE_SHA']}`",
              f"- workflow: https://github.com/{os.environ['REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}",
              f"- reused S0.6 review run: `{os.environ['REVIEW_SOURCE_RUN_ID']}`",
              f"- reviewed new companies: **{summary['company_count']}**",
              f"- direct source resolved: **{summary['direct_source_resolved']}**",
              f"- direct source review required: **{summary['direct_source_review_required']}**",
              f"- direct source unresolved: **{summary['direct_source_unresolved']}**",
              f"- bounded direct HTTP requests: **{summary['total_direct_http_requests']}**",
              "- search-provider requests: **0**",
              "",
              "Companies:",
          ]
          for item in report["results"]:
              lines.append(
                  f"- `{item['company_key']}` — {item['company_name']} — "
                  f"**{item['resolution_state']}** — "
                  f"`{item.get('selected_url') or '-'}` — "
                  f"decision `{item['origin_decision']}` — "
                  f"ATS `{','.join(item.get('ats_families') or []) or '-'}`"
              )
          lines.extend(
              [
                  "",
                  "Boundary: S0.6 artifact only; DB reads/writes 0; search-provider requests 0; "
                  "candidate creation 0; candidate_url writes 0; connector registration/source activation 0.",
              ]
          )
          body = "\n".join(lines)
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(body + "\n", encoding="utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/1038/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "JAP-Freeze-II-Pre-Candidate-Origin",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 201:
                  raise SystemExit(f"ISSUE_COMMENT_HTTP_{response.status}")
          PY
