name: F2 real company cohort

on:
  push:
    branches: [agent/f2-real-cohort]
    paths:
      - ".github/workflows/f2-real-company-cohort.yml"

permissions:
  contents: read

concurrency:
  group: f2-real-company-cohort
  cancel-in-progress: false

jobs:
  cohort:
    name: Persist, prove, activate and ingest fresh Employer-Origin cohort
    runs-on: [self-hosted, Linux, X64, job-pipeline-runtime-linux]
    timeout-minutes: 180
    env:
      RCC_REPOSITORY_ID: "1230805345"
      RCC_REPOSITORY: jenshaberle-dotcom/job-application-pipeline
      RCC_RUNNER_NAME: job-pipeline-runtime-linux
      COHORT_KEYS: /tmp/jap-f2-real-cohort-keys.txt
      COHORT_OUTPUT: /tmp/jap-f2-real-cohort
      PRODUCT_OUTPUT: /tmp/jap-f2-real-cohort-product.json

    steps:
      - name: Check out exact cohort head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "F2_COHORT_SOURCE=$GITHUB_SHA"

      - name: Resolve verified RCC runtime context
        shell: bash
        run: |
          set -euo pipefail
          context_file="${RCC_RUNTIME_CONTEXT_FILE:-$HOME/.config/DeepOceanInfrastructure/RCC/runtime-contexts/${RCC_REPOSITORY_ID}-${RCC_RUNNER_NAME}.json}"
          test -f "$context_file"
          context_output="$(python3 - "$context_file" "$RCC_REPOSITORY_ID" "$RCC_REPOSITORY" "$RCC_RUNNER_NAME" <<'PY'
          import json
          import sys
          from pathlib import PurePosixPath

          path, repo_id, repository, runner = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              context = json.load(handle)
          if context.get("RepositoryId") != int(repo_id):
              raise SystemExit("RUNTIME_REPOSITORY_ID_MISMATCH")
          if context.get("Repository") != repository:
              raise SystemExit("RUNTIME_REPOSITORY_MISMATCH")
          if context.get("RunnerName") != runner:
              raise SystemExit("RUNTIME_RUNNER_MISMATCH")
          if context.get("Platform") != "linux-wsl":
              raise SystemExit("RUNTIME_PLATFORM_MISMATCH")
          if context.get("Status") != "PASS" or context.get("PrimaryFailure") not in (None, ""):
              raise SystemExit("RUNTIME_CONTEXT_NOT_PASS")
          checks = {
              item.get("Id"): item.get("Status")
              for item in context.get("Checks", [])
              if isinstance(item, dict)
          }
          required = {
              "repository_identity", "checkout", "checkout_repository",
              "env_file", "env_keys", "interpreter", "interpreter_probe",
              "capability:postgresql",
          }
          failed = sorted(key for key in required if checks.get(key) != "PASS")
          if failed:
              raise SystemExit("RUNTIME_CHECKS_NOT_PASS:" + ",".join(failed))
          checkout = context.get("CheckoutRoot")
          interpreter = context.get("Interpreter")
          env_file = context.get("EnvFile")
          root = PurePosixPath(checkout)
          if root not in PurePosixPath(interpreter).parents:
              raise SystemExit("INTERPRETER_OUTSIDE_CHECKOUT")
          if root not in PurePosixPath(env_file).parents:
              raise SystemExit("ENV_OUTSIDE_CHECKOUT")
          print(interpreter)
          print(env_file)
          PY
          )"
          mapfile -t values <<< "$context_output"
          test "${#values[@]}" -eq 2
          printf 'RUNTIME_PYTHON=%s\n' "${values[0]}" >> "$GITHUB_ENV"
          printf 'RUNTIME_ENV_FILE=%s\n' "${values[1]}" >> "$GITHUB_ENV"

      - name: Load product database environment
        shell: bash
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1090
          source "$RUNTIME_ENV_FILE"
          set +a
          env | grep '^POSTGRES_' | sed 's/=.*$/=<set>/'

      - name: Provision pinned local OSS detail runtime
        shell: bash
        run: |
          set -euo pipefail
          local_oss_site="$(bash scripts/ensure_pinned_local_oss_runtime.sh \
            "$RUNTIME_PYTHON" requirements.txt "$RUNNER_TEMP/jap-f2-cohort-local-oss-sites")"
          test -d "$local_oss_site"
          printf 'PYTHONPATH=%s:%s\n' "$local_oss_site" "${PYTHONPATH:-}" >> "$GITHUB_ENV"

      - name: Select 12 genuinely inactive unresolved companies
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$COHORT_KEYS"
          "$RUNTIME_PYTHON" - "$COHORT_KEYS" <<'PY'
          import os
          import sys
          import psycopg
          from psycopg.rows import dict_row

          out = sys.argv[1]
          conn = psycopg.connect(
              host=os.getenv("POSTGRES_HOST", "localhost"),
              port=int(os.getenv("POSTGRES_PORT", "5432")),
              dbname=os.getenv("POSTGRES_DB", "job_pipeline"),
              user=os.getenv("POSTGRES_USER", "job_user"),
              password=os.getenv("POSTGRES_PASSWORD", "job_password"),
              row_factory=dict_row,
          )
          with conn, conn.cursor() as cur:
              cur.execute("""
                  WITH latest AS (
                      SELECT DISTINCT ON (company_key)
                          id, company_key, company_name, status, candidate_url, updated_at
                      FROM employer_origin_source_candidates
                      WHERE company_key IS NOT NULL
                        AND btrim(company_key) <> ''
                      ORDER BY company_key, updated_at DESC NULLS LAST, id DESC
                  )
                  SELECT id, company_key, company_name, status
                  FROM latest c
                  WHERE coalesce(c.status, '') <> 'active_controlled'
                    AND coalesce(btrim(c.candidate_url), '') = ''
                    AND NOT EXISTS (
                        SELECT 1
                        FROM search_profiles sp
                        WHERE sp.source_name = 'generic_origin:' || c.company_key
                          AND sp.is_active = TRUE
                    )
                  ORDER BY c.updated_at DESC NULLS LAST, c.id DESC
                  LIMIT 12
              """)
              rows = list(cur.fetchall())
          if len(rows) < 10:
              raise SystemExit(f"F2_REAL_COHORT_TOO_SMALL={len(rows)}")
          with open(out, "w", encoding="utf-8") as handle:
              for row in rows:
                  handle.write(str(row["company_key"]) + "\n")
          print(f"F2_REAL_COHORT_COMPANIES={len(rows)}")
          for row in rows:
              print(f"F2_REAL_COMPANY={row['id']}|{row['company_key']}|{row['company_name']}|{row['status']}")
          PY

      - name: Bridge F1 discovery into canonical candidate URL persistence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$COHORT_OUTPUT"
          mapfile -t keys < "$COHORT_KEYS"
          args=()
          for key in "${keys[@]}"; do
            args+=(--company-key "$key")
          done
          "$RUNTIME_PYTHON" -m scripts.run_f1_origin_persistence_bridge \
            "${args[@]}" \
            --apply \
            --approval-token approve_product_e2e_origin_url_persistence \
            --reviewed-by "f2-real-cohort-${GITHUB_RUN_ID}" \
            --official-domain-provider wikidata \
            --search-provider none \
            --http-request-cap 24 \
            --max-candidates 20 \
            --timeout-seconds 8 \
            --output-dir "$COHORT_OUTPUT"

      - name: Verify bridge produced real new persistence evidence
        shell: bash
        run: |
          set -euo pipefail
          report="$(find "$COHORT_OUTPUT" -name result.json -type f | sort | tail -n1)"
          test -n "$report"
          cp "$report" /tmp/jap-f2-real-cohort-result.json
          "$RUNTIME_PYTHON" - "$report" <<'PY'
          import json
          import sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          summary = payload["summary"]
          print(f"F2_F1_SELECTED={summary['f1_selected_count']}")
          print(f"F2_PERSISTED_OR_READY={summary['persisted_or_ready_count']}")
          print(f"F2_BRIDGE_STATUS_COUNTS={summary['status_counts']}")
          if int(summary["f1_selected_count"]) < 1:
              raise SystemExit("F2_F1_SELECTED_EMPTY")
          if int(summary["persisted_or_ready_count"]) < 1:
              raise SystemExit("F2_F1_PERSISTENCE_EMPTY")
          PY

      - name: Recompute strict generic Employer-Origin proof
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" -m scripts.run_generic_employer_origin_product --output "$PRODUCT_OUTPUT"
          "$RUNTIME_PYTHON" -m scripts.qualify_generic_employer_origin_connectors --proof-json "$PRODUCT_OUTPUT"
          "$RUNTIME_PYTHON" -m scripts.apply_generic_employer_origin_activation --proof-json "$PRODUCT_OUTPUT"

      - name: Apply exact proof-pass activation
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" -m scripts.apply_generic_employer_origin_activation \
            --proof-json "$PRODUCT_OUTPUT" \
            --apply

      - name: Run recurring generic-origin ingestion and Silver
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" -m src.ingest_jobs --source generic_origin --log-level INFO
          "$RUNTIME_PYTHON" -m src.run_silver_jobs

      - name: Measure exact cohort funnel from live DB truth
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" - "$COHORT_KEYS" <<'PY'
          import os
          import sys
          import psycopg
          from psycopg.rows import dict_row

          keys = [line.strip() for line in open(sys.argv[1], encoding="utf-8") if line.strip()]
          sources = [f"generic_origin:{key}" for key in keys]
          conn = psycopg.connect(
              host=os.getenv("POSTGRES_HOST", "localhost"),
              port=int(os.getenv("POSTGRES_PORT", "5432")),
              dbname=os.getenv("POSTGRES_DB", "job_pipeline"),
              user=os.getenv("POSTGRES_USER", "job_user"),
              password=os.getenv("POSTGRES_PASSWORD", "job_password"),
              row_factory=dict_row,
          )
          with conn, conn.cursor() as cur:
              cur.execute("""
                  SELECT DISTINCT ON (company_key) company_key, candidate_url
                  FROM employer_origin_source_candidates
                  WHERE company_key = ANY(%s)
                  ORDER BY company_key, updated_at DESC NULLS LAST, id DESC
              """, (keys,))
              candidate_rows = list(cur.fetchall())
              cur.execute("""
                  SELECT source_name
                  FROM search_profiles
                  WHERE source_name = ANY(%s)
                    AND is_active = TRUE
                    AND recurring_ingestion_enabled = TRUE
              """, (sources,))
              active = {str(row["source_name"]) for row in cur.fetchall()}
              cur.execute("""
                  SELECT DISTINCT ON (source_name)
                      source_name, status, total_loaded, inserted_count
                  FROM ingestion_runs
                  WHERE source_name = ANY(%s)
                  ORDER BY source_name, started_at DESC, id DESC
              """, (sources,))
              runs = {str(row["source_name"]): row for row in cur.fetchall()}
              cur.execute("""
                  SELECT source_name, count(*) AS n
                  FROM raw_jobs
                  WHERE source_name = ANY(%s)
                  GROUP BY source_name
              """, (sources,))
              bronze = {str(row["source_name"]): int(row["n"]) for row in cur.fetchall()}
              cur.execute("""
                  SELECT source_name, count(*) AS n
                  FROM silver_jobs
                  WHERE source_name = ANY(%s)
                  GROUP BY source_name
              """, (sources,))
              silver = {str(row["source_name"]): int(row["n"]) for row in cur.fetchall()}

          persisted = {str(row["company_key"]) for row in candidate_rows if row["candidate_url"]}
          successful_runs = {name for name, row in runs.items() if row["status"] == "success"}
          delivering = {name for name, row in runs.items() if row["status"] == "success" and int(row["total_loaded"] or 0) > 0}
          print(f"F2_FUNNEL_COMPANIES={len(keys)}")
          print(f"F2_FUNNEL_PERSISTED_ORIGIN_URL={len(persisted)}")
          print(f"F2_FUNNEL_ACTIVE_PROOF_PASS={len(active)}")
          print(f"F2_FUNNEL_SUCCESSFUL_RUN={len(successful_runs)}")
          print(f"F2_FUNNEL_DELIVERING_NOW={len(delivering)}")
          print(f"F2_FUNNEL_BRONZE_SOURCES={len(bronze)}")
          print(f"F2_FUNNEL_SILVER_SOURCES={len(silver)}")
          for key in keys:
              source = f"generic_origin:{key}"
              row = runs.get(source)
              status = row["status"] if row else "not_run"
              loaded = int(row["total_loaded"] or 0) if row else 0
              inserted = int(row["inserted_count"] or 0) if row else 0
              print(
                  f"F2_COMPANY_RESULT={key}|persisted={key in persisted}|active={source in active}|"
                  f"run={status}|loaded={loaded}|inserted={inserted}|bronze={bronze.get(source,0)}|silver={silver.get(source,0)}"
              )
          if not active:
              raise SystemExit("F2_NO_NEW_COHORT_SOURCE_REACHED_ACTIVE_PROOF_PASS")
          print("F2_REAL_COMPANY_COHORT=PASS")
          PY

      - name: Upload cohort evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f2-real-company-cohort
          path: |
            /tmp/jap-f2-real-cohort-result.json
            /tmp/jap-f2-real-cohort-product.json
            /tmp/jap-f2-real-cohort-keys.txt
          if-no-files-found: warn
          retention-days: 14
