name: DRJ Read-only Branch Observer

on:
  pull_request:
    paths:
      - .github/workflows/drj-readonly-branch-observer.yml
      - .github/drj/portable_branch_observer_v1.py
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify attested DRJ observer blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/drj/portable_branch_observer_v1.py)" = "87f53c3ed0daf462bd6823c1a31b51c298bd23c7"
      - name: Run DRJ read-only observer
        env:
          GH_TOKEN: ${{ github.token }}
          DRJ_OBSERVER_OUTPUT: /tmp/drj-branch-observer.json
        run: python .github/drj/portable_branch_observer_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: drj-branch-observer-${{ github.run_id }}
          path: /tmp/drj-branch-observer.json
          retention-days: 1
