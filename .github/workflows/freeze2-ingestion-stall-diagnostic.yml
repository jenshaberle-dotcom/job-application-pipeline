name: Freeze-II ingestion stall diagnostic

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: freeze2-ingestion-stall-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    name: Read-only recurring ingestion diagnosis
    if: >-
      ${{ vars.RCC_JAP_BLUE_ASSIGNMENT_FROZEN != 'true' &&
          (
            (github.event_name == 'workflow_dispatch' &&
             github.ref == 'refs/heads/main') ||
            (github.event_name == 'issue_comment' &&
             github.event.issue.number == 1038 &&
             github.event.comment.user.login == 'jenshaberle-dotcom' &&
             github.event.comment.author_association == 'OWNER' &&
             startsWith(github.event.comment.body, '<!-- jap-freeze2-ingestion-diagnostic:run:v1 -->'))
          ) }}
    runs-on: [self-hosted, Linux, X64, job-pipeline-runtime-linux]
    timeout-minutes: 30
    env:
      RCC_REPOSITORY_ID: "1230805345"
      RCC_REPOSITORY: jenshaberle-dotcom/job-application-pipeline
      RCC_RUNNER_NAME: job-pipeline-runtime-linux
      REPORT_OUTPUT: /tmp/freeze2-ingestion-stall-diagnostic.json

    steps:
      - name: Check out exact main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve verified RCC runtime context
        shell: bash
        run: |
          set -euo pipefail
          context_file="${RCC_RUNTIME_CONTEXT_FILE:-$HOME/.config/DeepOceanInfrastructure/RCC/runtime-contexts/${RCC_REPOSITORY_ID}-${RCC_RUNNER_NAME}.json}"
          test -f "$context_file"
          context_output="$(python3 - "$context_file" "$RCC_REPOSITORY_ID" "$RCC_REPOSITORY" "$RCC_RUNNER_NAME" <<'PY'
          import json
          import sys
          from pathlib import PurePosixPath

          path, repo_id, repository, runner = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              context = json.load(handle)
          if context.get("RepositoryId") != int(repo_id):
              raise SystemExit("RUNTIME_REPOSITORY_ID_MISMATCH")
          if context.get("Repository") != repository:
              raise SystemExit("RUNTIME_REPOSITORY_MISMATCH")
          if context.get("RunnerName") != runner:
              raise SystemExit("RUNTIME_RUNNER_MISMATCH")
          if context.get("Platform") != "linux-wsl":
              raise SystemExit("RUNTIME_PLATFORM_MISMATCH")
          if context.get("Status") != "PASS" or context.get("PrimaryFailure") not in (None, ""):
              raise SystemExit("RUNTIME_CONTEXT_NOT_PASS")
          checks = {
              item.get("Id"): item.get("Status")
              for item in context.get("Checks", [])
              if isinstance(item, dict)
          }
          required = {
              "repository_identity",
              "checkout",
              "checkout_repository",
              "env_file",
              "env_keys",
              "interpreter",
              "interpreter_probe",
              "capability:postgresql",
          }
          failed = sorted(key for key in required if checks.get(key) != "PASS")
          if failed:
              raise SystemExit("RUNTIME_CHECKS_NOT_PASS:" + ",".join(failed))
          checkout = context.get("CheckoutRoot")
          interpreter = context.get("Interpreter")
          env_file = context.get("EnvFile")
          root = PurePosixPath(checkout)
          if root not in PurePosixPath(interpreter).parents:
              raise SystemExit("INTERPRETER_OUTSIDE_CHECKOUT")
          if root not in PurePosixPath(env_file).parents:
              raise SystemExit("ENV_OUTSIDE_CHECKOUT")
          print(interpreter)
          print(env_file)
          PY
          )"
          mapfile -t values <<< "$context_output"
          test "${#values[@]}" -eq 2
          printf 'RUNTIME_PYTHON=%s\n' "${values[0]}" >> "$GITHUB_ENV"
          printf 'RUNTIME_ENV_FILE=%s\n' "${values[1]}" >> "$GITHUB_ENV"

      - name: Qualify diagnostic contracts
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" -m pytest -q tests/test_freeze2_ingestion_stall_diagnostic.py
          "$RUNTIME_PYTHON" -m ruff check             scripts/run_freeze2_ingestion_stall_diagnostic.py             tests/test_freeze2_ingestion_stall_diagnostic.py

      - name: Run exact-main read-only diagnosis
        shell: bash
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1090
          source "$RUNTIME_ENV_FILE"
          set +a
          export PGOPTIONS="-c default_transaction_read_only=on"
          "$RUNTIME_PYTHON" -m scripts.run_freeze2_ingestion_stall_diagnostic             --output "$REPORT_OUTPUT"

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: freeze2-ingestion-stall-diagnostic-${{ github.run_id }}
          path: ${{ env.REPORT_OUTPUT }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish diagnosis to Freeze-II issue
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" - "$REPORT_OUTPUT" <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.request

          report = json.loads(Path(os.environ["REPORT_OUTPUT"]).read_text(encoding="utf-8"))
          body = "\n".join(
              [
                  "<!-- jap-freeze2-ingestion-diagnostic:v1 -->",
                  "## Freeze-II — ingestion stall diagnosis",
                  "",
                  f"- source SHA: `{os.environ['SOURCE_SHA']}`",
                  f"- workflow: https://github.com/{os.environ['REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}",
                  f"- classification: **{report['classification']}**",
                  f"- next action: {report['next_action']}",
                  f"- profile summary: `{json.dumps(report['profile_summary'], sort_keys=True)}`",
                  f"- latest run: `{json.dumps(report['latest_ingestion_run'], sort_keys=True)}`",
                  f"- recent 36h: `{json.dumps(report['recent_36h'], sort_keys=True)}`",
                  f"- layer freshness: `{json.dumps(report['layer_freshness'], sort_keys=True)}`",
                  f"- ages hours: `{json.dumps(report['ages_hours'], sort_keys=True)}`",
                  "",
                  "Boundaries: DB writes 0; external requests 0; source activation 0; scheduler mutation 0.",
              ]
          )
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(body + "\n", encoding="utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/1038/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "JAP-Freeze-II-Ingestion-Diagnostic",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 201:
                  raise SystemExit(f"ISSUE_COMMENT_HTTP_{response.status}")
          PY
