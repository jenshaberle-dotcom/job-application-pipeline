name: Temporary F6 target 626 diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/tmp-f6-target-626-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, job-pipeline-runtime-linux]
    timeout-minutes: 10
    env:
      RCC_REPOSITORY_ID: "1230805345"
      RCC_REPOSITORY: jenshaberle-dotcom/job-application-pipeline
      RCC_RUNNER_NAME: job-pipeline-runtime-linux
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Resolve RCC runtime
        shell: bash
        run: |
          set -euo pipefail
          context_file="${RCC_RUNTIME_CONTEXT_FILE:-$HOME/.config/DeepOceanInfrastructure/RCC/runtime-contexts/${RCC_REPOSITORY_ID}-${RCC_RUNNER_NAME}.json}"
          test -f "$context_file"
          python3 - "$context_file" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          c=json.load(open(sys.argv[1], encoding='utf-8'))
          if c.get('Status') != 'PASS': raise SystemExit('RCC_CONTEXT_NOT_PASS')
          print('RUNTIME_PYTHON='+c['Interpreter'])
          print('RUNTIME_ENV_FILE='+c['EnvFile'])
          PY
      - name: Read exact current DB truth for Silver 626
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$RUNTIME_ENV_FILE"
          set +a
          export PGOPTIONS="-c default_transaction_read_only=on"
          "$RUNTIME_PYTHON" - <<'PY'
          import json
          import psycopg
          from psycopg.rows import dict_row
          from src.config import get_database_config

          with psycopg.connect(**get_database_config(), row_factory=dict_row) as conn:
              with conn.cursor() as cur:
                  cur.execute('SET TRANSACTION READ ONLY')
                  cur.execute('''
                  SELECT readiness.silver_job_id, readiness.source_name, readiness.source_url,
                         readiness.title, readiness.company_name, readiness.lifecycle_status,
                         readiness.activity_status, readiness.origin_validation_status,
                         readiness.canonical_source_type, readiness.product_readiness_status,
                         silver.raw_job_id, raw.external_job_id, raw.raw_data,
                         obs.source_url AS latest_observation_source_url,
                         obs.normalized_evidence AS latest_observation_evidence,
                         obs.observed_at AS latest_observation_observed_at
                  FROM gold_product_v1_job_readiness readiness
                  JOIN silver_jobs silver ON silver.id = readiness.silver_job_id
                  JOIN raw_jobs raw ON raw.id = silver.raw_job_id
                  LEFT JOIN LATERAL (
                    SELECT source_url, normalized_evidence, observed_at
                    FROM job_observations
                    WHERE raw_job_id = silver.raw_job_id
                      AND source_name = silver.source_name
                      AND is_seen = TRUE
                    ORDER BY observed_at DESC, id DESC LIMIT 1
                  ) obs ON TRUE
                  WHERE readiness.silver_job_id = 626
                  ''')
                  row=cur.fetchone()
              conn.rollback()
          if row is None: raise SystemExit('SILVER_626_NOT_FOUND')
          raw=row.get('raw_data') if isinstance(row.get('raw_data'), dict) else {}
          job=raw.get('job') if isinstance(raw.get('job'), dict) else {}
          detail=raw.get('detail_evidence') if isinstance(raw.get('detail_evidence'), dict) else {}
          normalized=row.get('latest_observation_evidence') if isinstance(row.get('latest_observation_evidence'), dict) else {}
          nr=normalized.get('raw_evidence') if isinstance(normalized.get('raw_evidence'), dict) else {}
          nj=nr.get('job') if isinstance(nr.get('job'), dict) else {}
          out={
            'silver_job_id':row.get('silver_job_id'),
            'source_name':row.get('source_name'), 'source_url':row.get('source_url'),
            'title':row.get('title'), 'company_name':row.get('company_name'),
            'lifecycle_status':row.get('lifecycle_status'), 'activity_status':row.get('activity_status'),
            'origin_validation_status':row.get('origin_validation_status'),
            'canonical_source_type':row.get('canonical_source_type'),
            'product_readiness_status':row.get('product_readiness_status'),
            'raw_job_id':row.get('raw_job_id'), 'external_job_id':row.get('external_job_id'),
            'raw_job_source_url':job.get('source_url'),
            'raw_job_description_present':bool(str(job.get('description') or '').strip()),
            'detail_status_code':detail.get('status_code'),
            'detail_page_title':detail.get('page_title'),
            'latest_observation_source_url':row.get('latest_observation_source_url'),
            'latest_observation_observed_at':str(row.get('latest_observation_observed_at') or ''),
            'latest_observation_job_source_url':nj.get('source_url'),
            'latest_observation_description_present':bool(str(nj.get('description') or '').strip()),
          }
          print('TARGET_626='+json.dumps(out, ensure_ascii=False, sort_keys=True))
          print('DATABASE_WRITES=0')
          PY
