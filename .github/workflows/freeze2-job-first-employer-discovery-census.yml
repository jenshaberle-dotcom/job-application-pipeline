name: Freeze-II job-first employer discovery census

on:
  pull_request:
    paths:
      - "src/search_intelligence/employer_discovery_census.py"
      - "src/silver/relevance.py"
      - "tests/test_employer_discovery_census.py"
      - "tests/test_market_sensor_coverage.py"
      - ".github/workflows/freeze2-job-first-employer-discovery-census.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Verify job-first census and existing market relevance contracts
        run: |
          python -m pytest -q \
            tests/test_employer_discovery_census.py \
            tests/test_market_sensor_coverage.py \
            tests/test_relevance.py
