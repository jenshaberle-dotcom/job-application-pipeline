name: F4A one-shot Product loader isolation fix

on:
  push:
    branches: [agent/f4a-profile-fit-coverage-v2]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/f4a-profile-fit-coverage-v2
          fetch-depth: 0

      - name: Apply exact dependency-isolation patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"PATCH_ANCHOR_MISMATCH:{path}:{count}:{old[:100]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = "scripts/product_v1_control_center_base.py"
          replace_once(
              path,
              "from src.connectors.registry import build_default_connector_registry\n",
              "",
          )
          replace_once(
              path,
              "def _load_source_connector_overview(\n"
              "    conn: psycopg.Connection[object],\n"
              ") -> dict[str, object]:\n"
              "    return build_source_connector_overview(\n",
              "def _load_source_connector_overview(\n"
              "    conn: psycopg.Connection[object],\n"
              ") -> dict[str, object]:\n"
              "    # Keep connector implementation dependencies out of the core Product\n"
              "    # payload import path. The Sources panel opts into them explicitly.\n"
              "    from src.connectors.registry import build_default_connector_registry\n\n"
              "    return build_source_connector_overview(\n",
          )
          replace_once(
              path,
              "def load_product_v1_payload() -> dict[str, object]:\n"
              "    with psycopg.connect(\n"
              "        DatabaseConfig.from_environment().dsn(), row_factory=dict_row\n"
              "    ) as conn:\n"
              "        source_connector_overview = _load_source_connector_overview(conn)\n",
              "def load_product_v1_payload(\n"
              "    *, include_source_connector_overview: bool = True\n"
              ") -> dict[str, object]:\n"
              "    with psycopg.connect(\n"
              "        DatabaseConfig.from_environment().dsn(), row_factory=dict_row\n"
              "    ) as conn:\n"
              "        source_connector_overview = (\n"
              "            _load_source_connector_overview(conn)\n"
              "            if include_source_connector_overview\n"
              "            else {}\n"
              "        )\n",
          )

          replace_once(
              "scripts/accept_f4a_profile_fit_coverage.py",
              "    payload = load_product_v1_payload()\n",
              "    # F4A validates the same canonical Product payload builder while\n"
              "    # excluding the unrelated Sources-panel connector inventory.\n"
              "    payload = load_product_v1_payload(include_source_connector_overview=False)\n",
          )

          Path(".github/workflows/f4a-one-shot-loader-isolation.yml").unlink()
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "fix(f4a): isolate Product coverage acceptance from connector stack"
          git push origin HEAD:agent/f4a-profile-fit-coverage-v2
