name: JAP Windows Desktop Host release

on:
  push:
    branches: [main]
    paths:
      - "windows/JAP.ControlCenter.Desktop/**"
      - ".github/workflows/jap-windows-desktop-host-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build and publish self-contained x64 desktop host
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve immutable desktop host version
        shell: powershell
        run: |
          $Version = (Get-Content "windows/JAP.ControlCenter.Desktop/VERSION" -Raw).Trim()
          if ($Version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid desktop host VERSION: $Version"
          }
          "DESKTOP_VERSION=$Version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DESKTOP_TAG=jap-winapp-desktop-v$Version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prove direct latest-update compatibility contract
        shell: powershell
        run: |
          $Path = "windows/JAP.ControlCenter.Desktop/UPDATE_COMPATIBILITY.json"
          if (-not (Test-Path $Path)) {
            throw "Desktop update compatibility contract is missing."
          }
          $Contract = Get-Content $Path -Raw | ConvertFrom-Json
          if ($Contract.schema -ne "job_application_pipeline.windows_update_compatibility.v1") {
            throw "Unexpected update compatibility schema: $($Contract.schema)"
          }
          if ($Contract.policy -ne "latest_direct") {
            throw "Desktop releases must remain direct latest-state upgrades."
          }
          if ($Contract.compatibility_line -ne "1" -or $Contract.direct_upgrade_from -ne "1.x") {
            throw "Desktop release is outside compatibility line 1."
          }
          if ($Contract.installer_schema -ne "job_application_pipeline.windows_control_center_install.v2") {
            throw "Desktop release installer schema is incompatible."
          }
          if ([int]$Contract.snooze_hours -ne 6) {
            throw "GUI update snooze contract must remain 6 hours."
          }
          if (-not $env:DESKTOP_VERSION.StartsWith("1.")) {
            throw "A breaking desktop update requires a new compatibility bridge instead of a v1 release."
          }
          Write-Host "JAP_UPDATE_POLICY=latest_direct"
          Write-Host "JAP_UPDATE_COMPATIBILITY_LINE=1"

      - name: Prove tracked branded application icon
        shell: powershell
        run: |
          $Icon = "windows/JAP.ControlCenter.Desktop/JAP-Control-Center.ico"
          if (-not (Test-Path $Icon)) {
            throw "Tracked JAP application icon is missing."
          }
          $Hash = (Get-FileHash $Icon -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "JAP_DESKTOP_ICON_SHA256=$Hash"

      - name: Publish self-contained Windows x64 host
        shell: powershell
        run: |
          $Out = Join-Path $env:RUNNER_TEMP "jap-desktop-host"
          dotnet publish windows/JAP.ControlCenter.Desktop/JAP.ControlCenter.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o $Out
          if (-not (Test-Path (Join-Path $Out "JAP.ControlCenter.Desktop.exe"))) {
            throw "Desktop host publish did not produce JAP.ControlCenter.Desktop.exe"
          }
          @{
            schema = "job_application_pipeline.desktop_host_build.v1"
            version = $env:DESKTOP_VERSION
            repository_id = 1230805345
            source_sha = $env:GITHUB_SHA
            runtime = "win-x64-self-contained"
            surface = "webview2-winforms"
            update_policy = "latest_direct"
            compatibility_line = "1"
          } | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $Out "build-info.json")

      - name: Package and checksum
        shell: powershell
        run: |
          $Out = Join-Path $env:RUNNER_TEMP "jap-desktop-host"
          $Asset = "JAP-Control-Center-Desktop-win-x64.zip"
          if (Test-Path $Asset) { Remove-Item -Force $Asset }
          Compress-Archive -Path (Join-Path $Out "*") -DestinationPath $Asset -CompressionLevel Optimal
          $Hash = (Get-FileHash $Asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$Hash  $Asset" | Set-Content -Encoding ASCII "$Asset.sha256"
          Write-Host "DESKTOP_HOST_SHA256=$Hash"

      - name: Publish immutable GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Inventory only the tagName field that is supported by the runner's gh CLI.
          # An existing version is immutable: do not overwrite its assets; bump VERSION before changing the host.
          # Every v1 release is a direct upgrade target from every older supported v1 installation.
          $ReleaseJson = gh release list `
            --repo $env:GITHUB_REPOSITORY `
            --limit 1000 `
            --json tagName
          if ($LASTEXITCODE -ne 0) { throw "Desktop host release inventory failed." }
          $Releases = $ReleaseJson | ConvertFrom-Json
          $Existing = $Releases | Where-Object { $_.tagName -eq $env:DESKTOP_TAG } | Select-Object -First 1
          if ($null -ne $Existing) {
            Write-Host "DESKTOP_HOST_RELEASE=ALREADY_PUBLISHED tag=$env:DESKTOP_TAG"
            exit 0
          }

          gh release create $env:DESKTOP_TAG `
            "JAP-Control-Center-Desktop-win-x64.zip" `
            "JAP-Control-Center-Desktop-win-x64.zip.sha256" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "JAP Control Center Desktop v$env:DESKTOP_VERSION" `
            --notes "Immutable self-contained Windows x64 WebView2 host for JAP Control Center. Direct v1 latest-state upgrade. Source: $env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw "Desktop host release creation failed." }
          Write-Host "DESKTOP_HOST_RELEASE=PASS tag=$env:DESKTOP_TAG"
