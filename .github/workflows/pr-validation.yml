name: JAP RCC PR validation
run-name: JAP RCC validation ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      test_plan:
        description: Immutable RCC-selected validation plan; empty retains full legacy validation
        required: false
        default: ""
        type: string
      source_sha:
        description: Exact JAP source SHA admitted by RCC
        required: true
        type: string
      rcc_facade_label:
        required: true
        type: string
      rcc_assignment_label:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jap-rcc-pr-validation-${{ inputs.rcc_assignment_label }}
  cancel-in-progress: false

jobs:
  validate:
    name: Exact PR repository validation
    runs-on:
      - self-hosted
      - ${{ inputs.rcc_facade_label }}
      - ${{ inputs.rcc_assignment_label }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ github.workspace }}/rcc-workload-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      RCC_REPOSITORY_ID: "1230805345"
      RCC_REPOSITORY: jenshaberle-dotcom/job-application-pipeline
      RCC_EXPECTED_FACADE: ${{ inputs.rcc_facade_label }}
      RCC_ASSIGNMENT_LABEL: ${{ inputs.rcc_assignment_label }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      RCC_TEST_PLAN: ${{ inputs.test_plan }}

    steps:
      - name: Prove exact RCC assignment handoff
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNNER_NAME"
          test "$RUNNER_NAME" = "$RCC_EXPECTED_FACADE"
          [[ "$RCC_ASSIGNMENT_LABEL" =~ ^rcc-assignment-proof-[0-9a-f]{32}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'RCC_ASSIGNED_RUNNER=%s\n' "$RUNNER_NAME" >> "$GITHUB_ENV"
          echo "JAP_PR_RCC_HANDOFF=PASS facade=$RCC_EXPECTED_FACADE assignment=$RCC_ASSIGNMENT_LABEL runner=$RUNNER_NAME"

      - name: Check out exact admitted source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: rcc-workload-${{ github.run_id }}-${{ github.run_attempt }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "JAP_PR_EXACT_SOURCE=PASS source=$SOURCE_SHA"

      - name: Resolve verified RCC runtime context
        shell: bash
        run: |
          set -euo pipefail
          context_file="${RCC_RUNTIME_CONTEXT_FILE:-$HOME/.config/DeepOceanInfrastructure/RCC/runtime-contexts/${RCC_REPOSITORY_ID}-${RCC_ASSIGNED_RUNNER}.json}"
          test -f "$context_file"
          context_output="$(python3 scripts/resolve_rcc_runtime_context.py "$context_file" "$RCC_REPOSITORY_ID" "$RCC_REPOSITORY" "$RCC_ASSIGNED_RUNNER" "$SOURCE_SHA")"
          mapfile -t values <<< "$context_output"
          test "${#values[@]}" -eq 1
          test -x "${values[0]}"
          printf 'PR_PYTHON=%s\n' "${values[0]}" >> "$GITHUB_ENV"
          runtime_hash="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["ProfileHash"])' "$context_file")"
          [[ "$runtime_hash" =~ ^[0-9a-f]{64}$ ]]
          printf 'RCC_TEST_RUNTIME_FINGERPRINT=%s\n' "$runtime_hash" >> "$GITHUB_ENV"
          echo "JAP_PR_RCC_RUNTIME=PASS runner=$RUNNER_NAME"

      - name: Prove qualified Python environment
        shell: bash
        run: |
          set -euo pipefail
          test "$("$PR_PYTHON" -c 'import platform; print(platform.python_version())')" = "3.12.14"
          "$PR_PYTHON" -m pip check
          "$PR_PYTHON" -m pytest --version
          "$PR_PYTHON" -m ruff --version
          echo "JAP_PR_PYTHON_ENV=PASS"

      - name: Run immutable dynamic test plan
        if: ${{ inputs.test_plan != '' }}
        shell: bash
        run: |
          set -euo pipefail
          policy_sha="$("$PR_PYTHON" -c 'import json,os,re; p=json.loads(os.environ["RCC_TEST_PLAN"]); s=p["policy_sha"]; assert re.fullmatch(r"[0-9a-f]{40}",s); print(s)')"
          trusted_launcher="$RUNNER_TEMP/rcc-validation-plan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.py"
          trap 'rm -f -- "$trusted_launcher"' EXIT
          git show "${policy_sha}:scripts/run_validation_test_plan.py" > "$trusted_launcher"
          "$PR_PYTHON" "$trusted_launcher"

      - name: Upload dynamic plan receipt
        if: ${{ inputs.test_plan != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: validation-test-receipt
          path: rcc-workload-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/validation-test-receipt.json
          if-no-files-found: error

      - name: Run full pytest
        if: ${{ inputs.test_plan == '' }}
        shell: bash
        run: |
          set -euo pipefail
          "$PR_PYTHON" -m pytest -q
          echo "JAP_PR_PYTEST=PASS"

      - name: Validate repository and documentation contracts
        shell: bash
        run: |
          set -euo pipefail
          "$PR_PYTHON" scripts/check_documentation_references.py
          "$PR_PYTHON" scripts/check_documentation_architecture.py
          "$PR_PYTHON" scripts/validate_ci_contract.py
          "$PR_PYTHON" scripts/check_classic_documentation_truth.py
          echo "JAP_PR_REPOSITORY_CONTRACTS=PASS"

      - name: Ruff changed Python files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          mapfile -t changed_python < <(
            git diff --name-only --diff-filter=ACMR origin/main...HEAD -- '*.py'
          )
          existing=()
          for path in "${changed_python[@]}"; do
            test -f "$path" && existing+=("$path")
          done
          if [ "${#existing[@]}" -gt 0 ]; then
            "$PR_PYTHON" -m ruff check "${existing[@]}"
          fi
          echo "JAP_PR_CHANGED_RUFF=PASS count=${#existing[@]}"

      - name: Summary
        working-directory: ${{ runner.temp }}
        if: always()
        shell: bash
        run: |
          {
            echo "### JAP RCC PR validation"
            printf -- '- Exact source: %s\n' "$SOURCE_SHA"
            printf -- '- Assignment: %s\n' "$RCC_ASSIGNMENT_LABEL"
            printf -- '- Runner: %s\n' "${RUNNER_NAME:-unknown}"
            echo "- No hosted fallback or consumer runner selection is permitted."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete ephemeral candidate
        if: always()
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          source_root="$GITHUB_WORKSPACE/rcc-workload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "$source_root"
          test ! -e "$source_root"
          echo "JAP_PR_WORKSPACE_CLEANUP=PASS"
