name: F4A-R3 Bronze2E guarded apply

on:
  push:
    branches:
      - agent/f4a-r3-operator-metadata-projection
      - agent/f4a-r4-operator-review-usability
    paths:
      - ".github/triggers/f4a-r3-bronze2e-apply.trigger"

permissions:
  contents: read

concurrency:
  group: f4a-r3-bronze2e-guarded-apply
  cancel-in-progress: false

jobs:
  apply:
    name: Refresh exact-Origin Silver requirement evidence
    runs-on: [self-hosted, Linux, X64, job-pipeline-runtime-linux]
    timeout-minutes: 40
    env:
      RCC_REPOSITORY_ID: "1230805345"
      RCC_REPOSITORY: jenshaberle-dotcom/job-application-pipeline
      RCC_RUNNER_NAME: job-pipeline-runtime-linux
      APPROVAL_TOKEN: F4A-R3-SILVER-REQUIREMENT-BACKFILL-001
      TRIGGER_FILE: .github/triggers/f4a-r3-bronze2e-apply.trigger

    steps:
      - name: Check out exact authorized head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify single-purpose post-migration refresh authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -f "$TRIGGER_FILE"
          parent="$(git rev-parse HEAD^)"
          mapfile -t changed < <(git diff --name-only "$parent" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$TRIGGER_FILE"
          authority="$(sed -n 's/^authority=//p' "$TRIGGER_FILE")"
          qualified_head="$(sed -n 's/^qualified_preflight_head=//p' "$TRIGGER_FILE")"
          qualified_run="$(sed -n 's/^qualified_preflight_run=//p' "$TRIGGER_FILE")"
          qualified_ci="$(sed -n 's/^qualified_pipeline_ci_run=//p' "$TRIGGER_FILE")"
          qualified_windows="$(sed -n 's/^qualified_windows_contract_run=//p' "$TRIGGER_FILE")"
          mutation="$(sed -n 's/^mutation=//p' "$TRIGGER_FILE")"
          test "$authority" = "$APPROVAL_TOKEN"
          test "$qualified_head" = "$parent"
          test -n "$qualified_run"
          test -n "$qualified_ci"
          test -n "$qualified_windows"
          test "$mutation" = "refresh-current-cohort-silver-sidecar-only"
          echo "F4A_R3_REFRESH_AUTHORIZED_PARENT=$parent"
          echo "F4A_R3_REFRESH_QUALIFIED_PREFLIGHT_RUN=$qualified_run"
          echo "F4A_R3_REFRESH_QUALIFIED_PIPELINE_CI_RUN=$qualified_ci"
          echo "F4A_R3_REFRESH_QUALIFIED_WINDOWS_RUN=$qualified_windows"

      - name: Resolve verified RCC runtime context
        shell: bash
        run: |
          set -euo pipefail
          context_file="${RCC_RUNTIME_CONTEXT_FILE:-$HOME/.config/DeepOceanInfrastructure/RCC/runtime-contexts/${RCC_REPOSITORY_ID}-${RCC_RUNNER_NAME}.json}"
          test -f "$context_file"
          context_output="$(python3 - "$context_file" "$RCC_REPOSITORY_ID" "$RCC_REPOSITORY" "$RCC_RUNNER_NAME" <<'PY'
          import json
          import sys
          from pathlib import PurePosixPath

          path, repo_id, repository, runner = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              context = json.load(handle)
          if context.get("RepositoryId") != int(repo_id):
              raise SystemExit("RUNTIME_REPOSITORY_ID_MISMATCH")
          if context.get("Repository") != repository:
              raise SystemExit("RUNTIME_REPOSITORY_MISMATCH")
          if context.get("RunnerName") != runner:
              raise SystemExit("RUNTIME_RUNNER_MISMATCH")
          if context.get("Status") != "PASS" or context.get("PrimaryFailure") not in (None, ""):
              raise SystemExit("RUNTIME_CONTEXT_NOT_PASS")
          root = PurePosixPath(context["CheckoutRoot"])
          interpreter = context["Interpreter"]
          env_file = context["EnvFile"]
          if root not in PurePosixPath(interpreter).parents or root not in PurePosixPath(env_file).parents:
              raise SystemExit("RUNTIME_CONTEXT_PATH_MISMATCH")
          print(interpreter)
          print(env_file)
          PY
          )"
          mapfile -t values <<< "$context_output"
          test "${#values[@]}" -eq 2
          printf 'RUNTIME_PYTHON=%s\n' "${values[0]}" >> "$GITHUB_ENV"
          printf 'RUNTIME_ENV_FILE=%s\n' "${values[1]}" >> "$GITHUB_ENV"

      - name: Load masked Product database environment
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" - "$RUNTIME_ENV_FILE" "$GITHUB_ENV" <<'PY'
          import secrets
          import sys
          from pathlib import Path
          from dotenv import dotenv_values

          values = dotenv_values(Path(sys.argv[1]))
          required = (
              "POSTGRES_HOST", "POSTGRES_PORT", "POSTGRES_DB",
              "POSTGRES_USER", "POSTGRES_PASSWORD",
          )
          missing = [key for key in required if values.get(key) in (None, "")]
          if missing:
              raise SystemExit("RUNTIME_ENV_POSTGRES_KEYS_MISSING:" + ",".join(missing))
          print(f"::add-mask::{values['POSTGRES_PASSWORD']}")
          with Path(sys.argv[2]).open("a", encoding="utf-8") as handle:
              for key in required:
                  value = str(values[key])
                  marker = f"JAP_ENV_{secrets.token_hex(12)}"
                  while marker in value:
                      marker = f"JAP_ENV_{secrets.token_hex(12)}"
                  handle.write(f"{key}<<{marker}\n{value}\n{marker}\n")
          PY

      - name: Resolve pinned local OSS detail runtime
        shell: bash
        run: |
          set -euo pipefail
          local_oss_site="$(bash scripts/ensure_pinned_local_oss_runtime.sh \
            "$RUNTIME_PYTHON" requirements.txt "$RUNNER_TEMP/jap-f4a-r3-local-oss-sites")"
          test -d "$local_oss_site"
          printf 'PYTHONPATH=%s:%s\n' "$local_oss_site" "${PYTHONPATH:-}" >> "$GITHUB_ENV"
          PYTHONPATH="$local_oss_site:${PYTHONPATH:-}" "$RUNTIME_PYTHON" -c 'import extruct, trafilatura'

      - name: Requalify focused Bronze2E contracts before mutation
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" -m pytest -q \
            tests/test_generic_job_detail_evidence.py \
            tests/test_silver_requirement_evidence_projection.py \
            tests/test_operator_requirement_semantics.py \
            tests/test_f4a_r3_silver_requirement_backfill.py \
            tests/test_f4a_r3_bronze2e_requirement_audit.py \
            tests/test_successfactors_silver_location_projection.py \
            tests/test_f4a_r3_operator_metadata_projection.py
          "$RUNTIME_PYTHON" -m ruff check \
            src/connectors/generic_job_detail_evidence.py \
            src/silver/requirement_evidence_projection.py \
            src/silver/operator_requirement_semantics.py \
            scripts/run_f4a_r3_silver_requirement_backfill.py \
            scripts/run_f4a_r3_bronze2e_requirement_audit.py \
            scripts/product_v1_silver_requirement_projection.py \
            scripts/product_v1_job_presentation_runtime.py

      - name: Prove migration state already converged
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" - <<'PY'
          from scripts.apply_db_migrations import (
              checksum_mismatches,
              connect,
              discover_migration_files,
              load_tracked_migrations,
              pending_migrations,
          )

          migrations = discover_migration_files()
          with connect() as conn:
              tracked = load_tracked_migrations(conn)
          mismatches = checksum_mismatches(migrations, tracked)
          pending = [item.migration_key for item in pending_migrations(migrations, tracked)]
          print("F4A_R3_REFRESH_CHECKSUM_MISMATCHES=" + str(len(mismatches)))
          print("F4A_R3_REFRESH_PENDING_MIGRATIONS=" + ",".join(pending))
          if mismatches:
              raise SystemExit("F4A_R3_REFRESH_MIGRATION_CHECKSUM_DRIFT")
          if pending:
              raise SystemExit("F4A_R3_REFRESH_MIGRATION_DEBT")
          PY

      - name: Rebuild exact-Origin plan and enforce coverage before refresh
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/f4a_r3_pre_refresh_plan.json"
          "$RUNTIME_PYTHON" -m scripts.run_f4a_r3_silver_requirement_backfill --output "$output"
          "$RUNTIME_PYTHON" - "$output" <<'PY'
          import json
          import sys
          from collections import Counter, defaultdict

          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          allowed = {
              "observed_structured", "observed_bounded_text", "source_absent",
              "extractor_gap", "conflict", "origin_unavailable",
          }
          reachable = []
          covered = []
          legacy = []
          invalid = []
          gap_families = defaultdict(Counter)
          for proposal in report.get("proposals", []):
              payload = proposal.get("payload") or {}
              statuses = {
                  field: str((value or {}).get("status") or "missing")
                  for field, value in (payload.get("fields") or {}).items()
              }
              if any(status == "source_absent_or_unresolved" for status in statuses.values()):
                  legacy.append(proposal.get("silver_job_id"))
              if any(status not in allowed and status != "source_absent_or_unresolved" for status in statuses.values()):
                  invalid.append(proposal.get("silver_job_id"))
              if proposal.get("origin_unavailable"):
                  continue
              reachable.append(proposal)
              gaps = [field for field, status in statuses.items() if status == "extractor_gap"]
              if gaps:
                  family = str(proposal.get("source_name") or "").split(":", 1)[0] or "unknown"
                  for field in gaps:
                      gap_families[family][field] += 1
              else:
                  covered.append(proposal)
          ratio = len(covered) / len(reachable) if reachable else 0.0
          print(f"F4A_R3_PRE_REFRESH_CANDIDATES={report['candidate_count']}")
          print(f"F4A_R3_PRE_REFRESH_PROPOSALS={report['proposal_count']}")
          print(f"F4A_R3_PRE_REFRESH_BLOCKED={report['blocked_count']}")
          print(f"F4A_R3_PRE_REFRESH_REACHABLE={len(reachable)}")
          print(f"F4A_R3_PRE_REFRESH_COVERED={len(covered)}")
          print(f"F4A_R3_PRE_REFRESH_COVERAGE_RATIO={ratio:.4f}")
          print(f"F4A_R3_PRE_REFRESH_WOULD_CHANGE={report['would_change_count']}")
          print("F4A_R3_PRE_REFRESH_GAP_FAMILIES=" + json.dumps({k: dict(v) for k, v in gap_families.items()}, sort_keys=True))
          if report["candidate_count"] <= 0:
              raise SystemExit("F4A_R3_PRE_REFRESH_EMPTY_COHORT")
          if report["proposal_count"] != report["candidate_count"] or report["blocked_count"] != 0:
              raise SystemExit("F4A_R3_PRE_REFRESH_NOT_COMPLETE")
          if legacy or invalid:
              raise SystemExit("F4A_R3_PRE_REFRESH_INVALID_STATUS")
          if not reachable or ratio < 0.80:
              raise SystemExit("F4A_R3_PRE_REFRESH_COVERAGE_BELOW_80_PERCENT")
          if any(report["boundaries"].values()):
              raise SystemExit("F4A_R3_PRE_REFRESH_BOUNDARY_VIOLATION")
          print("F4A_R3_PRE_REFRESH_GATE=PASS")
          PY

      - name: Refresh exact current-cohort Silver requirement evidence only
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/f4a_r3_refresh_apply.json"
          "$RUNTIME_PYTHON" -m scripts.run_f4a_r3_silver_requirement_backfill \
            --apply \
            --approval-token "$APPROVAL_TOKEN" \
            --output "$output"
          "$RUNTIME_PYTHON" - "$output" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          print(f"F4A_R3_REFRESH_APPLIED={report.get('applied_count', 0)}")
          if report.get("mode") != "apply":
              raise SystemExit("F4A_R3_REFRESH_APPLY_MODE_MISMATCH")
          if report["blocked_count"] != 0:
              raise SystemExit("F4A_R3_REFRESH_APPLY_BLOCKED")
          if int(report.get("applied_count") or 0) != int(report["proposal_count"]):
              raise SystemExit("F4A_R3_REFRESH_APPLY_COUNT_MISMATCH")
          PY

      - name: Prove exact-Origin convergence after refresh
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/f4a_r3_post_refresh_plan.json"
          "$RUNTIME_PYTHON" -m scripts.run_f4a_r3_silver_requirement_backfill --output "$output"
          "$RUNTIME_PYTHON" - "$output" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          print(f"F4A_R3_POST_REFRESH_CANDIDATES={report['candidate_count']}")
          print(f"F4A_R3_POST_REFRESH_BLOCKED={report['blocked_count']}")
          print(f"F4A_R3_POST_REFRESH_WOULD_CHANGE={report['would_change_count']}")
          if report["candidate_count"] <= 0:
              raise SystemExit("F4A_R3_POST_REFRESH_EMPTY_COHORT")
          if report["proposal_count"] != report["candidate_count"] or report["blocked_count"] != 0:
              raise SystemExit("F4A_R3_POST_REFRESH_NOT_COMPLETE")
          if report["would_change_count"] != 0:
              raise SystemExit("F4A_R3_POST_REFRESH_NOT_CONVERGED")
          if any(report["boundaries"].values()):
              raise SystemExit("F4A_R3_POST_REFRESH_BOUNDARY_VIOLATION")
          print("F4A_R3_POST_REFRESH_CONVERGENCE=PASS")
          PY

      - name: Verify persisted Silver to operator coverage after refresh
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/f4a_r3_post_refresh_audit.json"
          "$RUNTIME_PYTHON" -m scripts.run_f4a_r3_bronze2e_requirement_audit --output "$output"
          "$RUNTIME_PYTHON" - "$output" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          print(f"F4A_R3_POST_REFRESH_AUDIT_CANDIDATES={report['candidate_count']}")
          print(f"F4A_R3_POST_REFRESH_AUDIT_OPERATOR_COUNT={report['operator_candidate_count']}")
          print(f"F4A_R3_POST_REFRESH_AUDIT_COVERAGE_RATIO={report['reachable_without_extractor_gap_ratio']:.4f}")
          print(f"F4A_R3_POST_REFRESH_AUDIT_LEGACY={report['rows_with_legacy_ambiguous_status']}")
          print(f"F4A_R3_POST_REFRESH_AUDIT_PROJECTION_LOSS={report['rows_with_silver_to_operator_projection_loss']}")
          print(f"F4A_R3_POST_REFRESH_AUDIT_VIOLATIONS={report['violating_row_count']}")
          if report["candidate_count"] != report["operator_candidate_count"]:
              raise SystemExit("F4A_R3_POST_REFRESH_OPERATOR_SCOPE_MISMATCH")
          if report["rows_with_legacy_ambiguous_status"] != 0:
              raise SystemExit("F4A_R3_POST_REFRESH_LEGACY_STATUS")
          if report["rows_with_silver_to_operator_projection_loss"] != 0:
              raise SystemExit("F4A_R3_POST_REFRESH_PROJECTION_LOSS")
          if report["violating_row_count"] != 0 or not report["coverage_gate_pass"]:
              raise SystemExit("F4A_R3_POST_REFRESH_AUDIT_NOT_PASS")
          if any(report["boundaries"].values()):
              raise SystemExit("F4A_R3_POST_REFRESH_AUDIT_BOUNDARY_VIOLATION")
          print("F4A_R3_POST_REFRESH_OPERATOR_GATE=PASS")
          PY

      - name: Verify no migration debt remains
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" scripts/apply_db_migrations.py --status
