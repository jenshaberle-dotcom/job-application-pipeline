name: F5 application lifecycle qualification

on:
  pull_request:
    paths:
      - ".github/workflows/f5-application-lifecycle-reconciliation.yml"
      - "db/migrations/112_create_authoritative_application_lifecycle.sql"
      - "db/migrations/113_enable_mailbox_first_application_tracking.sql"
      - "db/migrations/114_application_event_candidate_source_identity.sql"
      - "scripts/run_f5_application_lifecycle_reconciliation.py"
      - "scripts/run_f5_application_lifecycle_schema_qualification.py"
      - "scripts/run_f5_mailbox_tracking_schema_qualification.py"
      - "scripts/run_f5_candidate_supersession_schema_qualification.py"
      - "scripts/run_f5_application_tracking_product_proof.py"
      - "scripts/product_v1_f5_application_tracking_runtime.py"
      - "scripts/product_v1_f5_application_actions.py"
      - "scripts/product_v1_f5_mailbox_ingest.py"
      - "scripts/run_product_v1_f5_mailbox_batch_preflight.py"
      - "scripts/run_product_v1_f5_mailbox_persistence_preflight.py"
      - "scripts/run_product_v1_f5_mailbox_persistence_apply.py"
      - "scripts/run_product_v1_f5_mailbox_persistence_live_preflight.py"
      - "scripts/run_product_v1_demo_control_center.py"
      - "src/search_intelligence/application_event_classifier.py"
      - "tests/test_f5_application_lifecycle_reconciliation.py"
      - "tests/test_f5_application_lifecycle_schema_qualification.py"
      - "tests/test_f5_authoritative_application_lifecycle_contract.py"
      - "tests/test_f5_mailbox_first_application_contract.py"
      - "tests/test_f5_candidate_supersession_schema_qualification.py"
      - "tests/test_f5_mailbox_candidate_supersession_contract.py"
      - "tests/test_f5_application_tracking_product_proof.py"
      - "tests/test_product_v1_f5_application_tracking_runtime.py"
      - "tests/test_product_v1_f5_application_actions.py"
      - "tests/test_product_v1_f5_mailbox_ingest.py"
      - "tests/test_product_v1_f5_mailbox_batch_preflight.py"
      - "tests/test_application_event_classifier.py"
      - "frontend/control-center/src/F5ApplicationTracking.tsx"
      - "frontend/control-center/src/f5-application-tracking.css"
      - "frontend/control-center/src/DemoProductPolish.tsx"
      - "docs/current/REENTRY.md"
      - "docs/planning/active/F5-APPLICATION-LIFECYCLE-TRACKING.md"
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      mode:
        description: "F5 qualification phase"
        required: true
        default: current
        type: choice
        options:
          - current
          - tracking
          - preflight
          - apply
          - postapply
          - candidate_preflight
          - candidate_apply
          - candidate_postapply
      source_sha:
        description: "Exact source SHA to qualify/apply"
        required: true
        type: string
      approval_token:
        description: "Required only for apply modes"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: f5-application-lifecycle-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: F5 lifecycle exact-head qualification
    if: >-
      vars.RCC_JAP_BLUE_ASSIGNMENT_FROZEN != 'true' &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.number == 737 &&
        github.event.comment.user.login == 'jenshaberle-dotcom' &&
        github.event.comment.author_association == 'OWNER' &&
        (startsWith(github.event.comment.body, '<!-- jap-f5-mailbox-schema:apply:v1 -->') ||
         startsWith(github.event.comment.body, '<!-- jap-f5-mailbox-schema:postapply:v1 -->') ||
         startsWith(github.event.comment.body, '<!-- jap-f5-candidate-supersession:apply:v1 -->') ||
         startsWith(github.event.comment.body, '<!-- jap-f5-candidate-supersession:postapply:v1 -->'))))
    runs-on: [self-hosted, Linux, X64, job-pipeline-runtime-linux]
    timeout-minutes: 30
    env:
      RCC_REPOSITORY_ID: "1230805345"
      RCC_REPOSITORY: jenshaberle-dotcom/job-application-pipeline
      RCC_RUNNER_NAME: job-pipeline-runtime-linux
      MODE: >-
        ${{ github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '<!-- jap-f5-mailbox-schema:apply:v1 -->') && 'apply' ||
            github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '<!-- jap-f5-mailbox-schema:postapply:v1 -->') && 'postapply' ||
            github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '<!-- jap-f5-candidate-supersession:apply:v1 -->') && 'candidate_apply' ||
            github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '<!-- jap-f5-candidate-supersession:postapply:v1 -->') && 'candidate_postapply' ||
            github.event_name == 'workflow_dispatch' && inputs.mode || 'current' }}
      SOURCE_SHA: >-
        ${{ github.event_name == 'issue_comment' && github.sha ||
            github.event_name == 'workflow_dispatch' && inputs.source_sha ||
            github.event.pull_request.head.sha }}
      APPROVAL_TOKEN: >-
        ${{ github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '<!-- jap-f5-mailbox-schema:apply:v1 -->') && 'F5-MAILBOX-FIRST-MIGRATION-113' ||
            github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '<!-- jap-f5-candidate-supersession:apply:v1 -->') && 'F5-CANDIDATE-SUPERSESSION-MIGRATION-114' ||
            inputs.approval_token || '' }}
      OUTPUT: /tmp/jap-f5-mailbox-schema-qualification.json
      PRODUCT_OUTPUT: /tmp/jap-f5-mailbox-product-proof.json
      CANDIDATE_OUTPUT: /tmp/jap-f5-candidate-supersession-qualification.json
      TARGET_MIGRATION: 113_enable_mailbox_first_application_tracking.sql
      CANDIDATE_TARGET_MIGRATION: 114_application_event_candidate_source_identity.sql

    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$SOURCE_SHA"
          echo "F5_EXACT_SOURCE=PASS source=$actual mode=$MODE"

      - name: Resolve verified RCC runtime context
        shell: bash
        run: |
          set -euo pipefail
          context_file="${RCC_RUNTIME_CONTEXT_FILE:-$HOME/.config/DeepOceanInfrastructure/RCC/runtime-contexts/${RCC_REPOSITORY_ID}-${RCC_RUNNER_NAME}.json}"
          test -f "$context_file"
          context_output="$(python3 - "$context_file" "$RCC_REPOSITORY_ID" "$RCC_REPOSITORY" "$RCC_RUNNER_NAME" <<'PY'
          import json
          import sys
          from pathlib import PurePosixPath

          path, repo_id, repository, runner = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              context = json.load(handle)
          if context.get("RepositoryId") != int(repo_id):
              raise SystemExit("RUNTIME_REPOSITORY_ID_MISMATCH")
          if context.get("Repository") != repository:
              raise SystemExit("RUNTIME_REPOSITORY_MISMATCH")
          if context.get("RunnerName") != runner:
              raise SystemExit("RUNTIME_RUNNER_MISMATCH")
          if context.get("Platform") != "linux-wsl":
              raise SystemExit("RUNTIME_PLATFORM_MISMATCH")
          if context.get("Status") != "PASS" or context.get("PrimaryFailure") not in (None, ""):
              raise SystemExit("RUNTIME_CONTEXT_NOT_PASS")
          checks = {
              item.get("Id"): item.get("Status")
              for item in context.get("Checks", [])
              if isinstance(item, dict)
          }
          required = {
              "repository_identity", "checkout", "checkout_repository",
              "env_file", "env_keys", "interpreter", "interpreter_probe",
              "capability:postgresql",
          }
          failed = sorted(key for key in required if checks.get(key) != "PASS")
          if failed:
              raise SystemExit("RUNTIME_CHECKS_NOT_PASS:" + ",".join(failed))
          checkout = context.get("CheckoutRoot")
          interpreter = context.get("Interpreter")
          env_file = context.get("EnvFile")
          root = PurePosixPath(checkout)
          if root not in PurePosixPath(interpreter).parents:
              raise SystemExit("INTERPRETER_OUTSIDE_CHECKOUT")
          if root not in PurePosixPath(env_file).parents:
              raise SystemExit("ENV_OUTSIDE_CHECKOUT")
          print(interpreter)
          print(env_file)
          PY
          )"
          mapfile -t values <<< "$context_output"
          test "${#values[@]}" -eq 2
          printf 'RUNTIME_PYTHON=%s\n' "${values[0]}" >> "$GITHUB_ENV"
          printf 'RUNTIME_ENV_FILE=%s\n' "${values[1]}" >> "$GITHUB_ENV"
          echo "RCC_CONTEXT=PASS runner=${RUNNER_NAME}"

      - name: Qualify focused provider-free contracts
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" -m py_compile \
            scripts/run_f5_application_lifecycle_reconciliation.py \
            scripts/run_f5_application_lifecycle_schema_qualification.py \
            scripts/run_f5_mailbox_tracking_schema_qualification.py \
            scripts/run_f5_candidate_supersession_schema_qualification.py \
            scripts/run_f5_application_tracking_product_proof.py \
            scripts/product_v1_f5_application_tracking_runtime.py \
            scripts/product_v1_f5_application_actions.py \
            scripts/product_v1_f5_mailbox_ingest.py \
            scripts/run_product_v1_f5_mailbox_batch_preflight.py \
            scripts/run_product_v1_f5_mailbox_persistence_preflight.py \
            scripts/run_product_v1_f5_mailbox_persistence_apply.py \
            scripts/run_product_v1_f5_mailbox_persistence_live_preflight.py \
            src/search_intelligence/application_event_classifier.py
          "$RUNTIME_PYTHON" -m pytest -q \
            tests/test_f5_application_lifecycle_reconciliation.py \
            tests/test_f5_application_lifecycle_schema_qualification.py \
            tests/test_f5_authoritative_application_lifecycle_contract.py \
            tests/test_f5_mailbox_first_application_contract.py \
            tests/test_f5_candidate_supersession_schema_qualification.py \
            tests/test_f5_mailbox_candidate_supersession_contract.py \
            tests/test_f5_mailbox_persistence_apply_contract.py \
            tests/test_f5_application_tracking_product_proof.py \
            tests/test_product_v1_f5_application_tracking_runtime.py \
            tests/test_product_v1_f5_application_actions.py \
            tests/test_product_v1_f5_mailbox_ingest.py \
            tests/test_product_v1_f5_mailbox_batch_preflight.py \
            tests/test_application_event_classifier.py
          "$RUNTIME_PYTHON" -m ruff check \
            scripts/run_f5_application_lifecycle_reconciliation.py \
            scripts/run_f5_application_lifecycle_schema_qualification.py \
            scripts/run_f5_mailbox_tracking_schema_qualification.py \
            scripts/run_f5_candidate_supersession_schema_qualification.py \
            scripts/run_f5_application_tracking_product_proof.py \
            scripts/product_v1_f5_application_tracking_runtime.py \
            scripts/product_v1_f5_application_actions.py \
            scripts/product_v1_f5_mailbox_ingest.py \
            scripts/run_product_v1_f5_mailbox_batch_preflight.py \
            scripts/run_product_v1_f5_mailbox_persistence_preflight.py \
            scripts/run_product_v1_f5_mailbox_persistence_apply.py \
            scripts/run_product_v1_f5_mailbox_persistence_live_preflight.py \
            src/search_intelligence/application_event_classifier.py \
            tests/test_f5_application_lifecycle_reconciliation.py \
            tests/test_f5_application_lifecycle_schema_qualification.py \
            tests/test_f5_authoritative_application_lifecycle_contract.py \
            tests/test_f5_mailbox_first_application_contract.py \
            tests/test_f5_candidate_supersession_schema_qualification.py \
            tests/test_f5_mailbox_candidate_supersession_contract.py \
            tests/test_f5_mailbox_persistence_apply_contract.py \
            tests/test_f5_application_tracking_product_proof.py \
            tests/test_product_v1_f5_application_tracking_runtime.py \
            tests/test_product_v1_f5_application_actions.py \
            tests/test_product_v1_f5_mailbox_ingest.py \
            tests/test_product_v1_f5_mailbox_batch_preflight.py \
            tests/test_application_event_classifier.py

      - name: Run current mailbox-first schema proof read-only
        if: ${{ env.MODE == 'current' }}
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$RUNTIME_ENV_FILE"
          set +a
          export PGOPTIONS="-c default_transaction_read_only=on"
          "$RUNTIME_PYTHON" -m scripts.run_f5_mailbox_tracking_schema_qualification \
            --phase current \
            --source-sha "$SOURCE_SHA" \
            --output "$OUTPUT"
          "$RUNTIME_PYTHON" -m scripts.run_f5_application_tracking_product_proof \
            --source-sha "$SOURCE_SHA" \
            --output "$PRODUCT_OUTPUT"

      - name: Run exact-head real DB migration 113 preflight read-only
        if: ${{ env.MODE == 'preflight' }}
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$RUNTIME_ENV_FILE"
          set +a
          export PGOPTIONS="-c default_transaction_read_only=on"
          "$RUNTIME_PYTHON" -m scripts.run_f5_mailbox_tracking_schema_qualification \
            --phase preflight \
            --source-sha "$SOURCE_SHA" \
            --output "$OUTPUT"

      - name: Run candidate supersession migration 114 preflight read-only
        if: ${{ env.MODE == 'candidate_preflight' }}
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$RUNTIME_ENV_FILE"
          set +a
          export PGOPTIONS="-c default_transaction_read_only=on"
          "$RUNTIME_PYTHON" -m scripts.run_f5_candidate_supersession_schema_qualification \
            --phase preflight \
            --source-sha "$SOURCE_SHA" \
            --output "$CANDIDATE_OUTPUT"

      - name: Run real Product tracking proof read-only
        if: ${{ env.MODE == 'tracking' }}
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$RUNTIME_ENV_FILE"
          set +a
          export PGOPTIONS="-c default_transaction_read_only=on"
          "$RUNTIME_PYTHON" -m scripts.run_f5_application_tracking_product_proof \
            --source-sha "$SOURCE_SHA" \
            --output "$PRODUCT_OUTPUT"

      - name: Prove migration 113 apply authority is exact current main
        if: ${{ env.MODE == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch|issue_comment) ;;
            *) echo "F5_SCHEMA_APPLY_EVENT_NOT_AUTHORIZED=$GITHUB_EVENT_NAME" >&2; exit 3 ;;
          esac
          test "$APPROVAL_TOKEN" = "F5-MAILBOX-FIRST-MIGRATION-113"
          git fetch origin main --depth=1
          main_sha="$(git rev-parse FETCH_HEAD)"
          test "$SOURCE_SHA" = "$main_sha"
          echo "F5_SCHEMA_APPLY_AUTHORITY=PASS source=$SOURCE_SHA target=$TARGET_MIGRATION"

      - name: Apply exact mailbox-first migration 113
        if: ${{ env.MODE == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$RUNTIME_ENV_FILE"
          set +a
          unset PGOPTIONS
          "$RUNTIME_PYTHON" -m scripts.apply_db_migrations \
            --apply-exact "$TARGET_MIGRATION" \
            --require-sole-pending \
            --applied-by f5-mailbox-first-exact-workflow
          echo "F5_SCHEMA_EXACT_APPLY=PASS source=$SOURCE_SHA target=$TARGET_MIGRATION"

      - name: Prove migration 114 apply authority is exact current main
        if: ${{ env.MODE == 'candidate_apply' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch|issue_comment) ;;
            *) echo "F5_CANDIDATE_APPLY_EVENT_NOT_AUTHORIZED=$GITHUB_EVENT_NAME" >&2; exit 3 ;;
          esac
          test "$APPROVAL_TOKEN" = "F5-CANDIDATE-SUPERSESSION-MIGRATION-114"
          git fetch origin main --depth=1
          main_sha="$(git rev-parse FETCH_HEAD)"
          test "$SOURCE_SHA" = "$main_sha"
          echo "F5_CANDIDATE_APPLY_AUTHORITY=PASS source=$SOURCE_SHA target=$CANDIDATE_TARGET_MIGRATION"

      - name: Apply exact candidate supersession migration 114
        if: ${{ env.MODE == 'candidate_apply' }}
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$RUNTIME_ENV_FILE"
          set +a
          unset PGOPTIONS
          "$RUNTIME_PYTHON" -m scripts.apply_db_migrations \
            --apply-exact "$CANDIDATE_TARGET_MIGRATION" \
            --require-sole-pending \
            --applied-by f5-candidate-supersession-exact-workflow
          echo "F5_CANDIDATE_SCHEMA_EXACT_APPLY=PASS source=$SOURCE_SHA target=$CANDIDATE_TARGET_MIGRATION"

      - name: Prove migration 113 post-apply source is exact current main
        if: ${{ env.MODE == 'postapply' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch|issue_comment) ;;
            *) echo "F5_SCHEMA_POSTAPPLY_EVENT_NOT_AUTHORIZED=$GITHUB_EVENT_NAME" >&2; exit 3 ;;
          esac
          git fetch origin main --depth=1
          main_sha="$(git rev-parse FETCH_HEAD)"
          test "$SOURCE_SHA" = "$main_sha"
          echo "F5_SCHEMA_POSTAPPLY_SOURCE=PASS source=$SOURCE_SHA"

      - name: Run migration 113 post-apply real DB proof read-only
        if: ${{ env.MODE == 'postapply' }}
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$RUNTIME_ENV_FILE"
          set +a
          export PGOPTIONS="-c default_transaction_read_only=on"
          "$RUNTIME_PYTHON" -m scripts.run_f5_mailbox_tracking_schema_qualification \
            --phase postapply \
            --source-sha "$SOURCE_SHA" \
            --output "$OUTPUT"
          "$RUNTIME_PYTHON" -m scripts.run_f5_application_tracking_product_proof \
            --source-sha "$SOURCE_SHA" \
            --output "$PRODUCT_OUTPUT"

      - name: Prove migration 114 post-apply source is exact current main
        if: ${{ env.MODE == 'candidate_postapply' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch|issue_comment) ;;
            *) echo "F5_CANDIDATE_POSTAPPLY_EVENT_NOT_AUTHORIZED=$GITHUB_EVENT_NAME" >&2; exit 3 ;;
          esac
          git fetch origin main --depth=1
          main_sha="$(git rev-parse FETCH_HEAD)"
          test "$SOURCE_SHA" = "$main_sha"
          echo "F5_CANDIDATE_POSTAPPLY_SOURCE=PASS source=$SOURCE_SHA"

      - name: Run migration 114 post-apply real DB proof read-only
        if: ${{ env.MODE == 'candidate_postapply' }}
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$RUNTIME_ENV_FILE"
          set +a
          export PGOPTIONS="-c default_transaction_read_only=on"
          "$RUNTIME_PYTHON" -m scripts.run_f5_candidate_supersession_schema_qualification \
            --phase postapply \
            --source-sha "$SOURCE_SHA" \
            --output "$CANDIDATE_OUTPUT"
          "$RUNTIME_PYTHON" -m scripts.run_f5_application_tracking_product_proof \
            --source-sha "$SOURCE_SHA" \
            --output "$PRODUCT_OUTPUT"

      - name: Upload F5 lifecycle qualification evidence
        if: ${{ env.MODE != 'apply' && env.MODE != 'candidate_apply' }}
        uses: actions/upload-artifact@v4
        with:
          name: f5-application-lifecycle-${{ env.MODE }}-${{ env.SOURCE_SHA }}
          path: |
            ${{ env.OUTPUT }}
            ${{ env.PRODUCT_OUTPUT }}
            ${{ env.CANDIDATE_OUTPUT }}
          if-no-files-found: warn
          retention-days: 14
