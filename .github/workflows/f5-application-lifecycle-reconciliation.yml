name: F5 application lifecycle reconciliation

on:
  pull_request:
    paths:
      - ".github/workflows/f5-application-lifecycle-reconciliation.yml"
      - "scripts/run_f5_application_lifecycle_reconciliation.py"
      - "tests/test_f5_application_lifecycle_reconciliation.py"
      - "docs/current/REENTRY.md"
      - "docs/planning/active/F5-APPLICATION-LIFECYCLE-TRACKING.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f5-application-lifecycle-reconciliation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    name: Read-only real Product application lifecycle baseline
    if: ${{ vars.RCC_JAP_BLUE_ASSIGNMENT_FROZEN != 'true' }}
    runs-on: [self-hosted, Linux, X64, job-pipeline-runtime-linux]
    timeout-minutes: 30
    env:
      RCC_REPOSITORY_ID: "1230805345"
      RCC_REPOSITORY: jenshaberle-dotcom/job-application-pipeline
      RCC_RUNNER_NAME: job-pipeline-runtime-linux
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OUTPUT: /tmp/jap-f5-application-lifecycle-reconciliation.json

    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Resolve verified RCC runtime context
        shell: bash
        run: |
          set -euo pipefail
          context_file="${RCC_RUNTIME_CONTEXT_FILE:-$HOME/.config/DeepOceanInfrastructure/RCC/runtime-contexts/${RCC_REPOSITORY_ID}-${RCC_RUNNER_NAME}.json}"
          test -f "$context_file"
          context_output="$(python3 - "$context_file" "$RCC_REPOSITORY_ID" "$RCC_REPOSITORY" "$RCC_RUNNER_NAME" <<'PY'
          import json
          import sys
          from pathlib import PurePosixPath

          path, repo_id, repository, runner = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              context = json.load(handle)
          if context.get("RepositoryId") != int(repo_id):
              raise SystemExit("RUNTIME_REPOSITORY_ID_MISMATCH")
          if context.get("Repository") != repository:
              raise SystemExit("RUNTIME_REPOSITORY_MISMATCH")
          if context.get("RunnerName") != runner:
              raise SystemExit("RUNTIME_RUNNER_MISMATCH")
          if context.get("Platform") != "linux-wsl":
              raise SystemExit("RUNTIME_PLATFORM_MISMATCH")
          if context.get("Status") != "PASS" or context.get("PrimaryFailure") not in (None, ""):
              raise SystemExit("RUNTIME_CONTEXT_NOT_PASS")
          checks = {
              item.get("Id"): item.get("Status")
              for item in context.get("Checks", [])
              if isinstance(item, dict)
          }
          required = {
              "repository_identity", "checkout", "checkout_repository",
              "env_file", "env_keys", "interpreter", "interpreter_probe",
              "capability:postgresql",
          }
          failed = sorted(key for key in required if checks.get(key) != "PASS")
          if failed:
              raise SystemExit("RUNTIME_CHECKS_NOT_PASS:" + ",".join(failed))
          checkout = context.get("CheckoutRoot")
          interpreter = context.get("Interpreter")
          env_file = context.get("EnvFile")
          root = PurePosixPath(checkout)
          if root not in PurePosixPath(interpreter).parents:
              raise SystemExit("INTERPRETER_OUTSIDE_CHECKOUT")
          if root not in PurePosixPath(env_file).parents:
              raise SystemExit("ENV_OUTSIDE_CHECKOUT")
          print(interpreter)
          print(env_file)
          PY
          )"
          mapfile -t values <<< "$context_output"
          test "${#values[@]}" -eq 2
          printf 'RUNTIME_PYTHON=%s\n' "${values[0]}" >> "$GITHUB_ENV"
          printf 'RUNTIME_ENV_FILE=%s\n' "${values[1]}" >> "$GITHUB_ENV"
          echo "RCC_CONTEXT=PASS runner=${RUNNER_NAME}"

      - name: Qualify focused provider-free contracts
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" -m py_compile scripts/run_f5_application_lifecycle_reconciliation.py
          "$RUNTIME_PYTHON" -m pytest -q tests/test_f5_application_lifecycle_reconciliation.py
          "$RUNTIME_PYTHON" -m ruff check \
            scripts/run_f5_application_lifecycle_reconciliation.py \
            tests/test_f5_application_lifecycle_reconciliation.py

      - name: Run exact-head real DB reconciliation read-only
        shell: bash
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1090
          source "$RUNTIME_ENV_FILE"
          set +a
          export PGOPTIONS="-c default_transaction_read_only=on"
          "$RUNTIME_PYTHON" -m scripts.run_f5_application_lifecycle_reconciliation \
            --source-sha "$SOURCE_SHA" \
            --output "$OUTPUT"

      - name: Verify F5 truth and side-effect boundary
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" - "$OUTPUT" "$SOURCE_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_sha = sys.argv[2]
          if report.get("source_sha") != expected_sha:
              raise SystemExit("F5_SOURCE_SHA_MISMATCH")
          if report.get("authority") != "diagnostic_only_no_application_lifecycle_mutation":
              raise SystemExit("F5_AUTHORITY_BOUNDARY_MISMATCH")

          findings = report.get("authority_findings") or {}
          if findings.get("draft_request_is_submission_authority") is not False:
              raise SystemExit("F5_DRAFT_PROMOTED_TO_SUBMISSION_AUTHORITY")
          if findings.get("draft_or_operator_approval_implies_submitted") is not False:
              raise SystemExit("F5_APPROVAL_PROMOTED_TO_SUBMITTED")
          if findings.get("relation_name_alone_creates_lifecycle_authority") is not False:
              raise SystemExit("F5_RELATION_NAME_PROMOTED_TO_AUTHORITY")
          if findings.get("gmail_evidence_is_application_state_authority") is not False:
              raise SystemExit("F5_GMAIL_PROMOTED_TO_APPLICATION_AUTHORITY")

          boundaries = report.get("boundaries") or {}
          expected = {
              "db_writes": 0,
              "provider_calls": 0,
              "network_probes": 0,
              "gmail_reads": 0,
              "email_actions": 0,
              "application_submission_actions": 0,
              "application_state_mutations": 0,
              "ranking_authority_changed": False,
              "top5_authority_changed": False,
          }
          for key, value in expected.items():
              if boundaries.get(key) != value:
                  raise SystemExit(f"F5_BOUNDARY_MISMATCH:{key}={boundaries.get(key)!r}")

          summary = report.get("summary") or {}
          print(f"F5_REAL_DB_RELATIONS={summary.get('application_relation_count')}")
          print(f"F5_REAL_DB_DRAFTS={summary.get('application_draft_request_count')}")
          print(f"F5_REAL_DB_DRAFT_JOBS={summary.get('application_draft_distinct_job_count')}")
          print(f"F5_REAL_DB_DRAFT_STATUSES={json.dumps(summary.get('application_draft_status_counts') or {}, sort_keys=True)}")
          print(f"F5_REAL_DB_POST_SUBMIT_CANDIDATE_RELATIONS={summary.get('post_submit_candidate_relation_count')}")
          print("F5_READ_ONLY_BOUNDARY=PASS")
          PY

      - name: Upload F5 reconciliation evidence
        uses: actions/upload-artifact@v4
        with:
          name: f5-application-lifecycle-reconciliation-${{ env.SOURCE_SHA }}
          path: ${{ env.OUTPUT }}
          if-no-files-found: error
          retention-days: 14
