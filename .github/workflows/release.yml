name: Release Management

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version, with or without leading v (for example 0.1.0-demo.1)"
        required: true
        type: string
      release_name:
        description: "Optional human-readable release title"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Publish as GitHub pre-release"
        required: true
        default: true
        type: boolean
      notes_file:
        description: "Optional repository-relative curated notes file; blank uses GitHub generated notes"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-management
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION_INPUT: ${{ inputs.version }}
      RELEASE_NAME_INPUT: ${{ inputs.release_name }}
      RELEASE_NOTES_FILE_INPUT: ${{ inputs.notes_file }}
      RELEASE_PRERELEASE_INPUT: ${{ inputs.prerelease }}

    steps:
      - name: Require main release authority
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Releases must be dispatched from main; got ${GITHUB_REF_NAME}" >&2
            exit 2
          fi

      - name: Check out exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate version and target
        id: release
        shell: bash
        run: |
          set -euo pipefail

          raw="$RELEASE_VERSION_INPUT"
          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid SemVer-compatible version: $raw" >&2
            exit 3
          fi

          tag="v${version}"
          target_sha="$(git rev-parse HEAD)"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag already exists: ${tag}" >&2
            exit 4
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "target_sha=${target_sha}" >> "$GITHUB_OUTPUT"

      - name: Require green main quality gates
        shell: bash
        env:
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
        run: |
          set -euo pipefail

          require_successful_push_run() {
            local workflow="$1"
            local runs
            local status
            local conclusion
            local run_id

            runs="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$workflow" \
              --commit "$TARGET_SHA" \
              --event push \
              --limit 1 \
              --json databaseId,status,conclusion)"

            run_id="$(jq -r '.[0].databaseId // empty' <<<"$runs")"
            status="$(jq -r '.[0].status // empty' <<<"$runs")"
            conclusion="$(jq -r '.[0].conclusion // empty' <<<"$runs")"

            if [[ -z "$run_id" ]]; then
              echo "No push workflow run found for '$workflow' at $TARGET_SHA" >&2
              exit 8
            fi
            if [[ "$status" != "completed" || "$conclusion" != "success" ]]; then
              echo "Release gate '$workflow' is not green: run=$run_id status=$status conclusion=$conclusion" >&2
              exit 9
            fi

            echo "RELEASE_GATE=$workflow|run=$run_id|PASS"
          }

          require_successful_push_run "Pipeline CI"
          require_successful_push_run "Pipeline re-entry target identity"

      - name: Prepare release notes
        id: notes
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
        run: |
          set -euo pipefail

          notes_file="$RELEASE_NOTES_FILE_INPUT"
          output="${RUNNER_TEMP}/release-notes.md"

          if [[ -n "$notes_file" ]]; then
            if [[ "$notes_file" = /* || "$notes_file" == *".."* ]]; then
              echo "notes_file must be a repository-relative safe path" >&2
              exit 5
            fi
            if [[ ! -f "$notes_file" ]]; then
              echo "Curated release notes not found: $notes_file" >&2
              exit 6
            fi
            cp "$notes_file" "$output"
            source="curated:${notes_file}"
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f "tag_name=${TAG}" \
              -f "target_commitish=${TARGET_SHA}" \
              --jq '.body' > "$output"
            source="github-generated"
          fi

          if [[ ! -s "$output" ]]; then
            echo "Release notes are empty" >&2
            exit 7
          fi

          echo "path=${output}" >> "$GITHUB_OUTPUT"
          echo "source=${source}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
          NOTES_PATH: ${{ steps.notes.outputs.path }}
        run: |
          set -euo pipefail

          title="$RELEASE_NAME_INPUT"
          if [[ -z "$title" ]]; then
            title="Job Application Pipeline ${TAG}"
          fi

          prerelease_args=()
          if [[ "$RELEASE_PRERELEASE_INPUT" == "true" ]]; then
            prerelease_args+=(--prerelease)
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "$title" \
            --notes-file "$NOTES_PATH" \
            "${prerelease_args[@]}"

      - name: Publish release summary
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
          NOTES_SOURCE: ${{ steps.notes.outputs.source }}
        run: |
          set -euo pipefail
          {
            echo "## Release published"
            echo
            echo "- Tag: \`${TAG}\`"
            echo "- Target: \`${TARGET_SHA}\`"
            echo "- Notes: \`${NOTES_SOURCE}\`"
            echo "- Pre-release: \`${RELEASE_PRERELEASE_INPUT}\`"
          } >> "$GITHUB_STEP_SUMMARY"
