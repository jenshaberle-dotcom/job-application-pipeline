name: F4A one-shot integration patch

on:
  push:
    branches: [agent/f4a-profile-fit-coverage-v2]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/f4a-profile-fit-coverage-v2
          fetch-depth: 0

      - name: Apply exact F4A integration edits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"PATCH_ANCHOR_MISMATCH:{path}:{count}:{old[:80]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Product payload: calculate F4A coverage before the independent review-fit preview.
          replace_once(
              "src/search_intelligence/product_v1_service.py",
              "from src.search_intelligence.product_v1_review_fit import enrich_review_fit\n",
              "from src.search_intelligence.product_v1_profile_fit_coverage import (\n"
              "    INSUFFICIENT_EVIDENCE,\n"
              "    PROFILE_FIT_COMPLETE,\n"
              "    enrich_profile_fit_coverage,\n"
              ")\n"
              "from src.search_intelligence.product_v1_review_fit import enrich_review_fit\n",
          )
          replace_once(
              "src/search_intelligence/product_v1_service.py",
              "def _display_job(row: Mapping[str, Any]) -> dict[str, Any]:\n"
              "    \"\"\"Add a non-authoritative display fit without mutating Product ranking truth.\"\"\"\n"
              "    enriched = enrich_review_fit(row)\n",
              "def _display_job(\n"
              "    row: Mapping[str, Any],\n"
              "    *,\n"
              "    profile_fit_preference_tags: Sequence[str] = (),\n"
              ") -> dict[str, Any]:\n"
              "    \"\"\"Add F4A coverage and the independent non-authoritative review preview.\"\"\"\n"
              "    enriched = enrich_profile_fit_coverage(\n"
              "        row, candidate_preference_tags=profile_fit_preference_tags\n"
              "    )\n"
              "    enriched = enrich_review_fit(enriched)\n",
          )
          replace_once(
              "src/search_intelligence/product_v1_service.py",
              "    observed_opportunities: Sequence[Mapping[str, Any]] = (),\n) -> dict[str, Any]:\n",
              "    observed_opportunities: Sequence[Mapping[str, Any]] = (),\n"
              "    profile_fit_preference_tags: Sequence[str] = (),\n"
              ") -> dict[str, Any]:\n",
          )
          replace_once(
              "src/search_intelligence/product_v1_service.py",
              "    safe_top_jobs = list(top_jobs) if lifecycle_contract_ready else []\n"
              "    safe_application_readiness = (\n"
              "        list(application_readiness) if lifecycle_contract_ready else []\n"
              "    )\n"
              "    display_job_readiness = [_display_job(job) for job in job_readiness]\n"
              "    payload = {\n",
              "    safe_top_jobs = (\n"
              "        [\n"
              "            _display_job(job, profile_fit_preference_tags=profile_fit_preference_tags)\n"
              "            for job in top_jobs\n"
              "        ]\n"
              "        if lifecycle_contract_ready\n"
              "        else []\n"
              "    )\n"
              "    safe_application_readiness = (\n"
              "        list(application_readiness) if lifecycle_contract_ready else []\n"
              "    )\n"
              "    display_job_readiness = [\n"
              "        _display_job(job, profile_fit_preference_tags=profile_fit_preference_tags)\n"
              "        for job in job_readiness\n"
              "    ]\n"
              "    current_profile_fit_rows = [\n"
              "        job\n"
              "        for job in display_job_readiness\n"
              "        if _value(job, \"lifecycle_status\") == \"active_confirmed\"\n"
              "    ]\n"
              "    profile_fit_complete_count = sum(\n"
              "        1\n"
              "        for job in current_profile_fit_rows\n"
              "        if _value(job, \"profile_fit_coverage_status\") == PROFILE_FIT_COMPLETE\n"
              "    )\n"
              "    profile_fit_insufficient_evidence_count = sum(\n"
              "        1\n"
              "        for job in current_profile_fit_rows\n"
              "        if _value(job, \"profile_fit_coverage_status\") == INSUFFICIENT_EVIDENCE\n"
              "    )\n"
              "    profile_fit_unclassified_count = (\n"
              "        len(current_profile_fit_rows)\n"
              "        - profile_fit_complete_count\n"
              "        - profile_fit_insufficient_evidence_count\n"
              "    )\n"
              "    payload = {\n",
          )
          replace_once(
              "src/search_intelligence/product_v1_service.py",
              "            \"current_active_job_count\": lifecycle_counts[\"active_confirmed\"],\n"
              "            \"stale_job_count\": lifecycle_counts[\"stale_needs_refresh\"],\n",
              "            \"current_active_job_count\": lifecycle_counts[\"active_confirmed\"],\n"
              "            \"profile_fit_complete_count\": profile_fit_complete_count,\n"
              "            \"profile_fit_insufficient_evidence_count\": (\n"
              "                profile_fit_insufficient_evidence_count\n"
              "            ),\n"
              "            \"profile_fit_unclassified_count\": profile_fit_unclassified_count,\n"
              "            \"stale_job_count\": lifecycle_counts[\"stale_needs_refresh\"],\n",
          )
          replace_once(
              "src/search_intelligence/product_v1_service.py",
              "            \"review_fit_preview_is_not_ranking_authority\": True,\n",
              "            \"review_fit_preview_is_not_ranking_authority\": True,\n"
              "            \"profile_fit_coverage_is_not_ranking_authority\": True,\n"
              "            \"profile_fit_missing_evidence_is_not_negative_fit\": True,\n",
          )

          # DB-backed Product loader: project only exact-review status and structured
          # approved preference tags; no Candidate Fact statement/provenance leaves DB.
          replace_once(
              "scripts/product_v1_control_center_base.py",
              "def _string_tuple(value: object) -> tuple[str, ...]:\n"
              "    if isinstance(value, (list, tuple)):\n"
              "        return tuple(str(item) for item in value)\n"
              "    return ()\n\n\n",
              "def _string_tuple(value: object) -> tuple[str, ...]:\n"
              "    if isinstance(value, (list, tuple)):\n"
              "        return tuple(str(item) for item in value)\n"
              "    return ()\n\n\n"
              "def _load_profile_fit_preference_tags(\n"
              "    conn: psycopg.Connection[object],\n"
              ") -> tuple[str, ...]:\n"
              "    if not _relation_exists(conn, \"candidate_fact_profiles\") or not _relation_exists(\n"
              "        conn, \"candidate_facts\"\n"
              "    ):\n"
              "        return ()\n"
              "    rows = _fetch_all(\n"
              "        conn,\n"
              "        \"\"\"\n"
              "        SELECT DISTINCT lower(btrim(tag.value)) AS tag\n"
              "        FROM candidate_fact_profiles profile\n"
              "        JOIN candidate_facts fact\n"
              "          ON fact.profile_key = profile.profile_key\n"
              "        CROSS JOIN LATERAL jsonb_array_elements_text(fact.capability_tags) tag(value)\n"
              "        WHERE profile.profile_key = 'default'\n"
              "          AND profile.status = 'approved'\n"
              "          AND fact.approval_status = 'approved'\n"
              "          AND fact.evidence_class = 'operator_preference'\n"
              "          AND fact.category IN ('preference', 'boundary')\n"
              "          AND (fact.valid_from IS NULL OR fact.valid_from <= current_date)\n"
              "          AND (fact.valid_until IS NULL OR fact.valid_until >= current_date)\n"
              "          AND lower(btrim(tag.value)) LIKE 'profile-fit.%'\n"
              "        ORDER BY tag\n"
              "        \"\"\",\n"
              "    )\n"
              "    return tuple(str(row[\"tag\"]) for row in rows if row.get(\"tag\"))\n\n\n",
          )
          replace_once(
              "scripts/product_v1_control_center_base.py",
              "        job_readiness = _fetch_all(\n"
              "            conn,\n"
              "            \"\"\"\n"
              "            SELECT *\n"
              "            FROM gold_product_v1_job_readiness\n"
              "            ORDER BY\n",
              "        job_readiness = _fetch_all(\n"
              "            conn,\n"
              "            \"\"\"\n"
              "            SELECT\n"
              "                readiness.*,\n"
              "                capability_review.decision\n"
              "                    AS profile_fit_capability_review_decision,\n"
              "                CASE\n"
              "                    WHEN candidate_profile.status = 'approved'\n"
              "                     AND assessment.silver_job_id IS NOT NULL\n"
              "                     AND capability_review.status = 'active'\n"
              "                     AND capability_review.candidate_profile_sha256\n"
              "                         = candidate_profile.payload_sha256\n"
              "                     AND capability_review.assessment_updated_at\n"
              "                         = assessment.updated_at\n"
              "                     AND capability_review.assessment_detail_sha256\n"
              "                         = coalesce(\n"
              "                             assessment.ranking_factors\n"
              "                                 ->> 'detail_description_sha256',\n"
              "                             ''\n"
              "                         )\n"
              "                     AND assessment.capability_fit_status\n"
              "                         = capability_review.decision\n"
              "                     AND jsonb_array_length(\n"
              "                         capability_review.referenced_fact_keys\n"
              "                     ) > 0\n"
              "                     AND NOT EXISTS (\n"
              "                         SELECT 1\n"
              "                         FROM jsonb_array_elements_text(\n"
              "                             capability_review.referenced_fact_keys\n"
              "                         ) wanted(fact_key)\n"
              "                         LEFT JOIN candidate_facts fact\n"
              "                           ON fact.profile_key = 'default'\n"
              "                          AND fact.fact_key = wanted.fact_key\n"
              "                          AND fact.approval_status = 'approved'\n"
              "                          AND fact.evidence_class IN (\n"
              "                              'professional_employment',\n"
              "                              'formal_education',\n"
              "                              'portfolio_implementation',\n"
              "                              'training_certification'\n"
              "                          )\n"
              "                          AND (fact.valid_from IS NULL OR fact.valid_from <= current_date)\n"
              "                          AND (fact.valid_until IS NULL OR fact.valid_until >= current_date)\n"
              "                         WHERE fact.fact_key IS NULL\n"
              "                     )\n"
              "                    THEN TRUE\n"
              "                    ELSE FALSE\n"
              "                END AS profile_fit_capability_review_exact\n"
              "            FROM gold_product_v1_job_readiness readiness\n"
              "            LEFT JOIN job_product_assessments assessment\n"
              "              ON assessment.silver_job_id = readiness.silver_job_id\n"
              "            LEFT JOIN candidate_fact_profiles candidate_profile\n"
              "              ON candidate_profile.profile_key = 'default'\n"
              "            LEFT JOIN product_v1_capability_fit_reviews capability_review\n"
              "              ON capability_review.silver_job_id = readiness.silver_job_id\n"
              "             AND capability_review.status = 'active'\n"
              "            ORDER BY\n",
          )
          replace_once(
              "scripts/product_v1_control_center_base.py",
              "        ranking_policy = _fetch_one(\n",
              "        profile_fit_preference_tags = _load_profile_fit_preference_tags(conn)\n"
              "        ranking_policy = _fetch_one(\n",
          )
          replace_once(
              "scripts/product_v1_control_center_base.py",
              "        source_connector_overview=source_connector_overview,\n"
              "    )\n\n\nclass ProductV1Handler",
              "        source_connector_overview=source_connector_overview,\n"
              "        profile_fit_preference_tags=profile_fit_preference_tags,\n"
              "    )\n\n\nclass ProductV1Handler",
          )

          # Operator UI: expose the F4A truth separately from Product gate/ranking.
          replace_once(
              "frontend/control-center/src/OperatorWorkspace.tsx",
              "  uncertainties?: string[];\n  review_label?: JobReviewLabelState | null;\n",
              "  uncertainties?: string[];\n"
              "  profile_fit_coverage_status?: string;\n"
              "  profile_fit_decision?: string;\n"
              "  profile_fit_reason?: string;\n"
              "  profile_fit_factors?: Record<string, { status: string; reason: string }>;\n"
              "  profile_fit_missing_factors?: string[];\n"
              "  profile_fit_failed_factors?: string[];\n"
              "  review_label?: JobReviewLabelState | null;\n",
          )
          replace_once(
              "frontend/control-center/src/OperatorWorkspace.tsx",
              "    current_active_job_count: number;\n    review_scope_current_active_job_count?: number;\n",
              "    current_active_job_count: number;\n"
              "    review_scope_current_active_job_count?: number;\n"
              "    profile_fit_complete_count?: number;\n"
              "    profile_fit_insufficient_evidence_count?: number;\n"
              "    profile_fit_unclassified_count?: number;\n",
          )
          replace_once(
              "frontend/control-center/src/OperatorWorkspace.tsx",
              "  if ([\"rankable\", \"active\", \"active confirmed\", \"active_confirmed\", \"approved\", \"interesting\", \"passed\"].includes(normalized) || normalized.startsWith(\"active_last_run_\")) return \"good\";\n"
              "  if (normalized.includes(\"failed\") || normalized.includes(\"blocked\") || normalized === \"not_relevant\") return \"bad\";\n"
              "  if (normalized.includes(\"required\") || normalized.includes(\"unknown\") || normalized.includes(\"stale\") || normalized === \"unsure\") return \"warn\";\n",
              "  if ([\"rankable\", \"active\", \"active confirmed\", \"active_confirmed\", \"approved\", \"interesting\", \"passed\", \"profile_fit_complete\"].includes(normalized) || normalized.startsWith(\"active_last_run_\")) return \"good\";\n"
              "  if (normalized.includes(\"failed\") || normalized.includes(\"blocked\") || normalized === \"not_relevant\") return \"bad\";\n"
              "  if (normalized.includes(\"required\") || normalized.includes(\"unknown\") || normalized.includes(\"stale\") || normalized.includes(\"insufficient\") || normalized === \"unsure\") return \"warn\";\n",
          )
          replace_once(
              "frontend/control-center/src/OperatorWorkspace.tsx",
              "      <Metric labelText=\"Current jobs\" value={currentJobs.length} helper=\"confirmed active employer-origin vacancies\" />\n"
              "      <Metric labelText=\"Rankable\" value={payload.summary.rankable_job_count} helper=\"hard gates passed\" />\n",
              "      <Metric labelText=\"Current jobs\" value={currentJobs.length} helper=\"confirmed active employer-origin vacancies\" />\n"
              "      <Metric labelText=\"Profile Fit complete\" value={payload.summary.profile_fit_complete_count ?? 0} helper=\"conclusive evidence-backed fit decisions\" />\n"
              "      <Metric labelText=\"Needs fit evidence\" value={payload.summary.profile_fit_insufficient_evidence_count ?? 0} helper=\"missing evidence, never negative fit\" />\n"
              "      <Metric labelText=\"Rankable\" value={payload.summary.rankable_job_count} helper=\"existing Product gate; F4B remains separate\" />\n",
          )
          replace_once(
              "frontend/control-center/src/OperatorWorkspace.tsx",
              "<div className=\"ow-fit-line\"><b>{scoreText(top.overall_quality_score)}</b><span>authoritative profile fit</span></div>",
              "<div className=\"ow-fit-line\"><b>{scoreText(top.overall_quality_score)}</b><span>authoritative Product score</span></div>",
          )
          replace_once(
              "frontend/control-center/src/OperatorWorkspace.tsx",
              "  const rankable = isRankable(job);\n  const scoreRows = rankable\n",
              "  const rankable = isRankable(job);\n"
              "  const profileFitFactors = job.profile_fit_factors || {};\n"
              "  const profileFitFactorRows = [\n"
              "    [\"Geography / work model / commute\", profileFitFactors.geography_work_model_commute?.status],\n"
              "    [\"Skills / capabilities\", profileFitFactors.skills_capabilities?.status],\n"
              "    [\"Seniority\", profileFitFactors.seniority?.status],\n"
              "    [\"Hard requirements\", profileFitFactors.hard_requirements?.status],\n"
              "  ] as Array<[string, string | undefined]>;\n"
              "  const scoreRows = rankable\n",
          )
          replace_once(
              "frontend/control-center/src/OperatorWorkspace.tsx",
              "    <JobReviewLabelControls silverJobId={job.silver_job_id} currentLabel={job.review_label} captureAvailable={payload.review_label_capture?.available === true} refreshProductTruth={refresh} />\n"
              "    <section className=\"ow-score-card\"><h3>{rankable ? \"Profile fit\" : \"Role affinity · preliminary\"}</h3>",
              "    <JobReviewLabelControls silverJobId={job.silver_job_id} currentLabel={job.review_label} captureAvailable={payload.review_label_capture?.available === true} refreshProductTruth={refresh} />\n"
              "    <section className=\"ow-facts\"><div><span>Profile Fit coverage</span><Status value={job.profile_fit_coverage_status || \"insufficient_evidence\"} /></div><div><span>Profile Fit decision</span><Status value={job.profile_fit_decision || \"unknown\"} /></div>{profileFitFactorRows.map(([name, value]) => <div key={name}><span>{name}</span><Status value={value || \"unknown\"} /></div>)}</section>\n"
              "    <section className=\"ow-score-card\"><h3>{rankable ? \"Product score\" : \"Role affinity · preliminary\"}</h3>",
          )
          replace_once(
              "frontend/control-center/src/OperatorWorkspace.tsx",
              "            <strong title={isRankable(job) ? \"Authoritative Profile Fit\" : \"Preliminary role affinity · detail check required\"}>{scoreText(job.overall_quality_score)}</strong>\n",
              "            <strong title={isRankable(job) ? \"Authoritative Product score\" : \"Preliminary role affinity · detail check required\"}>{scoreText(job.overall_quality_score)}</strong>\n",
          )
          replace_once(
              "frontend/control-center/src/OperatorWorkspace.tsx",
              "            <Status value={job.product_readiness_status} />\n",
              "            <span><Status value={job.profile_fit_coverage_status || \"insufficient_evidence\"} /><Status value={job.product_readiness_status} /></span>\n",
          )
          replace_once(
              "frontend/control-center/src/OperatorWorkspace.tsx",
              "{top && <p>{employerName(top)} · {locationText(top)} · {scoreText(top.overall_quality_score)} authoritative fit</p>}",
              "{top && <p>{employerName(top)} · {locationText(top)} · {scoreText(top.overall_quality_score)} authoritative Product score</p>}",
          )

          # The temporary workflow removes itself in the same commit.
          Path(".github/workflows/f4a-apply-integration-patch.yml").unlink()
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "feat(f4a): integrate profile fit coverage into Product UI"
          git push origin HEAD:agent/f4a-profile-fit-coverage-v2
