name: F4B read-only current cohort reconciliation

on:
  push:
    branches: [agent/f4b-readonly-cohort]
    paths:
      - scripts/run_f4b_cohort_reconciliation.py
      - scripts/run_f4b_operator_gate_packet.py
      - scripts/run_f4b_affinity_reconciliation.py
      - tests/test_f4b_cohort_reconciliation.py
      - tests/test_f4b_operator_gate_packet.py
      - tests/test_f4b_affinity_reconciliation.py
      - docs/planning/active/F4B-CURRENT-COHORT-BASELINE.md
      - .github/workflows/f4b-readonly-cohort.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f4b-readonly-cohort-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    name: Read current Product cohort without provider or DB writes
    runs-on: [self-hosted, Linux, X64, job-pipeline-runtime-linux]
    timeout-minutes: 30
    env:
      RCC_REPOSITORY_ID: "1230805345"
      RCC_REPOSITORY: jenshaberle-dotcom/job-application-pipeline
      RCC_RUNNER_NAME: job-pipeline-runtime-linux
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind verified runtime and masked DB environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          context_file="${RCC_RUNTIME_CONTEXT_FILE:-$HOME/.config/DeepOceanInfrastructure/RCC/runtime-contexts/${RCC_REPOSITORY_ID}-${RCC_RUNNER_NAME}.json}"
          mapfile -t ctx < <(python3 - "$context_file" "$RCC_REPOSITORY_ID" "$RCC_REPOSITORY" "$RCC_RUNNER_NAME" <<'PY'
          import json, sys
          from pathlib import PurePosixPath
          path, repo_id, repository, runner = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              context = json.load(handle)
          if context.get("RepositoryId") != int(repo_id) or context.get("Repository") != repository or context.get("RunnerName") != runner:
              raise SystemExit("RUNTIME_CONTEXT_IDENTITY_MISMATCH")
          if context.get("Status") != "PASS" or context.get("PrimaryFailure") not in (None, ""):
              raise SystemExit("RUNTIME_CONTEXT_NOT_PASS")
          root = PurePosixPath(context["CheckoutRoot"])
          if root not in PurePosixPath(context["Interpreter"]).parents or root not in PurePosixPath(context["EnvFile"]).parents:
              raise SystemExit("RUNTIME_CONTEXT_PATH_MISMATCH")
          print(context["Interpreter"])
          print(context["EnvFile"])
          PY
          )
          test "${#ctx[@]}" -eq 2
          runtime_python="${ctx[0]}"
          runtime_env_file="${ctx[1]}"
          "$runtime_python" - "$runtime_env_file" "$GITHUB_ENV" <<'PY'
          import secrets, sys
          from pathlib import Path
          from dotenv import dotenv_values
          values = dotenv_values(Path(sys.argv[1]))
          required = ("POSTGRES_HOST", "POSTGRES_PORT", "POSTGRES_DB", "POSTGRES_USER", "POSTGRES_PASSWORD")
          if any(values.get(key) in (None, "") for key in required):
              raise SystemExit("RUNTIME_ENV_POSTGRES_KEYS_MISSING")
          print(f"::add-mask::{values['POSTGRES_PASSWORD']}")
          with Path(sys.argv[2]).open("a", encoding="utf-8") as handle:
              for key in required:
                  marker = f"JAP_ENV_{secrets.token_hex(12)}"
                  handle.write(f"{key}<<{marker}\n{values[key]}\n{marker}\n")
          PY
          echo "RUNTIME_PYTHON=$runtime_python" >> "$GITHUB_ENV"
      - name: Requalify focused contracts
        shell: bash
        run: |
          set -euo pipefail
          site="$(bash scripts/ensure_pinned_local_oss_runtime.sh "$RUNTIME_PYTHON" requirements.txt "$RUNNER_TEMP/jap-f4b-local-oss-sites")"
          test -d "$site"
          echo "PYTHONPATH=$site:${PYTHONPATH:-}" >> "$GITHUB_ENV"
          "$RUNTIME_PYTHON" -m pytest -q \
            tests/test_f4b_cohort_reconciliation.py \
            tests/test_f4b_operator_gate_packet.py \
            tests/test_f4b_affinity_reconciliation.py
          "$RUNTIME_PYTHON" -m ruff check \
            scripts/run_f4b_cohort_reconciliation.py \
            scripts/run_f4b_operator_gate_packet.py \
            scripts/run_f4b_affinity_reconciliation.py \
            tests/test_f4b_cohort_reconciliation.py \
            tests/test_f4b_operator_gate_packet.py \
            tests/test_f4b_affinity_reconciliation.py
      - name: Reconcile exact current Product state
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" -m scripts.run_f4b_cohort_reconciliation \
            --source-sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/f4b_current_cohort.json"
      - name: Build privacy-bounded operator decision packet
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" -m scripts.run_f4b_operator_gate_packet \
            --source-sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/f4b_operator_gate_packet.json"
      - name: Reconcile legacy Affinity independent of Fit gates
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" -m scripts.run_f4b_affinity_reconciliation \
            --source-sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/f4b_affinity_reconciliation.json"
      - name: Preserve bounded read-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: f4b-readonly-cohort-${{ github.sha }}
          path: |
            ${{ runner.temp }}/f4b_current_cohort.json
            ${{ runner.temp }}/f4b_operator_gate_packet.json
            ${{ runner.temp }}/f4b_affinity_reconciliation.json
          if-no-files-found: error
          retention-days: 1
