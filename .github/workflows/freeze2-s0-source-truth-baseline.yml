name: Freeze-II S0 source truth baseline

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: freeze2-s0-source-truth-baseline
  cancel-in-progress: false

jobs:
  baseline:
    name: Read-only current source truth baseline
    if: >-
      ${{ vars.RCC_JAP_BLUE_ASSIGNMENT_FROZEN != 'true' &&
          (
            (github.event_name == 'workflow_dispatch' &&
             github.ref == 'refs/heads/main') ||
            (github.event_name == 'issue_comment' &&
             github.event.issue.number == 1038 &&
             github.event.comment.user.login == 'jenshaberle-dotcom' &&
             github.event.comment.author_association == 'OWNER' &&
             startsWith(github.event.comment.body, '<!-- jap-freeze2-s0:run:v1 -->'))
          ) }}
    runs-on: [self-hosted, Linux, X64, job-pipeline-runtime-linux]
    timeout-minutes: 120
    env:
      RCC_REPOSITORY_ID: "1230805345"
      RCC_REPOSITORY: jenshaberle-dotcom/job-application-pipeline
      RCC_RUNNER_NAME: job-pipeline-runtime-linux
      S0_ROOT: /tmp/jap-freeze2-s0
      S0_OUTPUT: /tmp/jap-freeze2-s0/freeze2-s0-summary.json

    steps:
      - name: Check out exact main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve verified RCC runtime context
        shell: bash
        run: |
          set -euo pipefail
          context_file="${RCC_RUNTIME_CONTEXT_FILE:-$HOME/.config/DeepOceanInfrastructure/RCC/runtime-contexts/${RCC_REPOSITORY_ID}-${RCC_RUNNER_NAME}.json}"
          test -f "$context_file"
          context_output="$(python3 - "$context_file" "$RCC_REPOSITORY_ID" "$RCC_REPOSITORY" "$RCC_RUNNER_NAME" <<'PY'
          import json
          import sys
          from pathlib import PurePosixPath

          path, repo_id, repository, runner = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              context = json.load(handle)
          if context.get("RepositoryId") != int(repo_id):
              raise SystemExit("RUNTIME_REPOSITORY_ID_MISMATCH")
          if context.get("Repository") != repository:
              raise SystemExit("RUNTIME_REPOSITORY_MISMATCH")
          if context.get("RunnerName") != runner:
              raise SystemExit("RUNTIME_RUNNER_MISMATCH")
          if context.get("Platform") != "linux-wsl":
              raise SystemExit("RUNTIME_PLATFORM_MISMATCH")
          if context.get("Status") != "PASS" or context.get("PrimaryFailure") not in (None, ""):
              raise SystemExit("RUNTIME_CONTEXT_NOT_PASS")
          checks = {
              item.get("Id"): item.get("Status")
              for item in context.get("Checks", [])
              if isinstance(item, dict)
          }
          required = {
              "repository_identity",
              "checkout",
              "checkout_repository",
              "env_file",
              "env_keys",
              "interpreter",
              "interpreter_probe",
              "capability:postgresql",
          }
          failed = sorted(key for key in required if checks.get(key) != "PASS")
          if failed:
              raise SystemExit("RUNTIME_CHECKS_NOT_PASS:" + ",".join(failed))
          checkout = context.get("CheckoutRoot")
          interpreter = context.get("Interpreter")
          env_file = context.get("EnvFile")
          root = PurePosixPath(checkout)
          if root not in PurePosixPath(interpreter).parents:
              raise SystemExit("INTERPRETER_OUTSIDE_CHECKOUT")
          if root not in PurePosixPath(env_file).parents:
              raise SystemExit("ENV_OUTSIDE_CHECKOUT")
          print(interpreter)
          print(env_file)
          PY
          )"
          mapfile -t values <<< "$context_output"
          test "${#values[@]}" -eq 2
          printf 'RUNTIME_PYTHON=%s\n' "${values[0]}" >> "$GITHUB_ENV"
          printf 'RUNTIME_ENV_FILE=%s\n' "${values[1]}" >> "$GITHUB_ENV"
          echo "RCC_CONTEXT=PASS runner=${RUNNER_NAME}"

      - name: Provision pinned local OSS detail extractors
        shell: bash
        run: |
          set -euo pipefail
          local_oss_site="$RUNNER_TEMP/jap-freeze2-s0-local-oss"
          rm -rf "$local_oss_site"
          "$RUNTIME_PYTHON" -m pip install             --disable-pip-version-check             --no-input             --target "$local_oss_site"             'extruct==0.18.0'             'trafilatura==2.2.0'
          printf 'PYTHONPATH=%s:%s\n' "$local_oss_site" "${PYTHONPATH:-}" >> "$GITHUB_ENV"

      - name: Qualify S0 contracts
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" -m pytest -q             tests/test_freeze2_s0_source_truth_baseline.py             tests/test_f4a_r3_bronze2e_requirement_audit.py             tests/test_deterministic_connector_builder.py
          "$RUNTIME_PYTHON" -m ruff check             scripts/run_freeze2_s0_source_truth_baseline.py             tests/test_freeze2_s0_source_truth_baseline.py

      - name: Run exact-main S0 baseline read-only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$S0_ROOT"
          mkdir -p "$S0_ROOT"
          set -a
          # shellcheck disable=SC1090
          source "$RUNTIME_ENV_FILE"
          set +a
          export PGOPTIONS="-c default_transaction_read_only=on"
          "$RUNTIME_PYTHON" -m scripts.run_freeze2_s0_source_truth_baseline             --output-dir "$S0_ROOT"             --output "$S0_OUTPUT"

      - name: Publish aggregate S0 evidence to issue 1038
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" - "$S0_OUTPUT" <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.request

          payload = json.loads(Path(os.environ["S0_OUTPUT"]).read_text(encoding="utf-8"))
          source = payload["source_overview"]
          connector = payload["connector_builder_diagnostic"]
          metadata = payload["metadata_integrity"]
          skill = payload["skill_requirement_reliability"]

          marker = "<!-- jap-freeze2-s0-baseline:v1 -->"
          body = "\n".join(
              [
                  marker,
                  "## Freeze-II S0 — exact-main read-only baseline",
                  "",
                  f"- source SHA: `{os.environ['SOURCE_SHA']}`",
                  f"- workflow run: https://github.com/{os.environ['REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}",
                  f"- source overview: `{json.dumps(source['summary'], sort_keys=True)}`",
                  f"- active Employer-Origin families: `{json.dumps(source['family_concentration']['active_employer_origin_by_family'], sort_keys=True)}`",
                  f"- Product review families: `{json.dumps(source['family_concentration']['product_review_jobs_by_family'], sort_keys=True)}`",
                  f"- connector candidates: **{connector['candidate_count']}**",
                  f"- diagnostic recipe-ready: **{connector['diagnostic_recipe_ready_count']}** (not Product coverage)",
                  f"- connector first failures: `{json.dumps(connector['first_failure_counts'], sort_keys=True)}`",
                  f"- metadata reachable: **{metadata['reachable_count']}**",
                  f"- metadata extractor-gap rows: **{metadata['rows_with_extractor_gap']}**",
                  f"- Silver -> Product/CC projection-loss rows: **{metadata['rows_with_projection_loss']}**",
                  f"- metadata violating rows: **{metadata['violating_row_count']}**",
                  f"- field status counts: `{json.dumps(metadata['field_status_counts'], sort_keys=True)}`",
                  f"- requirement sections extracted: **{skill['requirement_section_extracted_job_count']}**",
                  f"- jobs with observed skills: **{skill['skill_observed_job_count']}**",
                  f"- skill recall-risk rows: **{skill['skill_recall_risk_count']}**",
                  "",
                  "Boundaries: DB/source/connector/Bronze/Silver/Product writes 0; provider/LLM calls 0; Fit/ranking/application authority 0.",
                  "",
                  "This S0 result selects the first S1/S2 connector/source-family cohort; it does not activate anything.",
              ]
          )

          print(body)
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(body + "\n", encoding="utf-8")

          url = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/1038/comments"
          request = urllib.request.Request(
              url,
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "JAP-Freeze-II-S0",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 201:
                  raise SystemExit(f"ISSUE_COMMENT_HTTP_{response.status}")
          PY
