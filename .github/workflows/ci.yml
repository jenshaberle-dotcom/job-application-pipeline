name: Pipeline CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: pipeline-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: Resolve execution surface
    uses: ./.github/workflows/warm-runner-route.yml
    with:
      heartbeat_workflow: warm-runner-heartbeat.yml
      heartbeat_max_age_seconds: 900
      warm_runs_on_json: '["self-hosted","Linux","X64","job-pipeline-runtime-linux"]'
      hosted_runs_on_json: '["ubuntu-latest"]'

  validate:
    name: Quality, migrations, and governance contracts
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.runs_on_json) }}
    timeout-minutes: 30
    env:
      RCC_EXPECTED_PROFILE_HASH: 62dda18c8360e15ae054cdb4e0420effcca26a04a7f6ac751a9332fd966001e7
      RCC_EXPECTED_PYTHON: 3.12.14

    steps:
      - name: Show selected execution surface
        shell: bash
        env:
          PIPELINE_ROUTE: ${{ needs.route.outputs.route }}
          PIPELINE_ROUTE_REASON: ${{ needs.route.outputs.reason }}
        run: |
          set -euo pipefail
          echo "PIPELINE_ROUTE=${PIPELINE_ROUTE} reason=${PIPELINE_ROUTE_REASON} runner=${RUNNER_NAME}"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind qualified persistent RCC Python
        if: needs.route.outputs.route == 'warm'
        shell: bash
        run: |
          set -euo pipefail
          root="$HOME/.cache/DeepOceanInfrastructure/RunnerToolchain/PythonEnvs/job-pipeline-runtime-linux-warm"
          active_python_file="$root/active-python.txt"
          active_hash_file="$root/active-profile-hash.txt"
          test -s "$active_python_file"
          test -s "$active_hash_file"
          python_path="$(tr -d '\r\n' < "$active_python_file")"
          profile_hash="$(tr -d '\r\n' < "$active_hash_file")"
          test "$profile_hash" = "$RCC_EXPECTED_PROFILE_HASH"
          test -x "$python_path"
          actual_version="$($python_path -c 'import platform; print(platform.python_version())')"
          test "$actual_version" = "$RCC_EXPECTED_PYTHON"
          "$python_path" -m pip check
          printf 'CI_PYTHON=%s\n' "$python_path" >> "$GITHUB_ENV"
          echo "RCC_WARM_PYTHON_BINDING=PASS python=$actual_version profile_hash=$profile_hash"
          echo "RCC_SETUP_PYTHON=NONE"
          echo "RCC_PIP_INSTALL=NONE"
          echo "RCC_REMOTE_PIP_CACHE_RESTORE=NONE"

      - name: Set up hosted Python without remote pip cache
        if: needs.route.outputs.route == 'github-hosted'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select hosted Python command
        if: needs.route.outputs.route == 'github-hosted'
        shell: bash
        run: echo 'CI_PYTHON=python' >> "$GITHUB_ENV"

      - name: Install runtime and development dependencies on hosted runner
        if: needs.route.outputs.route == 'github-hosted'
        shell: bash
        run: |
          set -euo pipefail
          "$CI_PYTHON" -m pip install --disable-pip-version-check --upgrade pip
          "$CI_PYTHON" -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Verify installed dependency consistency
        shell: bash
        run: '"$CI_PYTHON" -m pip check'

      - name: Compile active Python paths
        shell: bash
        run: '"$CI_PYTHON" -m compileall -q src scripts tests'

      - name: Parse active Windows PowerShell scripts
        shell: pwsh
        run: |
          $Paths = @(
            "scripts/install_windows_origin_runtime_lease_watcher.ps1",
            "scripts/windows/install_or_update_job_pipeline_scheduler.ps1",
            "scripts/windows/run_scheduled_pipeline.ps1"
          )

          foreach ($Path in $Paths) {
            $Tokens = $null
            $Errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $Path,
              [ref]$Tokens,
              [ref]$Errors
            ) | Out-Null

            if ($Errors.Count -gt 0) {
              Write-Error "PowerShell parse failed: $Path"
              $Errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

      - name: Validate migration, tooling, and governance contracts
        shell: bash
        run: '"$CI_PYTHON" scripts/validate_ci_contract.py'

      - name: Run hard Ruff correctness gate
        shell: bash
        run: '"$CI_PYTHON" -m ruff check . --select E4,E7,E9,F --ignore E402'

      - name: Prevent E402 baseline growth
        shell: bash
        run: |
          set -euo pipefail

          e402_root="$(mktemp -d "${RUNNER_TEMP:-/tmp}/pipeline-e402.XXXXXX")"
          head_json="$e402_root/head-e402.json"
          base_json="$e402_root/base-e402.json"
          base_worktree="$e402_root/base"

          cleanup_e402() {
            if [[ -e "$base_worktree/.git" ]]; then
              git worktree remove --force "$base_worktree" >/dev/null 2>&1 || true
            fi
            rm -rf "$e402_root"
          }
          trap cleanup_e402 EXIT

          "$CI_PYTHON" -m ruff check . \
            --select E402 \
            --output-format json \
            --exit-zero > "$head_json"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git worktree add --detach "$base_worktree" "origin/${{ github.base_ref }}"
            "$CI_PYTHON" -m ruff check "$base_worktree" \
              --config "$base_worktree/pyproject.toml" \
              --select E402 \
              --output-format json \
              --exit-zero > "$base_json"
          fi

          "$CI_PYTHON" - "$head_json" "$base_json" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          head = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          base_path = Path(sys.argv[2])
          base = (
              json.loads(base_path.read_text(encoding="utf-8"))
              if base_path.exists()
              else None
          )

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = ["## Ruff E402 transition", "", f"- Current findings: `{len(head)}`"]
          if base is not None:
              lines.append(f"- Base findings: `{len(base)}`")
              lines.append(f"- Delta: `{len(head) - len(base):+d}`")
          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          if base is not None and len(head) > len(base):
              raise SystemExit(
                  f"E402 baseline grew from {len(base)} to {len(head)} findings"
              )
          PY

      - name: Run full test suite
        shell: bash
        run: '"$CI_PYTHON" -m pytest -q'

  frontend:
    name: React Control Center build
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.runs_on_json) }}
    timeout-minutes: 15

    steps:
      - name: Show selected execution surface
        shell: bash
        env:
          PIPELINE_ROUTE: ${{ needs.route.outputs.route }}
          PIPELINE_ROUTE_REASON: ${{ needs.route.outputs.reason }}
        run: |
          set -euo pipefail
          echo "PIPELINE_ROUTE=${PIPELINE_ROUTE} reason=${PIPELINE_ROUTE_REASON} runner=${RUNNER_NAME}"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm install --prefix frontend/control-center --no-audit --no-fund

      - name: Type-check and build React Control Center
        run: npm run build --prefix frontend/control-center
