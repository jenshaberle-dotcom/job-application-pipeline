name: P1 generic Employer-Origin product proof

on:
  pull_request:
    paths:
      - ".github/workflows/p1-generic-origin-product-proof.yml"
      - ".github/workflows/p1-generic-origin-product-activate.yml"
      - "requirements.txt"
      - "db/migrations/107_create_generic_employer_origin_active_sources.sql"
      - "db/migrations/115_expand_ai_automation_market_coverage.sql"
      - "scripts/run_known_public_vacancy_parity.py"
      - "tests/test_known_public_vacancy_parity.py"
      - "scripts/run_generic_employer_origin_product.py"
      - "scripts/qualify_generic_employer_origin_connectors.py"
      - "scripts/apply_generic_employer_origin_activation.py"
      - "scripts/run_deterministic_connector_builder_layer_audit.py"
      - "scripts/product_v1_f4c_source_health_runtime.py"
      - "scripts/product_v1_data_layers_runtime.py"
      - "scripts/run_f4c_current_source_health_proof.py"
      - "scripts/run_f4c_data_layer_reconciliation.py"
      - "scripts/run_f4c_source_health_reconciliation.py"
      - "scripts/run_product_v1_demo_control_center.py"
      - "src/connectors/generic_employer_origin.py"
      - "src/connectors/generic_employer_origin_product.py"
      - "src/connectors/generic_job_detail_evidence.py"
      - "src/ingestion/generic_origin_bronze_admission.py"
      - "src/connectors/employer_origin_**"
      - "src/connectors/registry.py"
      - "src/search_intelligence/deterministic_connector_builder.py"
      - "src/search_intelligence/source_connector_overview.py"
      - "frontend/control-center/src/F4cSourceHealthSurface.tsx"
      - "frontend/control-center/src/DataLayersTab.tsx"
      - "tests/test_f4c_current_source_health_contract.py"
      - "tests/test_f4c_operator_surface_contract.py"
      - "tests/test_product_v1_data_layers_runtime.py"
      - "tests/test_generic_employer_origin_product.py"
      - "tests/test_generic_employer_origin_connector.py"
      - "tests/test_generic_employer_origin_product_connector.py"
      - "tests/test_generic_job_detail_evidence.py"
      - "tests/test_generic_origin_bronze_admission.py"
      - "tests/test_generic_origin_product_activation_contract.py"
      - "tests/test_generic_origin_source_overview_truth.py"
      - "tests/test_connector_registry.py"

permissions:
  contents: read

concurrency:
  group: p1-generic-employer-origin-product-proof
  cancel-in-progress: true

jobs:
  proof:
    name: Generic layer product proof across all origin candidates
    if: ${{ vars.RCC_JAP_BLUE_ASSIGNMENT_FROZEN != 'true' }}
    runs-on: [self-hosted, Linux, X64, job-pipeline-runtime-linux]
    timeout-minutes: 120
    env:
      RCC_REPOSITORY_ID: "1230805345"
      RCC_REPOSITORY: jenshaberle-dotcom/job-application-pipeline
      RCC_RUNNER_NAME: job-pipeline-runtime-linux
      PRODUCT_OUTPUT: /tmp/jap-generic-employer-origin-product.json
      F4C_SOURCE_OUTPUT: /tmp/jap-f4c-source-operator-proof.json
      F4C_RECON_OUTPUT: /tmp/jap-f4c-data-layer-reconciliation.json
      F4C_LAYERS_OUTPUT: /tmp/jap-f4c-data-layers-product.json

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Resolve verified RCC runtime context
        shell: bash
        run: |
          set -euo pipefail
          context_file="${RCC_RUNTIME_CONTEXT_FILE:-$HOME/.config/DeepOceanInfrastructure/RCC/runtime-contexts/${RCC_REPOSITORY_ID}-${RCC_RUNNER_NAME}.json}"
          test -f "$context_file"
          context_output="$(python3 - "$context_file" "$RCC_REPOSITORY_ID" "$RCC_REPOSITORY" "$RCC_RUNNER_NAME" <<'PY'
          import json
          import sys
          from pathlib import PurePosixPath

          path, repo_id, repository, runner = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              context = json.load(handle)
          if context.get("RepositoryId") != int(repo_id):
              raise SystemExit("RUNTIME_REPOSITORY_ID_MISMATCH")
          if context.get("Repository") != repository:
              raise SystemExit("RUNTIME_REPOSITORY_MISMATCH")
          if context.get("RunnerName") != runner:
              raise SystemExit("RUNTIME_RUNNER_MISMATCH")
          if context.get("Platform") != "linux-wsl":
              raise SystemExit("RUNTIME_PLATFORM_MISMATCH")
          if context.get("Status") != "PASS" or context.get("PrimaryFailure") not in (None, ""):
              raise SystemExit("RUNTIME_CONTEXT_NOT_PASS")
          checks = {
              item.get("Id"): item.get("Status")
              for item in context.get("Checks", [])
              if isinstance(item, dict)
          }
          required = {
              "repository_identity", "checkout", "checkout_repository",
              "env_file", "env_keys", "interpreter", "interpreter_probe",
              "capability:postgresql",
          }
          failed = sorted(key for key in required if checks.get(key) != "PASS")
          if failed:
              raise SystemExit("RUNTIME_CHECKS_NOT_PASS:" + ",".join(failed))
          checkout = context.get("CheckoutRoot")
          interpreter = context.get("Interpreter")
          env_file = context.get("EnvFile")
          root = PurePosixPath(checkout)
          if root not in PurePosixPath(interpreter).parents:
              raise SystemExit("INTERPRETER_OUTSIDE_CHECKOUT")
          if root not in PurePosixPath(env_file).parents:
              raise SystemExit("ENV_OUTSIDE_CHECKOUT")
          print(interpreter)
          print(env_file)
          PY
          )"
          mapfile -t values <<< "$context_output"
          test "${#values[@]}" -eq 2
          printf 'RUNTIME_PYTHON=%s\n' "${values[0]}" >> "$GITHUB_ENV"
          printf 'RUNTIME_ENV_FILE=%s\n' "${values[1]}" >> "$GITHUB_ENV"
          echo "RCC_CONTEXT=PASS runner=${RUNNER_NAME}"

      - name: Provision pinned local OSS detail extractors
        shell: bash
        run: |
          set -euo pipefail
          local_oss_site="$RUNNER_TEMP/jap-p1-product-local-oss-site"
          rm -rf "$local_oss_site"
          "$RUNTIME_PYTHON" -m pip install \
            --disable-pip-version-check \
            --no-input \
            --target "$local_oss_site" \
            'extruct==0.18.0' \
            'trafilatura==2.2.0'
          printf 'PYTHONPATH=%s:%s\n' "$local_oss_site" "${PYTHONPATH:-}" >> "$GITHUB_ENV"

      - name: Compile canonical product path
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" -m py_compile \
            scripts/run_generic_employer_origin_product.py \
            scripts/qualify_generic_employer_origin_connectors.py \
            scripts/apply_generic_employer_origin_activation.py \
            scripts/run_known_public_vacancy_parity.py \
            src/connectors/generic_employer_origin.py \
            src/connectors/generic_employer_origin_product.py \
            src/connectors/generic_job_detail_evidence.py \
            src/ingestion/generic_origin_bronze_admission.py \
            src/search_intelligence/source_connector_overview.py

      - name: Test sole-truth registry and Bronze contracts
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" -m pytest -q \
            tests/test_generic_employer_origin_product.py \
            tests/test_generic_employer_origin_connector.py \
            tests/test_generic_employer_origin_product_connector.py \
            tests/test_generic_job_detail_evidence.py \
            tests/test_generic_origin_bronze_admission.py \
            tests/test_generic_origin_product_activation_contract.py \
            tests/test_generic_origin_source_overview_truth.py \
            tests/test_connector_registry.py \
            tests/test_known_public_vacancy_parity.py

      - name: Diagnose current persisted and live market path read-only
        shell: bash
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1090
          source "$RUNTIME_ENV_FILE"
          set +a
          export PGOPTIONS="-c default_transaction_read_only=on"
          "$RUNTIME_PYTHON" -m scripts.run_known_public_vacancy_parity \
            --company-key hornetsecurity \
            --expected-company "Hornetsecurity" \
            --expected-title "AI Automation Architect Software Development Lifecycle" \
            --ba-profile-name ba_data_engineer_30629_50km \
            --ba-search-term "AI Automation Architect" \
            --ba-external-job-id "10001-1003339347-S" \
            --live-ba

      - name: Run generic product proof read-only
        shell: bash
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1090
          source "$RUNTIME_ENV_FILE"
          set +a
          export PGOPTIONS="-c default_transaction_read_only=on"
          "$RUNTIME_PYTHON" -m scripts.run_generic_employer_origin_product \
            --output "$PRODUCT_OUTPUT"

      - name: Print sole product admission cohort
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" - "$PRODUCT_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          keys = payload.get("proof_pass_company_keys", [])
          print(f"GENERIC_PRODUCT_CANDIDATES={payload['summary']['candidate_count']}")
          print(f"GENERIC_PRODUCT_PROOF_PASS={len(keys)}")
          for key in keys:
              print(f"GENERIC_VALID_SOURCE={key}")
          print("GENERIC_PRODUCT_DATABASE_WRITES=0")
          PY

      - name: Qualify proof-pass sources through Bronze-gated product registry
        shell: bash
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1090
          source "$RUNTIME_ENV_FILE"
          set +a
          export PGOPTIONS="-c default_transaction_read_only=on"
          "$RUNTIME_PYTHON" -m scripts.qualify_generic_employer_origin_connectors \
            --proof-json "$PRODUCT_OUTPUT"

      - name: Prove activation plan is exact and read-only
        shell: bash
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1090
          source "$RUNTIME_ENV_FILE"
          set +a
          export PGOPTIONS="-c default_transaction_read_only=on"
          "$RUNTIME_PYTHON" -m scripts.apply_generic_employer_origin_activation \
            --proof-json "$PRODUCT_OUTPUT"

      - name: Qualify F4C focused contracts on the existing admitted product-proof surface
        if: ${{ startsWith(github.event.pull_request.head.ref, 'agent/f4c-') }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" -m pytest -q \
            tests/test_f4c_current_source_health_contract.py \
            tests/test_f4c_operator_surface_contract.py \
            tests/test_f4c_data_layer_reconciliation.py \
            tests/test_f4c_source_health_reconciliation.py \
            tests/test_product_v1_data_layers_runtime.py

      - name: Run F4C source operator proof read-only
        if: ${{ startsWith(github.event.pull_request.head.ref, 'agent/f4c-') }}
        shell: bash
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1090
          source "$RUNTIME_ENV_FILE"
          set +a
          export PGOPTIONS="-c default_transaction_read_only=on"
          "$RUNTIME_PYTHON" -m scripts.run_f4c_current_source_health_proof \
            --source-sha "${{ github.event.pull_request.head.sha }}" \
            --output "$F4C_SOURCE_OUTPUT"

      - name: Verify F4C source operator truth boundary
        if: ${{ startsWith(github.event.pull_request.head.ref, 'agent/f4c-') }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" - "$F4C_SOURCE_OUTPUT" "${{ github.event.pull_request.head.sha }}" <<'PY'
          import json, sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if report.get("source_sha") != sys.argv[2]:
              raise SystemExit("F4C_SOURCE_SHA_MISMATCH")
          summary = report.get("summary") or {}
          source_count = int(summary.get("source_count") or 0)
          if source_count <= 0:
              raise SystemExit("F4C_SOURCE_COHORT_EMPTY")
          if int(summary.get("reachability_not_checked_count") or 0) != source_count:
              raise SystemExit("F4C_LIVE_REACHABILITY_WAS_INVENTED")
          for row in report.get("rows") or []:
              if row.get("latest_run_status") == "success" and row.get("latest_scan_status") != "ok":
                  raise SystemExit(f"F4C_SCAN_SUCCESS_MISMATCH:{row.get('source_name')}")
              if row.get("live_reachability") != "not_checked":
                  raise SystemExit(f"F4C_LIVE_REACHABILITY_NOT_EVIDENCED:{row.get('source_name')}")
              if int(row.get("current_job_count") or 0) < 0:
                  raise SystemExit(f"F4C_NEGATIVE_CURRENT_JOB_COUNT:{row.get('source_name')}")
              if row.get("disappeared_comparison_available") is True and int(row.get("disappeared_since_previous_success") or 0) < 0:
                  raise SystemExit(f"F4C_NEGATIVE_DISAPPEARED_COUNT:{row.get('source_name')}")
              if row.get("zero_yield_latest_success") is True and row.get("latest_scan_status") == "failed":
                  raise SystemExit(f"F4C_ZERO_YIELD_COLLAPSED_TO_FAILURE:{row.get('source_name')}")
          boundaries = report.get("boundaries") or {}
          for key, value in {
              "db_writes": 0,
              "provider_calls": 0,
              "network_probes": 0,
              "source_activation_changed": False,
              "scheduler_changed": False,
              "ranking_authority_changed": False,
              "top5_authority_changed": False,
              "application_authority_changed": False,
          }.items():
              if boundaries.get(key) != value:
                  raise SystemExit(f"F4C_BOUNDARY_VIOLATION:{key}")
          print("F4C_SOURCE_OPERATOR_PROOF=PASS")
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Reconcile F4C persisted Gold with current All jobs diagnostically
        if: ${{ startsWith(github.event.pull_request.head.ref, 'agent/f4c-') }}
        shell: bash
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1090
          source "$RUNTIME_ENV_FILE"
          set +a
          export PGOPTIONS="-c default_transaction_read_only=on"
          "$RUNTIME_PYTHON" -m scripts.run_f4c_data_layer_reconciliation \
            --source-sha "${{ github.event.pull_request.head.sha }}" \
            --output "$F4C_RECON_OUTPUT"

      - name: Prove F4C single current All-jobs population
        if: ${{ startsWith(github.event.pull_request.head.ref, 'agent/f4c-') }}
        shell: bash
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1090
          source "$RUNTIME_ENV_FILE"
          set +a
          export PGOPTIONS="-c default_transaction_read_only=on"
          "$RUNTIME_PYTHON" - "$F4C_RECON_OUTPUT" "$F4C_LAYERS_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path
          from scripts.product_v1_data_layers_runtime import load_data_layers_payload
          from scripts.run_product_v1_demo_control_center import _load_operator_product_payload

          reconciliation = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          summary = reconciliation.get("summary") or {}
          payload = load_data_layers_payload(_load_operator_product_payload())
          Path(sys.argv[2]).write_text(
              json.dumps(payload, indent=2, sort_keys=True, default=str) + "\n",
              encoding="utf-8",
          )
          population = payload.get("population") or {}
          layers = payload.get("layers") or {}
          all_jobs = int(summary.get("operator_all_jobs_count") or 0)
          gold_in_all_jobs = int(summary.get("persisted_gold_in_all_jobs_count") or 0)
          if population.get("key") != "current_all_jobs":
              raise SystemExit("F4C_DATA_LAYERS_POPULATION_KEY_MISMATCH")
          if int(population.get("all_jobs") or 0) != all_jobs:
              raise SystemExit("F4C_DATA_LAYERS_ALL_JOBS_MISMATCH")
          if int(layers.get("silver_jobs") or 0) != all_jobs:
              raise SystemExit("F4C_DATA_LAYERS_SILVER_POPULATION_MISMATCH")
          if int(layers.get("bronze_jobs") or 0) != all_jobs:
              raise SystemExit("F4C_DATA_LAYERS_BRONZE_LINEAGE_GAP")
          if int(layers.get("gold_assessed") or 0) != gold_in_all_jobs:
              raise SystemExit("F4C_DATA_LAYERS_GOLD_POPULATION_MISMATCH")
          if any("bronze_observations" in point for point in payload.get("flow") or []):
              raise SystemExit("F4C_REPEAT_OBSERVATIONS_LEAKED_TO_PRIMARY_FLOW")
          boundaries = payload.get("boundaries") or {}
          if boundaries.get("single_population_current_all_jobs") is not True:
              raise SystemExit("F4C_SINGLE_POPULATION_BOUNDARY_MISSING")
          if boundaries.get("historical_inventory_excluded_from_primary_counts") is not True:
              raise SystemExit("F4C_HISTORICAL_INVENTORY_BOUNDARY_MISSING")
          if boundaries.get("repeat_observations_excluded_from_primary_flow") is not True:
              raise SystemExit("F4C_REPEAT_OBSERVATION_BOUNDARY_MISSING")
          print("F4C_DATA_LAYERS_SINGLE_POPULATION=PASS")
          print(json.dumps({"population": population, "layers": layers}, sort_keys=True))
          PY

      - name: Upload generic product proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-generic-employer-origin-product-proof
          path: /tmp/jap-generic-employer-origin-product.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload F4C read-only proof artifacts
        if: ${{ always() && startsWith(github.event.pull_request.head.ref, 'agent/f4c-') }}
        uses: actions/upload-artifact@v4
        with:
          name: f4c-operator-truth-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/jap-f4c-source-operator-proof.json
            /tmp/jap-f4c-data-layer-reconciliation.json
            /tmp/jap-f4c-data-layers-product.json
          if-no-files-found: warn
          retention-days: 1
