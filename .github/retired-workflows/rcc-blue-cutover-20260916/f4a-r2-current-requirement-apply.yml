name: F4A-R2 current requirement apply

on:
  push:
    branches:
      - agent/f4a-r2-operator-visible-requirements
      - agent/f4a-r3-operator-metadata-projection
    paths:
      - ".github/workflows/f4a-r2-current-requirement-apply.yml"
      - "scripts/apply_f4a_r2_current_requirement_evidence.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f4a-r2-current-requirement-apply
  cancel-in-progress: false

jobs:
  apply:
    name: Apply qualified current job-side requirement evidence
    runs-on: [self-hosted, Linux, X64, job-pipeline-runtime-linux]
    timeout-minutes: 30
    env:
      RCC_REPOSITORY_ID: "1230805345"
      RCC_REPOSITORY: jenshaberle-dotcom/job-application-pipeline
      RCC_RUNNER_NAME: job-pipeline-runtime-linux

    steps:
      - name: Check out exact apply head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "F4A_R2_APPLY_HEAD=${GITHUB_SHA}"

      - name: Resolve verified RCC runtime context
        shell: bash
        run: |
          set -euo pipefail
          context_file="${RCC_RUNTIME_CONTEXT_FILE:-$HOME/.config/DeepOceanInfrastructure/RCC/runtime-contexts/${RCC_REPOSITORY_ID}-${RCC_RUNNER_NAME}.json}"
          test -f "$context_file"
          context_output="$(python3 - "$context_file" "$RCC_REPOSITORY_ID" "$RCC_REPOSITORY" "$RCC_RUNNER_NAME" <<'PY'
          import json
          import sys
          from pathlib import PurePosixPath

          path, repo_id, repository, runner = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              context = json.load(handle)
          if context.get("RepositoryId") != int(repo_id):
              raise SystemExit("RUNTIME_REPOSITORY_ID_MISMATCH")
          if context.get("Repository") != repository:
              raise SystemExit("RUNTIME_REPOSITORY_MISMATCH")
          if context.get("RunnerName") != runner:
              raise SystemExit("RUNTIME_RUNNER_MISMATCH")
          if context.get("Status") != "PASS" or context.get("PrimaryFailure") not in (None, ""):
              raise SystemExit("RUNTIME_CONTEXT_NOT_PASS")
          checkout = context.get("CheckoutRoot")
          interpreter = context.get("Interpreter")
          env_file = context.get("EnvFile")
          root = PurePosixPath(checkout)
          if root not in PurePosixPath(interpreter).parents or root not in PurePosixPath(env_file).parents:
              raise SystemExit("RUNTIME_CONTEXT_PATH_MISMATCH")
          print(interpreter)
          print(env_file)
          PY
          )"
          mapfile -t values <<< "$context_output"
          test "${#values[@]}" -eq 2
          printf 'RUNTIME_PYTHON=%s\n' "${values[0]}" >> "$GITHUB_ENV"
          printf 'RUNTIME_ENV_FILE=%s\n' "${values[1]}" >> "$GITHUB_ENV"

      - name: Load masked Product database environment
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" - "$RUNTIME_ENV_FILE" "$GITHUB_ENV" <<'PY'
          import secrets
          import sys
          from pathlib import Path
          from dotenv import dotenv_values

          values = dotenv_values(Path(sys.argv[1]))
          required = (
              "POSTGRES_HOST", "POSTGRES_PORT", "POSTGRES_DB",
              "POSTGRES_USER", "POSTGRES_PASSWORD",
          )
          missing = [key for key in required if values.get(key) in (None, "")]
          if missing:
              raise SystemExit("RUNTIME_ENV_POSTGRES_KEYS_MISSING:" + ",".join(missing))
          print(f"::add-mask::{values['POSTGRES_PASSWORD']}")
          with Path(sys.argv[2]).open("a", encoding="utf-8") as handle:
              for key in required:
                  value = str(values[key])
                  marker = f"JAP_ENV_{secrets.token_hex(12)}"
                  while marker in value:
                      marker = f"JAP_ENV_{secrets.token_hex(12)}"
                  handle.write(f"{key}<<{marker}\n{value}\n{marker}\n")
          PY

      - name: Qualify exact apply implementation
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" -m pytest -q \
            tests/test_f4a_r2_operator_requirement_reconcile.py \
            tests/test_f4a_r3_operator_metadata_projection.py \
            tests/test_f4a_requirement_evidence_refresh.py \
            tests/test_product_v1_requirement_evidence.py \
            tests/test_product_v1_detail_document.py
          "$RUNTIME_PYTHON" -m ruff check \
            scripts/apply_f4a_r2_current_requirement_evidence.py \
            scripts/run_f4a_r2_current_requirement_origin_diagnostic.py \
            scripts/run_f4a_r2_current_requirement_plan.py \
            src/search_intelligence/product_v1_requirement_evidence.py \
            scripts/product_v1_job_presentation_runtime.py \
            tests/test_f4a_r2_operator_requirement_reconcile.py \
            tests/test_f4a_r3_operator_metadata_projection.py \
            tests/test_product_v1_requirement_evidence.py

      - name: Re-prove full current operator cohort read-only
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/f4a_r2_pre_apply_plan.json"
          "$RUNTIME_PYTHON" -m scripts.run_f4a_r2_current_requirement_origin_diagnostic \
            --output "$output"
          "$RUNTIME_PYTHON" - "$output" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          if report["blocked_count"] != 0:
              raise SystemExit("F4A_R2_PRE_APPLY_BLOCKED")
          if report["candidate_count"] != report["proposal_count"]:
              raise SystemExit("F4A_R2_PRE_APPLY_COHORT_MISMATCH")
          print(f"F4A_R2_PRE_APPLY_CANDIDATES={report['candidate_count']}")
          print(f"F4A_R2_PRE_APPLY_WOULD_CHANGE={report['would_change_count']}")
          for proposal in report["proposals"]:
              if proposal.get("would_change"):
                  print("F4A_R2_PRE_APPLY_CHANGE=" + json.dumps({
                      "silver_job_id": proposal.get("silver_job_id"),
                      "source_name": proposal.get("source_name"),
                      "title": proposal.get("title"),
                      "changed_fields": proposal.get("changed_fields"),
                  }, ensure_ascii=False, sort_keys=True))
          print("F4A_R2_PRE_APPLY=PASS")
          PY

      - name: Apply current job-side requirement evidence
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/f4a_r2_current_requirement_apply.json"
          "$RUNTIME_PYTHON" -m scripts.apply_f4a_r2_current_requirement_evidence \
            --apply \
            --approval-token F4A-R2-CURRENT-REQUIREMENT-APPLY-001 \
            --applied-by "github-actions:${GITHUB_RUN_ID}:${GITHUB_SHA}" \
            --output "$output"
          "$RUNTIME_PYTHON" - "$output" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          if report["blocked_count"] != 0:
              raise SystemExit("F4A_R2_APPLY_BLOCKED")
          if report["verification"]["persisted"] != report["candidate_count"]:
              raise SystemExit("F4A_R2_APPLY_PERSISTENCE_MISMATCH")
          print("F4A_R2_APPLY_WORKFLOW=PASS")
          PY

      - name: Verify post-apply convergence
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/f4a_r2_post_apply_plan.json"
          "$RUNTIME_PYTHON" -m scripts.run_f4a_r2_current_requirement_origin_diagnostic \
            --output "$output"
          "$RUNTIME_PYTHON" - "$output" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          if report["blocked_count"] != 0:
              raise SystemExit("F4A_R2_POST_APPLY_BLOCKED")
          if report["candidate_count"] != report["proposal_count"]:
              raise SystemExit("F4A_R2_POST_APPLY_COHORT_MISMATCH")
          print(f"F4A_R2_POST_APPLY_CANDIDATES={report['candidate_count']}")
          print(f"F4A_R2_POST_APPLY_WOULD_CHANGE={report['would_change_count']}")
          for proposal in report["proposals"]:
              if proposal.get("would_change"):
                  print("F4A_R2_POST_APPLY_CHANGE=" + json.dumps({
                      "silver_job_id": proposal.get("silver_job_id"),
                      "source_name": proposal.get("source_name"),
                      "title": proposal.get("title"),
                      "changed_fields": proposal.get("changed_fields"),
                  }, ensure_ascii=False, sort_keys=True))
          if report["would_change_count"] != 0:
              raise SystemExit("F4A_R2_POST_APPLY_NOT_CONVERGED")
          print("F4A_R2_POST_APPLY_CONVERGED=PASS")
          PY
