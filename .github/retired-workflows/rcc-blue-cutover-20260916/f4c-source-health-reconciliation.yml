name: F4C read-only source health reconciliation

on:
  push:
    branches: [agent/f4c-readonly-source-health-reconciliation]
    paths:
      - scripts/run_f4c_source_health_reconciliation.py
      - tests/test_f4c_source_health_reconciliation.py
      - frontend/control-center/src/OperatorWorkspace.tsx
      - frontend/control-center/src/DataLayersTab.tsx
      - frontend/control-center/src/main.tsx
      - src/search_intelligence/source_connector_overview.py
      - scripts/product_v1_control_center_base.py
      - .github/workflows/f4c-source-health-reconciliation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f4c-source-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    name: Measure current source-health truth without provider or DB writes
    runs-on: [self-hosted, Linux, X64, job-pipeline-runtime-linux]
    timeout-minutes: 30
    env:
      RCC_REPOSITORY_ID: "1230805345"
      RCC_REPOSITORY: jenshaberle-dotcom/job-application-pipeline
      RCC_RUNNER_NAME: job-pipeline-runtime-linux
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind verified runtime and masked DB environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          context_file="${RCC_RUNTIME_CONTEXT_FILE:-$HOME/.config/DeepOceanInfrastructure/RCC/runtime-contexts/${RCC_REPOSITORY_ID}-${RCC_RUNNER_NAME}.json}"
          mapfile -t ctx < <(python3 - "$context_file" "$RCC_REPOSITORY_ID" "$RCC_REPOSITORY" "$RCC_RUNNER_NAME" <<'PY'
          import json, sys
          from pathlib import PurePosixPath
          path, repo_id, repository, runner = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              context = json.load(handle)
          if context.get("RepositoryId") != int(repo_id) or context.get("Repository") != repository or context.get("RunnerName") != runner:
              raise SystemExit("RUNTIME_CONTEXT_IDENTITY_MISMATCH")
          if context.get("Status") != "PASS" or context.get("PrimaryFailure") not in (None, ""):
              raise SystemExit("RUNTIME_CONTEXT_NOT_PASS")
          root = PurePosixPath(context["CheckoutRoot"])
          if root not in PurePosixPath(context["Interpreter"]).parents or root not in PurePosixPath(context["EnvFile"]).parents:
              raise SystemExit("RUNTIME_CONTEXT_PATH_MISMATCH")
          print(context["Interpreter"])
          print(context["EnvFile"])
          PY
          )
          test "${#ctx[@]}" -eq 2
          runtime_python="${ctx[0]}"
          runtime_env_file="${ctx[1]}"
          "$runtime_python" - "$runtime_env_file" "$GITHUB_ENV" <<'PY'
          import secrets, sys
          from pathlib import Path
          from dotenv import dotenv_values
          values = dotenv_values(Path(sys.argv[1]))
          required = ("POSTGRES_HOST", "POSTGRES_PORT", "POSTGRES_DB", "POSTGRES_USER", "POSTGRES_PASSWORD")
          if any(values.get(key) in (None, "") for key in required):
              raise SystemExit("RUNTIME_ENV_POSTGRES_KEYS_MISSING")
          print(f"::add-mask::{values['POSTGRES_PASSWORD']}")
          with Path(sys.argv[2]).open("a", encoding="utf-8") as handle:
              for key in required:
                  marker = f"JAP_ENV_{secrets.token_hex(12)}"
                  handle.write(f"{key}<<{marker}\n{values[key]}\n{marker}\n")
          PY
          echo "RUNTIME_PYTHON=$runtime_python" >> "$GITHUB_ENV"

      - name: Requalify focused diagnostic contracts
        shell: bash
        run: |
          set -euo pipefail
          site="$(bash scripts/ensure_pinned_local_oss_runtime.sh "$RUNTIME_PYTHON" requirements.txt "$RUNNER_TEMP/jap-f4c-local-oss-sites")"
          test -d "$site"
          echo "PYTHONPATH=$site:${PYTHONPATH:-}" >> "$GITHUB_ENV"
          "$RUNTIME_PYTHON" -m pytest -q tests/test_f4c_source_health_reconciliation.py
          "$RUNTIME_PYTHON" -m ruff check \
            scripts/run_f4c_source_health_reconciliation.py \
            tests/test_f4c_source_health_reconciliation.py

      - name: Reconcile exact current source-health projection
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" -m scripts.run_f4c_source_health_reconciliation \
            --source-sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/f4c_source_health_reconciliation.json"

      - name: Prove diagnostic-only boundary and expected mismatch visibility
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" - "$RUNNER_TEMP/f4c_source_health_reconciliation.json" "$GITHUB_SHA" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if report.get("source_sha") != sys.argv[2]:
              raise SystemExit("F4C_SOURCE_SHA_MISMATCH")
          boundaries = report.get("boundaries") or {}
          expected = {
              "db_writes": 0,
              "provider_calls": 0,
              "network_probes": 0,
              "source_activation_changed": False,
              "scheduler_changed": False,
              "ranking_authority_changed": False,
              "top5_authority_changed": False,
              "application_authority_changed": False,
          }
          for key, value in expected.items():
              if boundaries.get(key) != value:
                  raise SystemExit(f"F4C_BOUNDARY_VIOLATION:{key}")
          summary = report.get("summary") or {}
          if int(summary.get("source_count") or 0) <= 0:
              raise SystemExit("F4C_SOURCE_COHORT_EMPTY")
          if not summary.get("operations_source_lifecycle_overlap"):
              raise SystemExit("F4C_EXPECTED_OPERATIONS_OVERLAP_NOT_OBSERVED")
          if not summary.get("data_layers_per_source_run_overlap"):
              raise SystemExit("F4C_EXPECTED_DATA_LAYERS_OVERLAP_NOT_OBSERVED")
          print("F4C_READONLY_BOUNDARY=PASS")
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Preserve bounded F4C evidence
        uses: actions/upload-artifact@v4
        with:
          name: f4c-source-health-reconciliation-${{ github.sha }}
          path: ${{ runner.temp }}/f4c_source_health_reconciliation.json
          if-no-files-found: error
          retention-days: 1
