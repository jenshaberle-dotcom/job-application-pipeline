name: F4A-R8 guarded operator acceptance refresh

on:
  push:
    branches:
      - agent/f4a-r8-operator-acceptance
    paths:
      - ".github/triggers/f4a-r8-operator-apply.trigger"

permissions:
  contents: read

concurrency:
  group: f4a-r8-operator-apply
  cancel-in-progress: false

jobs:
  apply:
    name: Refresh exact-Origin Silver and prove Product operator convergence
    runs-on: [self-hosted, Linux, X64, job-pipeline-runtime-linux]
    timeout-minutes: 45
    env:
      RCC_REPOSITORY_ID: "1230805345"
      RCC_REPOSITORY: jenshaberle-dotcom/job-application-pipeline
      RCC_RUNNER_NAME: job-pipeline-runtime-linux
      APPROVAL_TOKEN: F4A-R8-SILVER-REQUIREMENT-REFRESH-001
      TRIGGER_FILE: .github/triggers/f4a-r8-operator-apply.trigger

    steps:
      - name: Check out exact authorized head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify single-purpose refresh authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -f "$TRIGGER_FILE"
          parent="$(git rev-parse HEAD^)"
          mapfile -t changed < <(git diff --name-only "$parent" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$TRIGGER_FILE"
          authority="$(sed -n 's/^authority=//p' "$TRIGGER_FILE")"
          qualified_head="$(sed -n 's/^qualified_preflight_head=//p' "$TRIGGER_FILE")"
          qualified_run="$(sed -n 's/^qualified_preflight_run=//p' "$TRIGGER_FILE")"
          qualified_ci="$(sed -n 's/^qualified_pipeline_ci_run=//p' "$TRIGGER_FILE")"
          qualified_reentry="$(sed -n 's/^qualified_reentry_run=//p' "$TRIGGER_FILE")"
          mutation="$(sed -n 's/^mutation=//p' "$TRIGGER_FILE")"
          test "$authority" = "$APPROVAL_TOKEN"
          test "$qualified_head" = "$parent"
          test -n "$qualified_run"
          test -n "$qualified_ci"
          test -n "$qualified_reentry"
          test "$mutation" = "refresh-current-cohort-silver-sidecar-only"
          echo "F4A_R8_AUTHORIZED_PARENT=$parent"
          echo "F4A_R8_QUALIFIED_PREFLIGHT_RUN=$qualified_run"
          echo "F4A_R8_QUALIFIED_PIPELINE_CI_RUN=$qualified_ci"
          echo "F4A_R8_QUALIFIED_REENTRY_RUN=$qualified_reentry"

      - name: Resolve verified RCC runtime context
        shell: bash
        run: |
          set -euo pipefail
          context_file="${RCC_RUNTIME_CONTEXT_FILE:-$HOME/.config/DeepOceanInfrastructure/RCC/runtime-contexts/${RCC_REPOSITORY_ID}-${RCC_RUNNER_NAME}.json}"
          context_output="$(python3 - "$context_file" "$RCC_REPOSITORY_ID" "$RCC_REPOSITORY" "$RCC_RUNNER_NAME" <<'PY'
          import json, sys
          from pathlib import PurePosixPath
          path, repo_id, repository, runner = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              context = json.load(handle)
          if context.get("RepositoryId") != int(repo_id) or context.get("Repository") != repository or context.get("RunnerName") != runner:
              raise SystemExit("RUNTIME_CONTEXT_IDENTITY_MISMATCH")
          if context.get("Status") != "PASS" or context.get("PrimaryFailure") not in (None, ""):
              raise SystemExit("RUNTIME_CONTEXT_NOT_PASS")
          root = PurePosixPath(context["CheckoutRoot"])
          if root not in PurePosixPath(context["Interpreter"]).parents or root not in PurePosixPath(context["EnvFile"]).parents:
              raise SystemExit("RUNTIME_CONTEXT_PATH_MISMATCH")
          print(context["Interpreter"])
          print(context["EnvFile"])
          PY
          )"
          mapfile -t values <<< "$context_output"
          test "${#values[@]}" -eq 2
          printf 'RUNTIME_PYTHON=%s\n' "${values[0]}" >> "$GITHUB_ENV"
          printf 'RUNTIME_ENV_FILE=%s\n' "${values[1]}" >> "$GITHUB_ENV"

      - name: Load masked Product database environment
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" - "$RUNTIME_ENV_FILE" "$GITHUB_ENV" <<'PY'
          import secrets, sys
          from pathlib import Path
          from dotenv import dotenv_values
          values = dotenv_values(Path(sys.argv[1]))
          required = ("POSTGRES_HOST", "POSTGRES_PORT", "POSTGRES_DB", "POSTGRES_USER", "POSTGRES_PASSWORD")
          missing = [key for key in required if values.get(key) in (None, "")]
          if missing:
              raise SystemExit("RUNTIME_ENV_POSTGRES_KEYS_MISSING:" + ",".join(missing))
          print(f"::add-mask::{values['POSTGRES_PASSWORD']}")
          with Path(sys.argv[2]).open("a", encoding="utf-8") as handle:
              for key in required:
                  value = str(values[key])
                  marker = f"JAP_ENV_{secrets.token_hex(12)}"
                  handle.write(f"{key}<<{marker}\n{value}\n{marker}\n")
          PY

      - name: Resolve pinned local OSS detail runtime
        shell: bash
        run: |
          set -euo pipefail
          local_oss_site="$(bash scripts/ensure_pinned_local_oss_runtime.sh "$RUNTIME_PYTHON" requirements.txt "$RUNNER_TEMP/jap-f4a-r8-local-oss-sites")"
          test -d "$local_oss_site"
          printf 'PYTHONPATH=%s:%s\n' "$local_oss_site" "${PYTHONPATH:-}" >> "$GITHUB_ENV"

      - name: Requalify focused contracts before mutation
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" -m pytest -q \
            tests/test_generic_job_detail_evidence.py \
            tests/test_detail_semantics_deterministic.py \
            tests/test_requirement_section_evidence.py \
            tests/test_silver_requirement_evidence_projection.py \
            tests/test_operator_requirement_semantics.py \
            tests/test_f4a_r3_silver_requirement_backfill.py \
            tests/test_f4a_r3_bronze2e_requirement_audit.py \
            tests/test_f4a_r3_operator_metadata_projection.py \
            tests/test_f4a_r6_requirement_fit_clarity.py
          "$RUNTIME_PYTHON" -m ruff check \
            src/connectors/generic_job_detail_evidence.py \
            src/search_intelligence/detail_semantics_deterministic.py \
            src/search_intelligence/requirement_section_evidence.py \
            src/silver/requirement_evidence_projection.py \
            src/silver/operator_requirement_semantics.py \
            scripts/run_f4a_r3_silver_requirement_backfill.py \
            scripts/run_f4a_r3_bronze2e_requirement_audit.py \
            scripts/product_v1_silver_requirement_projection.py \
            scripts/product_v1_job_presentation_runtime.py

      - name: Prove migration state already converged
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" scripts/apply_db_migrations.py --status

      - name: Rebuild exact-Origin plan and enforce coverage before refresh
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/f4a_r8_pre_refresh_plan.json"
          "$RUNTIME_PYTHON" -m scripts.run_f4a_r3_silver_requirement_backfill --output "$output"
          "$RUNTIME_PYTHON" - "$output" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          allowed = {"observed_structured", "observed_bounded_text", "source_absent", "extractor_gap", "conflict", "origin_unavailable"}
          reachable = []
          covered = []
          bad = []
          for proposal in report.get("proposals", []):
              statuses = [str((value or {}).get("status") or "missing") for value in ((proposal.get("payload") or {}).get("fields") or {}).values()]
              if any(status not in allowed for status in statuses):
                  bad.append(proposal.get("silver_job_id"))
              if proposal.get("origin_unavailable"):
                  continue
              reachable.append(proposal)
              if "extractor_gap" not in statuses:
                  covered.append(proposal)
          ratio = len(covered) / len(reachable) if reachable else 0.0
          print(f"F4A_R8_PRE_REFRESH_CANDIDATES={report['candidate_count']}")
          print(f"F4A_R8_PRE_REFRESH_REACHABLE={len(reachable)}")
          print(f"F4A_R8_PRE_REFRESH_COVERAGE_RATIO={ratio:.4f}")
          print(f"F4A_R8_PRE_REFRESH_WOULD_CHANGE={report['would_change_count']}")
          if report["candidate_count"] <= 0 or report["proposal_count"] != report["candidate_count"] or report["blocked_count"] != 0:
              raise SystemExit("F4A_R8_PRE_REFRESH_NOT_COMPLETE")
          if bad or not reachable or ratio < 0.80 or any(report["boundaries"].values()):
              raise SystemExit("F4A_R8_PRE_REFRESH_GATE_FAIL")
          print("F4A_R8_PRE_REFRESH_GATE=PASS")
          PY

      - name: Refresh exact current-cohort Silver requirement evidence only
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/f4a_r8_refresh_apply.json"
          "$RUNTIME_PYTHON" -m scripts.run_f4a_r3_silver_requirement_backfill \
            --apply --approval-token "$APPROVAL_TOKEN" --output "$output"
          "$RUNTIME_PYTHON" - "$output" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          print(f"F4A_R8_REFRESH_APPLIED={report.get('applied_count', 0)}")
          if report.get("mode") != "apply" or report["blocked_count"] != 0:
              raise SystemExit("F4A_R8_REFRESH_APPLY_FAIL")
          if int(report.get("applied_count") or 0) != int(report["proposal_count"]):
              raise SystemExit("F4A_R8_REFRESH_APPLY_COUNT_MISMATCH")
          PY

      - name: Prove exact-Origin convergence after refresh
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/f4a_r8_post_refresh_plan.json"
          "$RUNTIME_PYTHON" -m scripts.run_f4a_r3_silver_requirement_backfill --output "$output"
          "$RUNTIME_PYTHON" - "$output" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          print(f"F4A_R8_POST_REFRESH_WOULD_CHANGE={report['would_change_count']}")
          if report["candidate_count"] <= 0 or report["proposal_count"] != report["candidate_count"] or report["blocked_count"] != 0:
              raise SystemExit("F4A_R8_POST_REFRESH_NOT_COMPLETE")
          if report["would_change_count"] != 0 or any(report["boundaries"].values()):
              raise SystemExit("F4A_R8_POST_REFRESH_NOT_CONVERGED")
          print("F4A_R8_POST_REFRESH_CONVERGENCE=PASS")
          PY

      - name: Prove persisted Silver through Product to Control Center
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/f4a_r8_post_refresh_operator_audit.json"
          "$RUNTIME_PYTHON" -m scripts.run_f4a_r3_bronze2e_requirement_audit --output "$output"
          "$RUNTIME_PYTHON" - "$output" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          print(f"F4A_R8_OPERATOR_CANDIDATES={report['candidate_count']}")
          print(f"F4A_R8_OPERATOR_COUNT={report['operator_candidate_count']}")
          print(f"F4A_R8_OPERATOR_COVERAGE_RATIO={report['reachable_without_extractor_gap_ratio']:.4f}")
          print(f"F4A_R8_OPERATOR_LEGACY={report['rows_with_legacy_ambiguous_status']}")
          print(f"F4A_R8_OPERATOR_PROJECTION_LOSS={report['rows_with_silver_to_operator_projection_loss']}")
          print(f"F4A_R8_OPERATOR_VIOLATIONS={report['violating_row_count']}")
          if report["candidate_count"] != report["operator_candidate_count"]:
              raise SystemExit("F4A_R8_OPERATOR_SCOPE_MISMATCH")
          if report["rows_with_legacy_ambiguous_status"] != 0 or report["rows_with_silver_to_operator_projection_loss"] != 0:
              raise SystemExit("F4A_R8_OPERATOR_PROJECTION_FAIL")
          if report["violating_row_count"] != 0 or not report["coverage_gate_pass"]:
              raise SystemExit("F4A_R8_OPERATOR_GATE_FAIL")
          if any(report["boundaries"].values()):
              raise SystemExit("F4A_R8_OPERATOR_BOUNDARY_VIOLATION")
          print("F4A_R8_OPERATOR_GATE=PASS")
          PY

      - name: Verify no migration debt remains
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" scripts/apply_db_migrations.py --status

      - name: Preserve short-lived R8 apply evidence
        uses: actions/upload-artifact@v4
        with:
          name: f4a-r8-operator-apply-${{ github.sha }}
          path: |
            ${{ runner.temp }}/f4a_r8_pre_refresh_plan.json
            ${{ runner.temp }}/f4a_r8_refresh_apply.json
            ${{ runner.temp }}/f4a_r8_post_refresh_plan.json
            ${{ runner.temp }}/f4a_r8_post_refresh_operator_audit.json
          if-no-files-found: error
          retention-days: 1
