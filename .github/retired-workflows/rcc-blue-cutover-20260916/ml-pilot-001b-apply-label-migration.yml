name: ML-PILOT-001B apply label migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ml-pilot-001b-apply-label-migration.yml

permissions:
  contents: read
  issues: write

jobs:
  apply-label-migration:
    name: Apply exact operator-label migration
    runs-on: [self-hosted, Linux, X64, job-pipeline-runtime-linux]
    timeout-minutes: 15
    env:
      RCC_REPOSITORY_ID: "1230805345"
      RCC_REPOSITORY: jenshaberle-dotcom/job-application-pipeline
      RCC_RUNNER_NAME: job-pipeline-runtime-linux
      LABEL_MIGRATION: 101_create_job_review_relevance_label_events.sql
      PROOF_PR_NUMBER: "635"
    steps:
      - name: Resolve verified RCC runtime context
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_NAME" != "$RCC_RUNNER_NAME" ]]; then
            echo "Unexpected self-hosted runner: $RUNNER_NAME" >&2
            exit 2
          fi
          context_file="${RCC_RUNTIME_CONTEXT_FILE:-$HOME/.config/DeepOceanInfrastructure/RCC/runtime-contexts/${RCC_REPOSITORY_ID}-${RCC_RUNNER_NAME}.json}"
          test -f "$context_file" || {
            echo "RCC runtime context is unavailable." >&2
            exit 2
          }
          context_output="$(python3 - "$context_file" "$RCC_REPOSITORY_ID" "$RCC_REPOSITORY" "$RCC_RUNNER_NAME" <<'PY'
          from __future__ import annotations

          import json
          from pathlib import PurePosixPath
          import sys

          context_path, repository_id, repository, runner_name = sys.argv[1:]
          with open(context_path, encoding="utf-8") as handle:
              context = json.load(handle)

          if context.get("RepositoryId") != int(repository_id):
              raise SystemExit("RUNTIME_REPOSITORY_ID_MISMATCH")
          if context.get("Repository") != repository:
              raise SystemExit("RUNTIME_REPOSITORY_ID_MISMATCH")
          if context.get("RunnerName") != runner_name:
              raise SystemExit("RUNTIME_CONTEXT_STALE: runner mismatch")
          if context.get("Platform") != "linux-wsl":
              raise SystemExit("RUNTIME_CONTEXT_STALE: platform mismatch")
          if context.get("Status") != "PASS" or context.get("PrimaryFailure") not in (None, ""):
              raise SystemExit("RUNTIME_CONTEXT_STALE: runtime context is not PASS")

          checks = {
              item.get("Id"): item.get("Status")
              for item in context.get("Checks", [])
              if isinstance(item, dict)
          }
          required = {
              "repository_identity",
              "checkout",
              "checkout_repository",
              "env_file",
              "env_keys",
              "interpreter",
              "interpreter_probe",
              "capability:postgresql",
          }
          failed = sorted(check for check in required if checks.get(check) != "PASS")
          if failed:
              raise SystemExit("RUNTIME_CONTEXT_STALE: required checks not PASS: " + ",".join(failed))

          checkout = context.get("CheckoutRoot")
          interpreter = context.get("Interpreter")
          env_file = context.get("EnvFile")
          for label, value in (("checkout", checkout), ("interpreter", interpreter), ("env_file", env_file)):
              if not isinstance(value, str) or not value.startswith("/") or "\n" in value or "\0" in value:
                  raise SystemExit(f"RUNTIME_CONTEXT_STALE: invalid {label} path")

          checkout_path = PurePosixPath(checkout)
          if checkout_path not in PurePosixPath(interpreter).parents:
              raise SystemExit("RUNTIME_CONTEXT_STALE: interpreter outside checkout")
          if checkout_path not in PurePosixPath(env_file).parents:
              raise SystemExit("RUNTIME_CONTEXT_STALE: env file outside checkout")

          print(checkout)
          print(interpreter)
          PY
          )"
          mapfile -t context_values <<< "$context_output"
          if [[ "${#context_values[@]}" -ne 2 ]]; then
            echo "RCC runtime context returned an invalid projection." >&2
            exit 2
          fi
          printf 'PROJECT_DIR=%s\n' "${context_values[0]}" >> "$GITHUB_ENV"
          printf 'RUNTIME_PYTHON=%s\n' "${context_values[1]}" >> "$GITHUB_ENV"

      - name: Fast-forward persistent checkout to exact triggering main
        shell: bash
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" "$PROJECT_DIR/scripts/prepare_scheduled_pipeline_checkout.py" --root "$PROJECT_DIR" > "$RUNNER_TEMP/ml-pilot-001b-apply-checkout.json"
          actual_sha="$(git -C "$PROJECT_DIR" rev-parse HEAD)"
          if [[ "$actual_sha" != "$GITHUB_SHA" ]]; then
            echo "Persistent checkout does not match triggering main revision." >&2
            echo "expected=$GITHUB_SHA actual=$actual_sha" >&2
            exit 3
          fi
          if [[ -n "$(git -C "$PROJECT_DIR" status --porcelain=v1)" ]]; then
            echo "Persistent checkout is not clean after preflight." >&2
            exit 3
          fi
          echo "Persistent checkout identity and exact main revision verified."

      - name: Gate exact migration from read-only status
        shell: bash
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/ml-pilot-001b-pre-apply-status.txt"
          (
            cd "$PROJECT_DIR"
            "$RUNTIME_PYTHON" -m scripts.apply_db_migrations --status
          ) | tee "$status_file"

          "$RUNTIME_PYTHON" - "$status_file" "$LABEL_MIGRATION" <<'PY' >> "$GITHUB_ENV"
          from __future__ import annotations

          from pathlib import Path
          import sys

          status_path = Path(sys.argv[1])
          target = sys.argv[2]
          lines = status_path.read_text(encoding="utf-8").splitlines()
          values: dict[str, str] = {}
          pending: list[str] = []
          in_pending = False
          for line in lines:
              if line == "Pending migrations:":
                  in_pending = True
                  continue
              if in_pending and line.startswith("- "):
                  pending.append(line[2:].strip())
                  continue
              if in_pending and line and not line.startswith("- "):
                  in_pending = False
              if ": " in line:
                  key, value = line.split(": ", 1)
                  values[key.strip()] = value.strip()

          required = {"tracking_table_exists", "pending_migrations", "checksum_mismatches"}
          missing = sorted(required - set(values))
          if missing:
              raise SystemExit(f"LABEL_MIGRATION_GATE_INVALID: missing fields {missing}")
          if values["tracking_table_exists"] != "true":
              raise SystemExit("LABEL_MIGRATION_GATE_BLOCKED: tracking table unavailable")
          if int(values["checksum_mismatches"]) != 0:
              raise SystemExit("LABEL_MIGRATION_GATE_BLOCKED: checksum mismatch exists")

          if pending == []:
              print("LABEL_APPLY_REQUIRED=false")
              print("LABEL_PRE_APPLY_PENDING=0")
          elif pending == [target]:
              print("LABEL_APPLY_REQUIRED=true")
              print("LABEL_PRE_APPLY_PENDING=1")
          else:
              raise SystemExit(
                  "LABEL_MIGRATION_GATE_BLOCKED: exact target is not sole pending migration: "
                  + repr(pending)
              )
          PY

      - name: Apply exactly migration 101
        if: env.LABEL_APPLY_REQUIRED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$PROJECT_DIR"
            "$RUNTIME_PYTHON" -m scripts.apply_db_migrations \
              --apply-exact "$LABEL_MIGRATION" \
              --require-sole-pending \
              --applied-by ml-pilot-001b
          ) | tee "$RUNNER_TEMP/ml-pilot-001b-exact-apply.txt"

      - name: Validate schema and persist safe receipt
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          post_status="$RUNNER_TEMP/ml-pilot-001b-post-apply-status.txt"
          (
            cd "$PROJECT_DIR"
            "$RUNTIME_PYTHON" -m scripts.apply_db_migrations --status
          ) | tee "$post_status"

          "$RUNTIME_PYTHON" - "$post_status" "$LABEL_MIGRATION" "$GITHUB_SHA" "$LABEL_APPLY_REQUIRED" "$LABEL_PRE_APPLY_PENDING" "$GITHUB_TOKEN" "$RCC_REPOSITORY" "$PROOF_PR_NUMBER" <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          import sys
          from urllib.request import Request, urlopen

          import psycopg
          from psycopg.rows import dict_row

          from src.config import get_database_config

          status_path = Path(sys.argv[1])
          target = sys.argv[2]
          main_sha = sys.argv[3]
          apply_required = sys.argv[4] == "true"
          pre_pending = int(sys.argv[5])
          token = sys.argv[6]
          repository = sys.argv[7]
          issue_number = sys.argv[8]

          lines = status_path.read_text(encoding="utf-8").splitlines()
          values: dict[str, str] = {}
          pending: list[str] = []
          in_pending = False
          for line in lines:
              if line == "Pending migrations:":
                  in_pending = True
                  continue
              if in_pending and line.startswith("- "):
                  pending.append(line[2:].strip())
                  continue
              if in_pending and line and not line.startswith("- "):
                  in_pending = False
              if ": " in line:
                  key, value = line.split(": ", 1)
                  values[key.strip()] = value.strip()

          if values.get("tracking_table_exists") != "true":
              raise SystemExit("LABEL_MIGRATION_POSTCHECK_FAILED: tracking table unavailable")
          if int(values.get("checksum_mismatches", "-1")) != 0:
              raise SystemExit("LABEL_MIGRATION_POSTCHECK_FAILED: checksum mismatch exists")
          if target in pending:
              raise SystemExit("LABEL_MIGRATION_POSTCHECK_FAILED: target migration remains pending")
          if pending:
              raise SystemExit("LABEL_MIGRATION_POSTCHECK_FAILED: unexpected pending migrations remain")

          with psycopg.connect(**get_database_config(), row_factory=dict_row) as conn:
              with conn.cursor() as cur:
                  cur.execute(
                      """
                      SELECT
                          to_regclass('public.job_review_relevance_label_events')::text AS label_table,
                          to_regclass('public.gold_job_review_relevance_labels')::text AS label_view,
                          EXISTS (
                              SELECT 1
                              FROM pg_trigger
                              WHERE tgrelid = 'public.job_review_relevance_label_events'::regclass
                                AND tgname = 'trg_job_review_relevance_label_events_append_only'
                                AND NOT tgisinternal
                          ) AS append_only_trigger;
                      """
                  )
                  schema = dict(cur.fetchone() or {})

          if schema.get("label_table") != "job_review_relevance_label_events":
              raise SystemExit("LABEL_MIGRATION_POSTCHECK_FAILED: label table missing")
          if schema.get("label_view") != "gold_job_review_relevance_labels":
              raise SystemExit("LABEL_MIGRATION_POSTCHECK_FAILED: label view missing")
          if schema.get("append_only_trigger") is not True:
              raise SystemExit("LABEL_MIGRATION_POSTCHECK_FAILED: append-only trigger missing")

          safe = {
              "schema_version": "ml-pilot-001b-label-migration-runtime-proof/v1",
              "status": "pass",
              "main_sha": main_sha,
              "migration": target,
              "migration_applied_by_this_run": apply_required,
              "pre_apply_pending_migrations": pre_pending,
              "post_apply_pending_migrations": len(pending),
              "checksum_mismatches": 0,
              "label_table_present": True,
              "label_view_present": True,
              "append_only_trigger_present": True,
              "label_writes": 0,
              "provider_requests": 0,
              "ranking_mutations": 0,
              "application_actions": 0,
          }
          print("ML_PILOT_001B_LABEL_MIGRATION_PROOF=" + json.dumps(safe, sort_keys=True))

          marker = "<!-- ml-pilot-001b-label-migration-runtime-proof -->"
          base_url = f"https://api.github.com/repos/{repository}/issues/{issue_number}/comments"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "job-pipeline-ml-pilot-001b-migration/1.0",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          with urlopen(Request(base_url, headers=headers), timeout=20) as response:  # noqa: S310 - fixed GitHub API origin.
              comments = json.load(response)
          needle = f'"main_sha": "{main_sha}"'
          if any(marker in str(item.get("body") or "") and needle in str(item.get("body") or "") for item in comments):
              print("Label migration runtime proof already persisted for this main SHA.")
              raise SystemExit(0)

          body = (
              f"{marker}\n"
              "ML-PILOT-001B label migration runtime proof: **PASS**\n\n"
              "Schema-only bounded migration proof; no operator label was fabricated.\n\n"
              "```json\n"
              + json.dumps(safe, indent=2, sort_keys=True)
              + "\n```"
          )
          request = Request(
              base_url,
              data=json.dumps({"body": body}).encode("utf-8"),
              headers={**headers, "Content-Type": "application/json"},
              method="POST",
          )
          with urlopen(request, timeout=20) as response:  # noqa: S310 - fixed GitHub API origin.
              result = json.load(response)
          if not result.get("id"):
              raise SystemExit("LABEL_MIGRATION_PROOF_PERSISTENCE_FAILED")
          print("Label migration runtime proof persisted to PR discussion.")
          PY
